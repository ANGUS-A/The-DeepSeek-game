<style>
  /* ================= 主題變數（預設：櫻花粉，淺色系） ================= */
  body, body[data-theme="pink"] {
    --bg-page: #fff0f5;
    --card-1: rgba(255, 240, 245, 0.85);
    --card-2: rgba(255, 228, 236, 0.92);
    --header-1: rgba(255, 235, 242, 0.92);
    --header-2: rgba(255, 220, 232, 0.85);
    --accent-1: #ff9eb5;
    --accent-2: #ff7d9c;
    --accent-3: #ffb6c1;
    --accent-soft: rgba(255, 182, 193, 0.35);
    --accent-glow: rgba(255, 143, 163, 0.5);
    --text-1: #4a2c3a;
    --text-2: rgba(74, 44, 58, 0.7);
    --text-3: rgba(74, 44, 58, 0.45);
    --bubble-user-bg: linear-gradient(135deg, #ff9eb5, #ff7d9c);
    --bubble-bot-bg: rgba(255, 250, 252, 0.95);
    --border-soft: rgba(255, 182, 193, 0.4);
    --border-medium: rgba(255, 143, 163, 0.5);
    --border-strong: rgba(255, 125, 156, 0.75);
    /* 新增：上傳按鈕專用色（參考截圖的粉紫色） */
    --upload-btn-bg: linear-gradient(135deg, #e0b3ff, #c47dff);
    --upload-btn-icon: #1a0d2e;
  }

  body[data-theme="deepred"] {
    --bg-page: #1a0406; --card-1: rgba(70, 15, 20, 0.78); --card-2: rgba(40, 5, 10, 0.88); --header-1: rgba(60, 12, 18, 0.85); --header-2: rgba(85, 20, 28, 0.65); --accent-1: #e63535; --accent-2: #ff5a5a; --accent-3: #ff8080; --accent-soft: rgba(230, 53, 53, 0.4); --accent-glow: rgba(255, 90, 90, 0.7); --text-1: #fff0f0; --text-2: rgba(255, 180, 180, 0.75); --text-3: rgba(255, 150, 150, 0.5); --bubble-user-bg: linear-gradient(135deg, #c02020, #ff5050); --bubble-bot-bg: linear-gradient(135deg, rgba(70, 15, 20, 0.9), rgba(40, 5, 10, 0.9)); --border-soft: rgba(230, 53, 53, 0.25); --border-medium: rgba(230, 53, 53, 0.4); --border-strong: rgba(255, 90, 90, 0.7); --upload-btn-bg: linear-gradient(135deg, #c02020, #ff5050); --upload-btn-icon: #ffffff;
  }

  body[data-theme="deeppurple"] {
    --bg-page: #05000d; --card-1: rgba(42, 0, 80, 0.78); --card-2: rgba(21, 0, 41, 0.88); --header-1: rgba(21, 0, 41, 0.85); --header-2: rgba(42, 0, 80, 0.65); --accent-1: #7b2fbe; --accent-2: #b026ff; --accent-3: #e0aaff; --accent-soft: rgba(176, 38, 255, 0.4); --accent-glow: rgba(199, 125, 255, 0.7); --text-1: #f0e5ff; --text-2: rgba(199, 125, 255, 0.75); --text-3: rgba(199, 125, 255, 0.5); --bubble-user-bg: linear-gradient(135deg, #7b2fbe, #b026ff); --bubble-bot-bg: linear-gradient(135deg, rgba(42, 0, 80, 0.9), rgba(21, 0, 41, 0.9)); --border-soft: rgba(176, 38, 255, 0.25); --border-medium: rgba(176, 38, 255, 0.4); --border-strong: rgba(224, 170, 255, 0.7); --upload-btn-bg: linear-gradient(135deg, #7b2fbe, #b026ff); --upload-btn-icon: #ffffff;
  }

  body[data-theme="deepblue"] {
    --bg-page: #03080f; --card-1: rgba(10, 30, 60, 0.78); --card-2: rgba(5, 15, 35, 0.88); --header-1: rgba(5, 15, 35, 0.85); --header-2: rgba(10, 30, 60, 0.65); --accent-1: #1e5fbb; --accent-2: #3a8fff; --accent-3: #7db8ff; --accent-soft: rgba(58, 143, 255, 0.4); --accent-glow: rgba(125, 184, 255, 0.7); --text-1: #e8f2ff; --text-2: rgba(150, 195, 255, 0.75); --text-3: rgba(150, 195, 255, 0.5); --bubble-user-bg: linear-gradient(135deg, #1e5fbb, #3a8fff); --bubble-bot-bg: linear-gradient(135deg, rgba(10, 30, 60, 0.9), rgba(5, 15, 35, 0.9)); --border-soft: rgba(58, 143, 255, 0.25); --border-medium: rgba(58, 143, 255, 0.4); --border-strong: rgba(125, 184, 255, 0.7); --upload-btn-bg: linear-gradient(135deg, #1e5fbb, #3a8fff); --upload-btn-icon: #ffffff;
  }

  body[data-theme="lightblue"] {
    --bg-page: #041018; --card-1: rgba(20, 70, 100, 0.75); --card-2: rgba(10, 40, 65, 0.85); --header-1: rgba(10, 40, 65, 0.85); --header-2: rgba(20, 70, 100, 0.65); --accent-1: #1e9dd9; --accent-2: #4dc6ff; --accent-3: #8fe0ff; --accent-soft: rgba(77, 198, 255, 0.4); --accent-glow: rgba(143, 224, 255, 0.7); --text-1: #e6f8ff; --text-2: rgba(140, 210, 245, 0.75); --text-3: rgba(140, 210, 245, 0.5); --bubble-user-bg: linear-gradient(135deg, #1e9dd9, #4dc6ff); --bubble-bot-bg: linear-gradient(135deg, rgba(20, 70, 100, 0.9), rgba(10, 40, 65, 0.9)); --border-soft: rgba(77, 198, 255, 0.25); --border-medium: rgba(77, 198, 255, 0.4); --border-strong: rgba(143, 224, 255, 0.7); --upload-btn-bg: linear-gradient(135deg, #1e9dd9, #4dc6ff); --upload-btn-icon: #ffffff;
  }

  body[data-theme="green"] {
    --bg-page: #031207; --card-1: rgba(15, 65, 30, 0.78); --card-2: rgba(5, 35, 15, 0.88); --header-1: rgba(5, 35, 15, 0.85); --header-2: rgba(15, 65, 30, 0.65); --accent-1: #146b32; --accent-2: #1e9e4a; --accent-3: #3ac46e; --accent-soft: rgba(30, 158, 74, 0.4); --accent-glow: rgba(58, 196, 110, 0.7); --text-1: #e6ffef; --text-2: rgba(140, 220, 175, 0.75); --text-3: rgba(140, 220, 175, 0.5); --bubble-user-bg: linear-gradient(135deg, #146b32, #1e9e4a); --bubble-bot-bg: linear-gradient(135deg, rgba(15, 65, 30, 0.9), rgba(5, 35, 15, 0.9)); --border-soft: rgba(30, 158, 74, 0.25); --border-medium: rgba(30, 158, 74, 0.4); --border-strong: rgba(58, 196, 110, 0.7); --upload-btn-bg: linear-gradient(135deg, #146b32, #1e9e4a); --upload-btn-icon: #ffffff;
  }

  body[data-theme="yellow"] {
    --bg-page: #14100a; --card-1: rgba(85, 65, 15, 0.75); --card-2: rgba(50, 35, 5, 0.85); --header-1: rgba(50, 35, 5, 0.85); --header-2: rgba(85, 65, 15, 0.65); --accent-1: #d9a820; --accent-2: #ffcc40; --accent-3: #ffe080; --accent-soft: rgba(255, 204, 64, 0.4); --accent-glow: rgba(255, 224, 128, 0.7); --text-1: #fff9e6; --text-2: rgba(230, 210, 150, 0.75); --text-3: rgba(230, 210, 150, 0.5); --bubble-user-bg: linear-gradient(135deg, #d9a820, #ffcc40); --bubble-bot-bg: linear-gradient(135deg, rgba(85, 65, 15, 0.9), rgba(50, 35, 5, 0.9)); --border-soft: rgba(255, 204, 64, 0.25); --border-medium: rgba(255, 204, 64, 0.4); --border-strong: rgba(255, 224, 128, 0.7); --upload-btn-bg: linear-gradient(135deg, #d9a820, #ffcc40); --upload-btn-icon: #1a1200;
  }

  body[data-theme="orange"] {
    --bg-page: #140803; --card-1: rgba(85, 40, 10, 0.75); --card-2: rgba(50, 20, 5, 0.85); --header-1: rgba(50, 20, 5, 0.85); --header-2: rgba(85, 40, 10, 0.65); --accent-1: #d96720; --accent-2: #ff8b3a; --accent-3: #ffb37a; --accent-soft: rgba(255, 139, 58, 0.4); --accent-glow: rgba(255, 179, 122, 0.7); --text-1: #fff3e6; --text-2: rgba(235, 180, 140, 0.75); --text-3: rgba(235, 180, 140, 0.5); --bubble-user-bg: linear-gradient(135deg, #d96720, #ff8b3a); --bubble-bot-bg: linear-gradient(135deg, rgba(85, 40, 10, 0.9), rgba(50, 20, 5, 0.9)); --border-soft: rgba(255, 139, 58, 0.25); --border-medium: rgba(255, 139, 58, 0.4); --border-strong: rgba(255, 179, 122, 0.7); --upload-btn-bg: linear-gradient(135deg, #d96720, #ff8b3a); --upload-btn-icon: #ffffff;
  }

  body[data-theme="mono"] {
    --bg-page: #0a0a0a; --card-1: rgba(30, 30, 30, 0.78); --card-2: rgba(15, 15, 15, 0.88); --header-1: rgba(15, 15, 15, 0.85); --header-2: rgba(30, 30, 30, 0.65); --accent-1: #888888; --accent-2: #b0b0b0; --accent-3: #e0e0e0; --accent-soft: rgba(176, 176, 176, 0.4); --accent-glow: rgba(224, 224, 224, 0.7); --text-1: #f0f0f0; --text-2: rgba(200, 200, 200, 0.75); --text-3: rgba(200, 200, 200, 0.5); --bubble-user-bg: linear-gradient(135deg, #555555, #909090); --bubble-bot-bg: linear-gradient(135deg, rgba(30, 30, 30, 0.9), rgba(15, 15, 15, 0.9)); --border-soft: rgba(176, 176, 176, 0.25); --border-medium: rgba(176, 176, 176, 0.4); --border-strong: rgba(224, 224, 224, 0.7); --upload-btn-bg: linear-gradient(135deg, #555555, #909090); --upload-btn-icon: #ffffff;
  }

  /* ================= 基礎重置 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  html, body { height: 100%; overflow: hidden; }
  body { 
    background: var(--bg-page); 
    display: flex; justify-content: center; align-items: center; 
    padding: 16px; margin: 0; position: relative;
    transition: background 0.4s ease;
  }

  :root { --apple-spring: cubic-bezier(0.32, 0.72, 0, 1); }

  /* ================= 粉色主題特殊適配（淺色系） ================= */
  body[data-theme="pink"] .aurora-bg { opacity: 0.45; }
  body[data-theme="pink"] .star {
    background: radial-gradient(circle, #ffb6c1, rgba(255, 143, 163, 0.3) 50%, transparent 70%);
    box-shadow: 0 0 8px rgba(255, 182, 193, 0.6);
  }
  body[data-theme="pink"] .app-container {
    box-shadow: 0 30px 80px -20px rgba(255, 143, 163, 0.25), 0 0 60px rgba(255, 182, 193, 0.15);
  }
  body[data-theme="pink"] .bubble strong,
  body[data-theme="pink"] .bubble h1,
  body[data-theme="pink"] .bubble h2,
  body[data-theme="pink"] .bubble h3 { color: #d63384; }
  body[data-theme="pink"] .bubble code:not(pre code) {
    background: rgba(255, 143, 163, 0.18);
    color: #d63384;
  }
  body[data-theme="pink"] .bubble pre {
    background: rgba(255, 240, 245, 0.95) !important;
    border-color: rgba(255, 143, 163, 0.4);
  }
  body[data-theme="pink"] .bubble pre code { color: #4a2c3a; }
  body[data-theme="pink"] .bubble table { border-color: rgba(255, 143, 163, 0.4); }
  body[data-theme="pink"] .bubble th {
    background: rgba(255, 143, 163, 0.15);
    color: #d63384;
  }
  body[data-theme="pink"] .bubble td { border-color: rgba(255, 143, 163, 0.2); }
  body[data-theme="pink"] .bubble blockquote {
    border-left-color: #ff9eb5;
    background: linear-gradient(90deg, rgba(255, 182, 193, 0.15), transparent);
  }
  body[data-theme="pink"] .bubble a { color: #d63384; }
  body[data-theme="pink"] .typing-indicator span {
    background: radial-gradient(circle at 30% 30%, #ff7d9c, #ff9eb5);
    box-shadow: 0 0 10px rgba(255, 143, 163, 0.6);
  }
  body[data-theme="pink"] .followup-chip { color: #4a2c3a; }
  body[data-theme="pink"] .message.user .bubble { color: #ffffff; }

  /* ================= 背景 ================= */
  .aurora-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora-layer { position: absolute; inset: -50%; filter: blur(70px); opacity: 0.85; }
  .aurora-1 { background: radial-gradient(circle at 20% 30%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 80% 70%, var(--accent-glow) 0%, transparent 45%); animation: aurora1 22s ease-in-out infinite alternate; }
  .aurora-2 { background: radial-gradient(circle at 70% 20%, var(--card-2) 0%, transparent 50%), radial-gradient(circle at 30% 80%, var(--accent-soft) 0%, transparent 50%); animation: aurora2 28s ease-in-out infinite alternate; }
  .aurora-3 { background: radial-gradient(circle at 50% 50%, var(--accent-soft) 0%, transparent 60%), radial-gradient(circle at 15% 85%, var(--accent-glow) 0%, transparent 50%); animation: aurora3 25s ease-in-out infinite alternate; }
  .aurora-4 { background: radial-gradient(circle at 85% 40%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 25% 55%, var(--accent-glow) 0%, transparent 50%); animation: aurora4 32s ease-in-out infinite alternate; }
  @keyframes aurora1 { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 100% { transform: translate(10%, -8%) rotate(15deg) scale(1.15); } }
  @keyframes aurora2 { 0% { transform: translate(0, 0) rotate(0deg) scale(1.1); } 100% { transform: translate(-10%, 8%) rotate(-12deg) scale(1); } }
  @keyframes aurora3 { 0% { transform: translate(-5%, 5%) rotate(-5deg); } 100% { transform: translate(8%, -6%) rotate(8deg); } }
  @keyframes aurora4 { 0% { transform: translate(5%, 5%) rotate(8deg) scale(1); } 100% { transform: translate(-8%, -5%) rotate(-10deg) scale(1.1); } }

  .stars-bg { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: radial-gradient(circle, var(--accent-3), var(--accent-soft) 50%, transparent 70%); box-shadow: 0 0 12px var(--accent-glow), 0 0 24px var(--accent-soft); animation: starFloat linear infinite, starTwinkle ease-in-out infinite alternate; opacity: 0; }
  @keyframes starFloat { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.4; } 100% { transform: translateY(-110vh) translateX(50px); opacity: 0; } }
  @keyframes starTwinkle { 0% { filter: brightness(0.7); } 100% { filter: brightness(1.6); } }

  /* ================= 主容器 ================= */
  .app-container {
    position: relative; z-index: 5; width: 100%; max-width: 780px; height: 90vh; max-height: 820px;
    background: linear-gradient(135deg, var(--card-1), var(--card-2));
    backdrop-filter: blur(34px) saturate(200%); -webkit-backdrop-filter: blur(34px) saturate(200%);
    border: 1px solid var(--border-medium); border-radius: 44px; overflow: hidden;
    transition: transform 0.5s var(--apple-spring), box-shadow 0.8s ease, background 0.4s ease;
    animation: cardEntrance 1.4s var(--apple-spring) both, cardFloat 8s ease-in-out infinite alternate;
    transform-style: preserve-3d; isolation: isolate;
  }
  @keyframes cardEntrance { 0% { opacity: 0; transform: translateY(60px) scale(0.85) rotateX(15deg); filter: blur(15px); } 100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); filter: blur(0); } }
  @keyframes cardFloat { 0% { transform: translateY(0px) rotateZ(0deg); } 100% { transform: translateY(-10px) rotateZ(0.5deg); } }
  .app-container::after { content: ''; position: absolute; inset: 0; border-radius: 44px; background: radial-gradient(ellipse at 50% -20%, var(--accent-soft), transparent 60%); pointer-events: none; z-index: 1; }
  .app-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-3), var(--accent-2), var(--accent-1), transparent); background-size: 300% 100%; animation: topScan 4s linear infinite; z-index: 15; border-radius: 44px 44px 0 0; box-shadow: 0 0 20px var(--accent-glow); }
  @keyframes topScan { 0% { background-position: 300% 0; } 100% { background-position: -300% 0; } }

  /* ================= 視圖切換 ================= */
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform 0.6s var(--apple-spring), opacity 0.5s ease; backface-visibility: hidden; }
  .view-hidden { opacity: 0; pointer-events: none; transform: translateX(-12%) scale(0.96); filter: blur(8px); }
  .view-right-hidden { opacity: 0; pointer-events: none; transform: translateX(100%); filter: blur(8px); }

  /* ================= 會話列表 ================= */
  .list-header { padding: 20px 22px 16px; background: linear-gradient(135deg, var(--header-1), var(--header-2)); border-bottom: 1px solid var(--border-soft); backdrop-filter: blur(16px); position: relative; overflow: hidden; }
  .list-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .list-title { font-size: 1.5rem; font-weight: 800; letter-spacing: 1.5px; background: linear-gradient(90deg, var(--accent-2), var(--accent-3), var(--accent-1), var(--accent-2)); background-size: 300% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: titleGradient 5s linear infinite; display: flex; align-items: center; gap: 10px; }
  @keyframes titleGradient { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }
  .list-title .title-icon { font-size: 1.5rem; -webkit-text-fill-color: initial; color: var(--accent-2); filter: drop-shadow(0 0 12px var(--accent-glow)); }
  .settings-btn {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    background: var(--bubble-bot-bg);
    border: 1px solid var(--border-medium);
    color: var(--accent-2);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.4s var(--apple-spring);
    flex-shrink: 0;
  }
  .settings-btn:hover { transform: rotate(60deg) scale(1.1); border-color: var(--border-strong); box-shadow: 0 0 25px var(--accent-glow); }
  .settings-btn:active { transform: rotate(60deg) scale(0.95); }
  .list-subtitle { font-size: 0.78rem; color: var(--text-3); margin-top: 6px; letter-spacing: 0.3px; }
  .conversation-list { flex: 1; overflow-y: auto; padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 8px; background: radial-gradient(ellipse at 30% 10%, var(--accent-soft), transparent 70%); }
  .conversation-list::-webkit-scrollbar { width: 8px; } .conversation-list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent-1), var(--accent-2)); border-radius: 20px; }
  .conv-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: var(--bubble-bot-bg); border: 1px solid var(--border-soft); cursor: pointer; transition: all 0.5s var(--apple-spring); animation: convAppear 0.7s var(--apple-spring) both; }
  @keyframes convAppear { 0% { opacity: 0; transform: translateX(-30px) scale(0.9); filter: blur(6px); } 100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); } }
  .conv-item:hover { border-color: var(--border-strong); transform: translateX(6px) scale(1.01); box-shadow: 0 12px 30px -6px var(--accent-soft), 0 0 30px var(--accent-soft); }
  .conv-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; border: 2px solid var(--border-medium); box-shadow: 0 0 20px var(--accent-soft); animation: avatarPulse 3s ease-in-out infinite; }
  @keyframes avatarPulse { 0%, 100% { box-shadow: 0 0 20px var(--accent-soft); } 50% { box-shadow: 0 0 35px var(--accent-glow), 0 0 0 4px var(--accent-soft); } }
  .avatar-1 { background: var(--bubble-user-bg); } .avatar-2 { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); } .avatar-3 { background: linear-gradient(135deg, var(--accent-2), var(--accent-3)); } .avatar-4 { background: linear-gradient(135deg, var(--card-2), var(--accent-1)); }
  .conv-content { flex: 1; min-width: 0; } .conv-name { font-size: 1rem; font-weight: 600; color: var(--text-1); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .conv-time { font-size: 0.72rem; color: var(--text-3); } .conv-preview { font-size: 0.82rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ================= 聊天視圖 ================= */
  .chat-header { padding: 14px 18px; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, var(--header-1), var(--header-2)); border-bottom: 1px solid var(--border-soft); backdrop-filter: blur(16px); position: relative; z-index: 2; }
  .back-btn { background: var(--bubble-bot-bg); border: 1px solid var(--border-medium); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--accent-2); cursor: pointer; transition: all 0.4s var(--apple-spring); flex-shrink: 0; }
  .back-btn:hover { transform: scale(1.12) translateX(-3px); border-color: var(--border-strong); box-shadow: 0 0 25px var(--accent-soft); }
  .back-btn:active { transform: scale(0.92); }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-name { font-size: 1.05rem; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
  .chat-header-status { font-size: 0.72rem; color: var(--text-2); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 8px var(--accent-glow); animation: statusPulse 2s ease-in-out infinite; }
  @keyframes statusPulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  .api-input-wrapper { display: flex; align-items: center; background: var(--bubble-bot-bg); border-radius: 100px; padding: 2px 2px 2px 16px; border: 1px solid var(--border-medium); transition: all 0.4s var(--apple-spring); margin-top: 10px; }
  .api-input-wrapper:focus-within { border-color: var(--border-strong); box-shadow: 0 0 0 4px var(--accent-soft), 0 0 50px var(--accent-soft); }

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>

  <div class="view view-right-hidden" id="chatView">

            <div class="theme-swatch theme-pink" data-theme="pink"><span>粉色</span></div>

            <div class="theme-swatch theme-deeppurple" data-theme="deeppurple"><span>深紫</span></div>
            <div class="theme-swatch theme-deepblue" data-theme="deepblue"><span>深藍</span></div>
            <div class="theme-swatch theme-lightblue" data-theme="lightblue"><span>淺藍</span></div>

          <div class="perf-options" id="perfOptions">
            <button class="perf-option" data-perf="low"><span class="perf-icon">⚡</span>極低</button>
            <button class="perf-option" data-perf="normal"><span class="perf-icon">✨</span>一般</button>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
(function() {
  let savedTheme = localStorage.getItem('deepseek_theme') || 'pink';
  let savedPerf = localStorage.getItem('deepseek_perf') || 'normal';
  document.body.dataset.theme = savedTheme;
  document.body.dataset.perf = savedPerf;

  const conversations = [
    { id: 'normal', emoji: '💬', title: '正常對話', preview: '你好！我是 DeepSeek 助手...', time: '剛剛', avatarClass: 'avatar-1', status: '在线 · DeepSeek 已连接', welcome: '你好！我是 DeepSeek 助手 ✨<br><br>请先输入 API 密钥，然后就可以开始对话了。<br><br><span style="color: var(--text-3); font-size: 0.85em;">💡 点击任意气泡即可复制内容，也可以上传图片</span>', history: [] },
    { id: 'roleplay', emoji: '🎭', title: '角色扮演', preview: '你是我的专属武侠小说家...', time: '昨天', avatarClass: 'avatar-2', status: '角色模式 · 武侠世界', welcome: '欢迎来到武侠世界 🗡️<br><br>我是你的专属武侠小说家。请告诉我你想扮演的角色或想展开的剧情。', history: [] },
    { id: 'game', emoji: '🎮', title: '游戏询问', preview: '最近有什么好玩的游戏...', time: '昨天', avatarClass: 'avatar-3', status: '游戏助手 · 在线', welcome: '你好！我是你的游戏助手 🎮<br><br>想找新游戏？想了解攻略？还是想聊聊最近的热门大作？', history: [] },
    { id: 'study', emoji: '📚', title: '学习助手', preview: '帮我解释一下量子力学...', time: '星期一', avatarClass: 'avatar-4', status: '学习模式 · 专注中', welcome: '你好！我是你的学习助手 📚<br><br>无论是数学、物理、编程还是语言学习，我都能帮你。', history: [] }
  ];

  let currentConversation = null;
  let apiKey = localStorage.getItem('deepseek_api_key') || '';
  let isWaitingForResponse = false;
  let autoFollowupEnabled = false;
  let pendingImages = []; // 待發送的圖片（{file, dataUrl}）

  const appContainer = document.getElementById('appContainer');
  const listView = document.getElementById('listView');
  const chatView = document.getElementById('chatView');
  const conversationList = document.getElementById('conversationList');
  const backBtn = document.getElementById('backBtn');
  const chatHeaderEmoji = document.getElementById('chatHeaderEmoji');
  const chatHeaderTitle = document.getElementById('chatHeaderTitle');
  const chatHeaderStatus = document.getElementById('chatHeaderStatus');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveApiBtn = document.getElementById('saveApiBtn');
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const toastEl = document.getElementById('toast');
  const starsBg = document.getElementById('starsBg');
  const followupList = document.getElementById('followupList');
  const autoFollowupToggle = document.getElementById('autoFollowup');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsBack = document.getElementById('settingsBack');
  const themeGrid = document.getElementById('themeGrid');
  const perfOptions = document.getElementById('perfOptions');
  const plusBtn = document.getElementById('plusBtn');
  const imageIconBtn = document.getElementById('imageIconBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewBar = document.getElementById('imagePreviewBar');

  if (apiKey) apiKeyInput.value = apiKey;

  // ================= 設定邏輯 =================
  document.querySelectorAll('.theme-swatch').forEach(sw => {
    if (sw.dataset.theme === savedTheme) sw.classList.add('active');
    sw.addEventListener('click', () => {
      document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      document.body.dataset.theme = sw.dataset.theme;
      localStorage.setItem('deepseek_theme', sw.dataset.theme);
    });
  });

  document.querySelectorAll('.perf-option').forEach(op => {
    if (op.dataset.perf === savedPerf) op.classList.add('active');
    op.addEventListener('click', () => {
      document.querySelectorAll('.perf-option').forEach(o => o.classList.remove('active'));
      op.classList.add('active');
      document.body.dataset.perf = op.dataset.perf;
      localStorage.setItem('deepseek_perf', op.dataset.perf);
      showToast(op.dataset.perf === 'low' ? '⚡ 已切換到極低細節' : op.dataset.perf === 'high' ? '💎 已切換到極高細節' : '✨ 已切換到一般細節');
    });
  });

  settingsBtn.addEventListener('click', () => settingsOverlay.classList.add('open'));
  settingsBack.addEventListener('click', () => settingsOverlay.classList.remove('open'));
  settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

  // ================= 渲染列表 =================
  function renderConversationList() {
    conversationList.innerHTML = '';
    conversations.forEach((conv, i) => {
      const item = document.createElement('div');
      item.className = 'conv-item';
      item.style.animationDelay = (i * 0.1) + 's';
      item.innerHTML = `
        <div class="conv-avatar ${conv.avatarClass}">${conv.emoji}</div>
        <div class="conv-content">
          <div class="conv-name"><span>${conv.title}</span><span class="conv-time">${conv.time}</span></div>
          <div class="conv-preview">${conv.preview}</div>
        </div>`;
      item.addEventListener('click', () => openConversation(conv));
      conversationList.appendChild(item);
    });
  }

  function openConversation(conv) {
    currentConversation = conv;
    chatHeaderEmoji.textContent = conv.emoji;
    chatHeaderTitle.textContent = conv.title;
    chatHeaderStatus.textContent = conv.status;

    chatMessages.innerHTML = '';
    if (conv.history.length === 0) {
      addMessageToUI('bot', conv.welcome, true);
      conv.history.push({ role: 'assistant', content: conv.welcome, isHTML: true });
    } else {
      conv.history.forEach(msg => {
        if (msg.images && msg.images.length > 0) {
          addImageMessageToUI('user', msg.images);
        }
        if (msg.content) {
          addMessageToUI(msg.role === 'user' ? 'user' : 'bot', msg.content, msg.isHTML);
        }
      });
    }

    listView.classList.add('view-hidden');
    chatView.classList.remove('view-right-hidden');
    setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; messageInput.focus(); }, 500);
  }

  backBtn.addEventListener('click', () => {
    listView.classList.remove('view-hidden');
    chatView.classList.add('view-right-hidden');
    setTimeout(() => { currentConversation = null; }, 600);
  });

  // ================= 3D 傾斜 =================
  if (savedPerf !== 'low') {
    appContainer.addEventListener('mousemove', (e) => {
      const rect = appContainer.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      appContainer.style.transform = `perspective(1500px) rotateY(${x * 2.5}deg) rotateX(${-y * 2.5}deg) translateY(-4px)`;
    });
    appContainer.addEventListener('mouseleave', () => { appContainer.style.transform = ''; });
  }

  // ================= 星塵 =================
  function createStars() {
    if (savedPerf === 'low') return;
    const count = savedPerf === 'high' ? 100 : 70;
    starsBg.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.bottom = '-20px';
      const size = Math.random() * 4 + 1.5;
      star.style.width = size + 'px'; star.style.height = size + 'px';
      star.style.animationDuration = (Math.random() * 20 + 15) + 's, ' + (Math.random() * 2 + 1.5) + 's';
      star.style.animationDelay = (Math.random() * 20) + 's, ' + (Math.random() * 2) + 's';
      starsBg.appendChild(star);
    }
  }
  createStars();

  // ================= Toast =================
  function showToast(text, duration = 2000) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  // ================= 複製 =================
  function copyBubbleContent(bubble, e) {
    let text = bubble.innerText || bubble.textContent || '';
    text = text.trim(); if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      bubble.style.transition = 'transform 0.3s var(--apple-spring)';
      bubble.style.transform = 'scale(1.05)';
      setTimeout(() => bubble.style.transform = '', 300);
      showToast('✨ 已複製到剪貼板');
    }).catch(() => {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('✨ 已複製');
    });
  }

  // ================= 保存密鑰 =================
  saveApiBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (!key) { showToast('密钥不能为空'); return; }
    apiKey = key; localStorage.setItem('deepseek_api_key', key); showToast('✅ API 密钥已保存');
  });

  // ================= 添加訊息到 UI =================
  function addMessageToUI(role, content, isHTML = false, isLanding = false) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', role);

    const bubbleDiv = document.createElement('div');
    bubbleDiv.classList.add('bubble');

    if (role === 'bot' && !isHTML) {
      try {
        const rawHtml = marked.parse(content);
        bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
        bubbleDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      } catch (e) { bubbleDiv.textContent = content; }
    } else if (isHTML) {
      bubbleDiv.innerHTML = content;
    } else {
      bubbleDiv.textContent = content;
    }

    bubbleDiv.addEventListener('click', (e) => { e.stopPropagation(); copyBubbleContent(bubbleDiv, e); });

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('time');
    timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    messageDiv.appendChild(bubbleDiv); messageDiv.appendChild(timeDiv); chatMessages.appendChild(messageDiv);
    
    if (isLanding && savedPerf !== 'low') {
      bubbleDiv.style.animation = 'none';
      bubbleDiv.offsetHeight;
      bubbleDiv.style.animation = 'bubbleLand 0.5s var(--apple-spring)';
    }

    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' }));
    return messageDiv;
  }

  // ================= 添加圖片訊息 =================
  function addImageMessageToUI(role, images) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', role);
    messageDiv.classList.add('image-only');

    const bubbleDiv = document.createElement('div');
    bubbleDiv.classList.add('bubble');

    const imgGrid = document.createElement('div');
    imgGrid.style.display = 'flex';
    imgGrid.style.gap = '4px';
    imgGrid.style.flexWrap = 'wrap';

    images.forEach(img => {
      const imgEl = document.createElement('img');
      imgEl.src = img.dataUrl || img;
      imgEl.style.maxWidth = images.length > 1 ? '120px' : '240px';
      imgEl.style.maxHeight = images.length > 1 ? '120px' : '240px';
      imgGrid.appendChild(imgEl);
    });

    bubbleDiv.appendChild(imgGrid);

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('time');
    timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    messageDiv.appendChild(bubbleDiv);
    messageDiv.appendChild(timeDiv);
    chatMessages.appendChild(messageDiv);

    if (savedPerf !== 'low') {
      bubbleDiv.style.animation = 'bubbleLand 0.5s var(--apple-spring)';
    }

    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' }));
    return messageDiv;
  }

  // ================= 打字指示器 =================
  function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.classList.add('message', 'bot'); typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = '<div class="typing-wrapper"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
    chatMessages.appendChild(typingDiv);
    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' }));
  }
  function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

  // ================= 跟進建議 =================
  function generateFollowups(userText, botText, convId) {
    const suggestions = [];
    if (convId === 'roleplay') suggestions.push('继续这个剧情', '换个场景', '加入一个角色');
    else if (convId === 'game') suggestions.push('推荐类似游戏', '这个游戏怎么玩？', '有什么隐藏玩法？');
    else if (convId === 'study') suggestions.push('可以详细解释吗？', '给我一个例题', '有什么实际应用？');
    else if (botText.includes('```') || botText.includes('代码')) suggestions.push('可以帮我解释这段代码吗？', '给我一个更简单的例子', '这段代码有什么注意事项？');
    else if (userText.length < 8) suggestions.push('可以详细解释吗？', '给我一个例子', '这有什么实际应用？');
    else suggestions.push('继续深入讲讲', '能举个例子吗？', '这和其他概念有什么关系？');
    return suggestions.slice(0, 3);
  }
  function showFollowups(suggestions) {
    followupList.innerHTML = '';
    suggestions.forEach((text, i) => {
      const chip = document.createElement('button'); chip.className = 'followup-chip'; chip.textContent = text;
      chip.style.animationDelay = (i * 0.12) + 's';
      chip.addEventListener('click', (e) => { e.stopPropagation(); messageInput.value = text; messageInput.focus(); });
      followupList.appendChild(chip);
    });
  }
  function resetFollowups() { followupList.innerHTML = '<span class="followup-empty">AI 回覆後將顯示跟進建議...</span>'; }

  // ================= 調用 API =================
  async function callDeepSeekAPI(userMessage, images) {
    if (!apiKey) { addMessageToUI('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。'); return null; }
    const history = currentConversation.history.filter(m => !m.isHTML).slice(-10);
    
    // 構建 messages
    const messages = [];
    history.forEach(m => {
      messages.push({
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.content || ''
      });
    });

    // 若有圖片，構建多模態消息
    if (images && images.length > 0) {
      const contentParts = [];
      images.forEach(img => {
        contentParts.push({
          type: 'image_url',
          image_url: { url: img.dataUrl }
        });
      });
      if (userMessage) {
        contentParts.push({ type: 'text', text: userMessage });
      }
      messages.push({ role: 'user', content: contentParts });
    } else {
      messages.push({ role: 'user', content: userMessage });
    }

    try {
      // 先嘗試多模態模型
      let model = 'deepseek-chat';
      if (images && images.length > 0) {
        model = 'deepseek-vl'; // 視覺模型
      }

      const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST', 
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ 
          model: model, 
          messages: messages, 
          temperature: 0.7, 
          stream: false 
        })
      });

      if (!response.ok) {
        // 如果視覺模型失敗，降級為純文字
        if (images && images.length > 0) {
          const textOnly = userMessage || '[用戶發送了一張圖片]';
          const fallbackMessages = history.map(m => ({
            role: m.role === 'user' ? 'user' : 'assistant',
            content: m.content || ''
          })).concat([{ role: 'user', content: textOnly + '\n（注：用戶嘗試上傳圖片，但當前模型不支援圖片識別）' }]);
          
          const fallbackRes = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({ model: 'deepseek-chat', messages: fallbackMessages, temperature: 0.7, stream: false })
          });
          if (!fallbackRes.ok) { const err = await fallbackRes.json().catch(() => ({})); throw new Error(err.error?.message || `HTTP ${fallbackRes.status}`); }
          const fbData = await fallbackRes.json();
          const fbReply = fbData.choices?.[0]?.message?.content;
          if (!fbReply) throw new Error('API 返回内容为空');
          return fbReply + '\n\n（提示：當前模型無法直接識別圖片，建議使用 deepseek-vl 模型或將圖片內容以文字描述）';
        }
        const err = await response.json().catch(() => ({})); 
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const botReply = data.choices?.[0]?.message?.content;
      if (!botReply) throw new Error('API 返回内容为空');
      return botReply;
    } catch (error) {
      let msg = '';
      if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) msg = '🌐 网络请求失败。可能是网络不通或浏览器阻挡。';
      else if (error.message.includes('401')) msg = '🔑 API 密钥无效或已过期。';
      else if (error.message.includes('402')) msg = '💰 帐户余额不足。';
      else if (error.message.includes('model')) msg = '🖼️ 图片模型不可用，请确认 API 支援 deepseek-vl。';
      else msg = `❌ 请求失败：${error.message || '未知错误'}`;
      return msg;
    }
  }

  // ================= 文字融入按鈕動畫 =================
  function mergeTextToButton(text) {
    return new Promise((resolve) => {
      if (savedPerf === 'low' || !text) { resolve(); return; }

      const inputRect = messageInput.getBoundingClientRect();
      const btnRect = sendBtn.getBoundingClientRect();
      const inputCx = inputRect.left + inputRect.width / 2;
      const inputCy = inputRect.top + inputRect.height / 2;
      const btnCx = btnRect.left + btnRect.width / 2;
      const btnCy = btnRect.top + btnRect.height / 2;

      const ghost = document.createElement('div');
      ghost.className = 'text-ghost';
      ghost.textContent = text;
      ghost.style.left = inputCx + 'px';
      ghost.style.top = inputCy + 'px';
      document.body.appendChild(ghost);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.left = btnCx + 'px';
          ghost.style.top = btnCy + 'px';
          ghost.style.transform = 'translate(-50%, -50%) scale(0.15)';
          ghost.style.opacity = '0';
          ghost.style.filter = 'blur(6px)';
        });
      });

      setTimeout(() => { ghost.remove(); resolve(); }, 550);
    });
  }

  // ================= 圖片上傳處理 =================
  function handleFiles(files) {
    if (!files || files.length === 0) return;
    
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) {
        showToast('請選擇圖片檔案');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showToast('圖片過大，請選擇小於 5MB 的圖片');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = (e) => {
        pendingImages.push({ file, dataUrl: e.target.result });
        renderImagePreview();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderImagePreview() {
    imagePreviewBar.innerHTML = '';
    if (pendingImages.length === 0) {
      imagePreviewBar.classList.remove('active');
      return;
    }
    imagePreviewBar.classList.add('active');
    pendingImages.forEach((img, idx) => {
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML = `
        <img src="${img.dataUrl}" alt="preview">
        <button class="preview-remove" data-idx="${idx}">×</button>
      `;
      item.querySelector('.preview-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        pendingImages.splice(idx, 1);
        renderImagePreview();
      });
      imagePreviewBar.appendChild(item);
    });
  }

  // 點擊 + 按鈕
  plusBtn.addEventListener('click', () => fileInput.click());
  // 點擊圖片圖標按鈕
  imageIconBtn.addEventListener('click', () => fileInput.click());
  // 檔案選擇變更
  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
    fileInput.value = ''; // 允許重複選擇同一檔案
  });
  
  // 支援拖曳上傳到輸入框
  const footer = document.querySelector('.chat-footer');
  footer.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
  footer.addEventListener('drop', (e) => {
    e.preventDefault(); e.stopPropagation();
    handleFiles(e.dataTransfer.files);
  });

  // ================= 發送訊息 =================
  async function sendMessage() {
    if (isWaitingForResponse || !currentConversation) return;
    const text = messageInput.value.trim();
    const hasImages = pendingImages.length > 0;
    
    if (!text && !hasImages) { showToast('请输入消息或选择图片'); return; }

    // 複製一份待發送圖片
    const imagesToSend = [...pendingImages];

    // 清空輸入
    messageInput.value = '';
    pendingImages = [];
    renderImagePreview();
    
    // 按鈕脈衝
    sendBtn.classList.add('pulsing');
    setTimeout(() => sendBtn.classList.remove('pulsing'), 500);

    // 能量波紋
    if (savedPerf !== 'low') {
      const btnRect = sendBtn.getBoundingClientRect();
      const cx = btnRect.left + btnRect.width / 2;
      const cy = btnRect.top + btnRect.height / 2;
      for (let i = 0; i < 2; i++) {
        setTimeout(() => {
          const ripple = document.createElement('div');
          ripple.className = 'energy-ripple';
          ripple.style.left = cx + 'px';
          ripple.style.top = cy + 'px';
          ripple.style.width = '50px';
          ripple.style.height = '50px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 900);
        }, i * 100);
      }
    }

    // 文字融入按鈕動畫
    if (text) await mergeTextToButton(text);

    // 顯示圖片訊息
    if (imagesToSend.length > 0) {
      addImageMessageToUI('user', imagesToSend);
    }
    // 顯示文字訊息
    if (text) {
      addMessageToUI('user', text, false, true);
    }

    // 儲存到歷史記錄
    if (imagesToSend.length > 0) {
      currentConversation.history.push({ 
        role: 'user', 
        content: text || '', 
        images: imagesToSend.map(img => ({ dataUrl: img.dataUrl }))
      });
    } else {
      currentConversation.history.push({ role: 'user', content: text });
    }

    // 檢查密鑰
    if (!apiKey) {
      addMessageToUI('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
      return;
    }

    // 執行 API 請求
    isWaitingForResponse = true;
    sendBtn.disabled = true;
    messageInput.disabled = true;
    resetFollowups();
    showTypingIndicator();

    try {
      const reply = await callDeepSeekAPI(text, imagesToSend);
      removeTypingIndicator();
      if (reply) {
        addMessageToUI('bot', reply, false, true);
        currentConversation.history.push({ role: 'assistant', content: reply });
        const suggestions = generateFollowups(text || '[圖片]', reply, currentConversation.id);
        showFollowups(suggestions);
        if (autoFollowupEnabled && suggestions.length > 0) {
          setTimeout(() => {
            if (!isWaitingForResponse && currentConversation) {
              messageInput.value = suggestions[0];
              sendMessage();
            }
          }, 1500);
        }
      } else addMessageToUI('bot', '⚠️ 未收到有效回复。');
    } catch (error) {
      removeTypingIndicator();
      addMessageToUI('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
    } finally {
      isWaitingForResponse = false;
      sendBtn.disabled = false;
      messageInput.disabled = false;
      messageInput.focus();
    }
  }

  // ================= 綁定事件 =================
  sendBtn.addEventListener('click', () => { if (isWaitingForResponse) return; sendMessage(); });
  messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
  apiKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveApiBtn.click(); });
  autoFollowupToggle.addEventListener('click', (e) => {
    e.stopPropagation(); autoFollowupEnabled = !autoFollowupEnabled;
    autoFollowupToggle.classList.toggle('on', autoFollowupEnabled);
    showToast(autoFollowupEnabled ? '🤖 自动追问已开启' : '自动追问已关闭', 1500);
  });

  // ================= 初始化 =================
  renderConversationList();
})();
</script>
</body>
</html>
