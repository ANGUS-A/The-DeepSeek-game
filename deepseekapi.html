<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DeepSeek · 紫耀分裂</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<style>
  /* ================= 基礎重置 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #05000d;
    display: flex; justify-content: center; align-items: center;
    padding: 16px; margin: 0; position: relative;
  }

  /* ================= 背景極光 & 星塵 ================= */
  .aurora-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora-layer { position: absolute; inset: -50%; filter: blur(70px); opacity: 0.85; }
  .aurora-1 { background: radial-gradient(circle at 20% 30%, rgba(123, 47, 190, 0.7) 0%, transparent 45%), radial-gradient(circle at 80% 70%, rgba(176, 38, 255, 0.5) 0%, transparent 45%); animation: aurora1 22s ease-in-out infinite alternate; }
  .aurora-2 { background: radial-gradient(circle at 70% 20%, rgba(42, 0, 80, 0.85) 0%, transparent 50%), radial-gradient(circle at 30% 80%, rgba(199, 125, 255, 0.4) 0%, transparent 50%); animation: aurora2 28s ease-in-out infinite alternate; }
  .aurora-3 { background: radial-gradient(circle at 50% 50%, rgba(74, 0, 128, 0.6) 0%, transparent 60%), radial-gradient(circle at 15% 85%, rgba(176, 38, 255, 0.35) 0%, transparent 50%); animation: aurora3 25s ease-in-out infinite alternate; }
  .aurora-4 { background: radial-gradient(circle at 85% 40%, rgba(176, 38, 255, 0.4) 0%, transparent 45%), radial-gradient(circle at 25% 55%, rgba(123, 47, 190, 0.5) 0%, transparent 50%); animation: aurora4 32s ease-in-out infinite alternate; }
  @keyframes aurora1 { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 100% { transform: translate(10%, -8%) rotate(15deg) scale(1.15); } }
  @keyframes aurora2 { 0% { transform: translate(0, 0) rotate(0deg) scale(1.1); } 100% { transform: translate(-10%, 8%) rotate(-12deg) scale(1); } }
  @keyframes aurora3 { 0% { transform: translate(-5%, 5%) rotate(-5deg); } 100% { transform: translate(8%, -6%) rotate(8deg); } }
  @keyframes aurora4 { 0% { transform: translate(5%, 5%) rotate(8deg) scale(1); } 100% { transform: translate(-8%, -5%) rotate(-10deg) scale(1.1); } }

  .stars-bg { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: radial-gradient(circle, #e0aaff, rgba(176, 38, 255, 0.4) 50%, transparent 70%); box-shadow: 0 0 12px rgba(199, 125, 255, 0.9), 0 0 24px rgba(123, 47, 190, 0.6); animation: starFloat linear infinite, starTwinkle ease-in-out infinite alternate; opacity: 0; }
  @keyframes starFloat { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.4; } 100% { transform: translateY(-110vh) translateX(50px); opacity: 0; } }
  @keyframes starTwinkle { 0% { filter: brightness(0.7); } 100% { filter: brightness(1.6); } }

  /* ================= 主容器 ================= */
  .app-container {
    position: relative; z-index: 5; width: 100%; max-width: 780px; height: 90vh; max-height: 820px;
    background: linear-gradient(135deg, rgba(21, 0, 41, 0.88), rgba(42, 0, 80, 0.78));
    backdrop-filter: blur(34px) saturate(200%); -webkit-backdrop-filter: blur(34px) saturate(200%);
    border: 1px solid rgba(176, 38, 255, 0.4); border-radius: 44px; overflow: hidden;
    transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.8s ease, border-color 0.8s ease;
    animation: cardEntrance 1.4s cubic-bezier(0.2, 0.9, 0.3, 1) both, cardFloat 8s ease-in-out infinite alternate, cardGlow 5s ease-in-out infinite alternate;
    transform-style: preserve-3d; isolation: isolate;
  }
  .app-container::after { content: ''; position: absolute; inset: 0; border-radius: 44px; background: radial-gradient(ellipse at 50% -20%, rgba(176, 38, 255, 0.25), transparent 60%); pointer-events: none; z-index: 1; }
  @keyframes cardEntrance { 0% { opacity: 0; transform: translateY(60px) scale(0.85) rotateX(15deg); filter: blur(15px) hue-rotate(45deg); } 100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); filter: blur(0) hue-rotate(0); } }
  @keyframes cardFloat { 0% { transform: translateY(0px) rotateZ(0deg); } 100% { transform: translateY(-10px) rotateZ(0.5deg); } }
  @keyframes cardGlow { 0% { box-shadow: 0 30px 80px -20px rgba(74, 0, 128, 0.8), 0 0 0 1px rgba(176, 38, 255, 0.25) inset, 0 0 60px rgba(123, 47, 190, 0.5); border-color: rgba(176, 38, 255, 0.4); } 100% { box-shadow: 0 40px 100px -20px rgba(74, 0, 128, 1), 0 0 0 1px rgba(224, 170, 255, 0.5) inset, 0 0 100px rgba(123, 47, 190, 0.8); border-color: rgba(224, 170, 255, 0.7); } }
  .app-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #7b2fbe, #e0aaff, #b026ff, #7b2fbe, transparent); background-size: 300% 100%; animation: topScan 4s linear infinite; z-index: 15; border-radius: 44px 44px 0 0; box-shadow: 0 0 20px rgba(199, 125, 255, 1); }
  @keyframes topScan { 0% { background-position: 300% 0; } 100% { background-position: -300% 0; } }

  /* ================= 視圖切換 ================= */
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.5s ease; backface-visibility: hidden; }
  .view-hidden { opacity: 0; pointer-events: none; transform: translateX(-12%) scale(0.96); filter: blur(8px); }
  .view-right-hidden { opacity: 0; pointer-events: none; transform: translateX(100%); filter: blur(8px); }

  /* ================= 會話列表 ================= */
  .list-header { padding: 20px 22px 16px; background: linear-gradient(135deg, rgba(21, 0, 41, 0.75), rgba(42, 0, 80, 0.55)); border-bottom: 1px solid rgba(176, 38, 255, 0.25); backdrop-filter: blur(16px); position: relative; overflow: hidden; }
  .list-title { font-size: 1.5rem; font-weight: 700; background: linear-gradient(90deg, #c77dff, #e0aaff, #b026ff, #c77dff); background-size: 300% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: titleGradient 5s linear infinite; display: flex; align-items: center; gap: 10px; }
  @keyframes titleGradient { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }
  .list-title .title-icon { font-size: 1.6rem; -webkit-text-fill-color: initial; color: #e0aaff; filter: drop-shadow(0 0 12px rgba(224, 170, 255, 0.9)); }
  .list-subtitle { font-size: 0.78rem; color: rgba(199, 125, 255, 0.6); margin-top: 4px; }
  .conversation-list { flex: 1; overflow-y: auto; padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 8px; background: radial-gradient(ellipse at 30% 10%, rgba(74, 0, 128, 0.4), transparent 70%); }
  .conversation-list::-webkit-scrollbar { width: 8px; } .conversation-list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(123, 47, 190, 0.7), rgba(199, 125, 255, 0.9)); border-radius: 20px; }
  .conv-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: linear-gradient(135deg, rgba(42, 0, 80, 0.5), rgba(21, 0, 41, 0.6)); border: 1px solid rgba(176, 38, 255, 0.2); cursor: pointer; transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1); animation: convAppear 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
  @keyframes convAppear { 0% { opacity: 0; transform: translateX(-30px) scale(0.9); filter: blur(6px); } 100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); } }
  .conv-item:hover { background: linear-gradient(135deg, rgba(74, 0, 128, 0.7), rgba(42, 0, 80, 0.8)); border-color: rgba(224, 170, 255, 0.6); transform: translateX(6px) scale(1.01); box-shadow: 0 12px 30px -6px rgba(74, 0, 128, 0.9), 0 0 30px rgba(176, 38, 255, 0.4); }
  .conv-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; border: 2px solid rgba(224, 170, 255, 0.4); box-shadow: 0 0 20px rgba(176, 38, 255, 0.5); animation: avatarPulse 3s ease-in-out infinite; }
  @keyframes avatarPulse { 0%, 100% { box-shadow: 0 0 20px rgba(176, 38, 255, 0.5); } 50% { box-shadow: 0 0 35px rgba(199, 125, 255, 0.8), 0 0 0 4px rgba(176, 38, 255, 0.15); } }
  .avatar-1 { background: linear-gradient(135deg, #7b2fbe, #b026ff); } .avatar-2 { background: linear-gradient(135deg, #4a0080, #7b2fbe); } .avatar-3 { background: linear-gradient(135deg, #b026ff, #e0aaff); } .avatar-4 { background: linear-gradient(135deg, #2a0050, #4a0080); }
  .conv-content { flex: 1; min-width: 0; } .conv-name { font-size: 1rem; font-weight: 600; color: #f0e5ff; display: flex; justify-content: space-between; margin-bottom: 4px; }
  .conv-time { font-size: 0.72rem; color: rgba(199, 125, 255, 0.6); } .conv-preview { font-size: 0.82rem; color: rgba(199, 125, 255, 0.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ================= 聊天視圖 ================= */
  .chat-header { padding: 14px 18px; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, rgba(21, 0, 41, 0.85), rgba(42, 0, 80, 0.65)); border-bottom: 1px solid rgba(176, 38, 255, 0.25); backdrop-filter: blur(16px); position: relative; z-index: 2; }
  .back-btn { background: linear-gradient(135deg, rgba(74, 0, 128, 0.6), rgba(42, 0, 80, 0.6)); border: 1px solid rgba(176, 38, 255, 0.4); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #e0aaff; cursor: pointer; transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1); flex-shrink: 0; box-shadow: 0 0 15px rgba(176, 38, 255, 0.3); }
  .back-btn:hover { transform: scale(1.12) translateX(-3px); background: linear-gradient(135deg, rgba(123, 47, 190, 0.8), rgba(74, 0, 128, 0.8)); border-color: rgba(224, 170, 255, 0.9); box-shadow: 0 0 30px rgba(176, 38, 255, 0.7); }
  .back-btn:active { transform: scale(0.92); }
  .chat-header-info { flex: 1; min-width: 0; animation: fadeSlideUp 0.6s 0.1s both; }
  @keyframes fadeSlideUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
  .chat-header-name { font-size: 1.05rem; font-weight: 600; color: #f0e5ff; display: flex; align-items: center; gap: 8px; }
  .chat-header-status { font-size: 0.72rem; color: rgba(199, 125, 255, 0.7); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #e0aaff; box-shadow: 0 0 8px rgba(224, 170, 255, 1); animation: statusPulse 2s ease-in-out infinite; }
  @keyframes statusPulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  
  .api-input-wrapper { display: flex; align-items: center; background: rgba(5, 0, 13, 0.6); border-radius: 100px; padding: 2px 2px 2px 16px; border: 1px solid rgba(176, 38, 255, 0.35); transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1); margin-top: 10px; }
  .api-input-wrapper:focus-within { border-color: var(--purple-neon, #b026ff); box-shadow: 0 0 0 4px rgba(176, 38, 255, 0.18), 0 0 50px rgba(123, 47, 190, 0.6); background: rgba(21, 0, 41, 0.9); }
  .api-input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: #f0e5ff; font-size: 0.85rem; padding: 10px 0; min-width: 0; }
  .api-input-wrapper input::placeholder { color: rgba(199, 125, 255, 0.5); }
  .save-btn { background: linear-gradient(135deg, #4a0080, #7b2fbe, #b026ff); border-radius: 100px; padding: 8px 16px; font-size: 0.78rem; font-weight: 600; color: white; border: 1px solid rgba(224, 170, 255, 0.4); cursor: pointer; transition: all 0.6s; box-shadow: 0 6px 20px rgba(123, 47, 190, 0.6); }
  .save-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 12px 30px rgba(123, 47, 190, 0.9); }

  /* ================= 訊息區域 ================= */
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; background: radial-gradient(ellipse at 30% 10%, rgba(74, 0, 128, 0.4), transparent 60%), radial-gradient(ellipse at 70% 90%, rgba(123, 47, 190, 0.25), transparent 60%); position: relative; z-index: 2; }
  .chat-messages::-webkit-scrollbar { width: 8px; } .chat-messages::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(123, 47, 190, 0.7), rgba(199, 125, 255, 0.9)); border-radius: 20px; }

  /* ================= 訊息氣泡（帶小尾巴） ================= */
  .message { max-width: 85%; display: flex; flex-direction: column; position: relative; }
  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.bot { align-self: flex-start; align-items: flex-start; }

  /* 氣泡本體 — 圓潤 + 微信小尾巴 */
  .bubble {
    padding: 14px 22px; font-size: 0.98rem; line-height: 1.65; word-break: break-word;
    backdrop-filter: blur(12px); position: relative; overflow: visible; /* 允許尾巴超出 */
    cursor: pointer; user-select: none;
  }

  /* 用戶氣泡：右下角小尾巴 */
  .message.user .bubble {
    background: linear-gradient(135deg, #7b2fbe, #b026ff);
    color: #ffffff; border: 1px solid rgba(224, 170, 255, 0.5);
    border-radius: 22px 22px 4px 22px; /* 右下角尖角 */
    box-shadow: 0 14px 32px -8px rgba(74, 0, 128, 0.95), 0 0 40px rgba(176, 38, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    animation: bubbleBreath 5s ease-in-out infinite;
  }
  /* 機器人氣泡：左下角小尾巴 */
  .message.bot .bubble {
    background: linear-gradient(135deg, rgba(42, 0, 80, 0.9), rgba(21, 0, 41, 0.9));
    color: #f0e5ff; border: 1px solid rgba(176, 38, 255, 0.45);
    border-radius: 22px 22px 22px 4px; /* 左下角尖角 */
    box-shadow: 0 14px 32px -8px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(224, 170, 255, 0.2);
    animation: botBorderPulse 4s ease-in-out infinite;
  }

  /* 尾巴細節（CSS小技巧：用偽元素做出尖角） */
  .message.user .bubble::after {
    content: ''; position: absolute; right: -8px; bottom: 0;
    width: 20px; height: 20px;
    background: #b026ff; /* 與氣泡主色對接 */
    clip-path: polygon(0 0, 100% 100%, 0 100%);
    border-bottom-right-radius: 4px;
  }
  .message.bot .bubble::after {
    content: ''; position: absolute; left: -8px; bottom: 0;
    width: 20px; height: 20px;
    background: #2a0050; /* 與氣泡主色對接 */
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    border-bottom-left-radius: 4px;
  }

  @keyframes bubbleBreath { 0%, 100% { box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.8); } 50% { box-shadow: 0 18px 40px -8px rgba(0, 0, 0, 0.9), 0 0 50px rgba(176, 38, 255, 0.4); } }
  @keyframes botBorderPulse { 0%, 100% { border-color: rgba(176, 38, 255, 0.45); } 50% { border-color: rgba(224, 170, 255, 1); box-shadow: 0 14px 32px -8px rgba(0, 0, 0, 0.9), 0 0 60px rgba(176, 38, 255, 0.6); } }

  .message .time { font-size: 0.7rem; color: rgba(199, 125, 255, 0.6); margin-top: 8px; margin-left: 10px; margin-right: 10px; }

  /* ================= Markdown 樣式 ================= */
  .bubble p { margin: 0 0 8px 0; } .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: #e0aaff; text-shadow: 0 0 12px rgba(224, 170, 255, 0.6); }
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 8px; background: linear-gradient(90deg, #c77dff, #e0aaff, #b026ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .bubble code:not(pre code) { background: rgba(176, 38, 255, 0.3); padding: 2px 8px; border-radius: 10px; color: #e0aaff; }
  .bubble pre { background: rgba(5, 0, 13, 0.85) !important; border: 1px solid rgba(176, 38, 255, 0.5); border-radius: 18px; padding: 14px; overflow-x: auto; margin: 12px 0; }
  .bubble table { border-collapse: separate; border-spacing: 0; margin: 10px 0; border-radius: 14px; overflow: hidden; border: 1px solid rgba(176, 38, 255, 0.5); }
  .bubble th, .bubble td { border-bottom: 1px solid rgba(176, 38, 255, 0.25); border-right: 1px solid rgba(176, 38, 255, 0.25); padding: 8px 12px; }
  .bubble th { background: rgba(74, 0, 128, 0.5); color: #e0aaff; }

  /* ================= 跟進建議區 ================= */
  .followup-section { padding: 10px 18px 6px; background: linear-gradient(180deg, transparent, rgba(21, 0, 41, 0.6)); border-top: 1px solid rgba(176, 38, 255, 0.25); animation: followupSlideIn 0.8s both; }
  @keyframes followupSlideIn { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
  .followup-title { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: rgba(199, 125, 255, 0.85); margin-bottom: 8px; }
  .followup-title .dot { width: 8px; height: 8px; border-radius: 50%; background: #e0aaff; box-shadow: 0 0 14px rgba(224, 170, 255, 1); animation: dotPulse 1.8s infinite; }
  @keyframes dotPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }
  .followup-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .followup-chip { background: linear-gradient(135deg, rgba(74, 0, 128, 0.8), rgba(42, 0, 80, 0.8)); border: 1px solid rgba(176, 38, 255, 0.5); border-radius: 100px; padding: 8px 16px; font-size: 0.85rem; color: #e0c8ff; cursor: pointer; transition: all 0.5s; animation: chipAppear 0.7s both; }
  @keyframes chipAppear { 0% { opacity: 0; transform: translateY(30px) scale(0.4); } 60% { transform: translateY(-8px) scale(1.1); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  .followup-chip:hover { background: rgba(123, 47, 190, 0.9); border-color: #e0aaff; color: #fff; transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 25px rgba(176, 38, 255, 0.6); }
  .auto-followup { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: rgba(199, 125, 255, 0.85); cursor: pointer; margin-left: auto; }
  .toggle-switch { width: 38px; height: 22px; background: rgba(5, 0, 13, 0.7); border-radius: 100px; position: relative; transition: all 0.5s; border: 1px solid rgba(176, 38, 255, 0.5); }
  .toggle-switch::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(135deg, #7b2fbe, #b026ff); top: 2px; left: 2px; transition: all 0.5s; }
  .auto-followup.on .toggle-switch { background: rgba(123, 47, 190, 0.5); border-color: #b026ff; }
  .auto-followup.on .toggle-switch::after { left: 18px; background: #e0aaff; }
  .followup-empty { font-size: 0.78rem; color: rgba(199, 125, 255, 0.45); font-style: italic; }

  /* ================= 底部輸入 & 簡化按鈕 ================= */
  .chat-footer { padding: 14px 18px 18px; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, rgba(21, 0, 41, 0.85), rgba(42, 0, 80, 0.65)); backdrop-filter: blur(16px); border-top: 1px solid rgba(176, 38, 255, 0.25); position: relative; z-index: 2; }
  .chat-footer input { flex: 1; background: rgba(5, 0, 13, 0.7); border: 1px solid rgba(176, 38, 255, 0.4); border-radius: 100px; padding: 16px 24px; color: #f0e5ff; font-size: 0.95rem; outline: none; transition: all 0.6s; }
  .chat-footer input:focus { border-color: #b026ff; box-shadow: 0 0 0 4px rgba(176, 38, 255, 0.2), 0 0 50px rgba(123, 47, 190, 0.5); background: rgba(21, 0, 41, 0.95); }
  .chat-footer input::placeholder { color: rgba(199, 125, 255, 0.55); }

  /* 發送按鈕 - 大幅簡化，只保留核心樣式與輕微反饋 */
  .send-btn {
    background: linear-gradient(145deg, #4a0080, #7b2fbe, #b026ff);
    width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; color: white; border: 1px solid rgba(224, 170, 255, 0.55); flex-shrink: 0;
    cursor: pointer; transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.4s;
    box-shadow: 0 8px 25px rgba(74, 0, 128, 0.8), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .send-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(74, 0, 128, 1), 0 0 30px rgba(176, 38, 255, 0.6); }
  .send-btn:active { transform: scale(0.92); }
  .send-btn span { display: inline-block; transition: transform 0.3s; }
  .send-btn:hover span { transform: translateX(3px); }
  .send-btn:disabled { opacity: 0.5; pointer-events: none; }

  /* ================= 分裂動畫相關（由 JS 動態創建） ================= */
  /* 飛行的幽靈氣泡 */
  .flying-bubble {
    position: fixed; z-index: 9999; pointer-events: none;
    padding: 14px 22px; border-radius: 22px;
    font-size: 0.98rem; font-weight: 500; color: white;
    background: linear-gradient(135deg, #7b2fbe, #b026ff);
    box-shadow: 0 10px 30px rgba(176, 38, 255, 0.8);
    transition: all 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 70vw;
  }
  .flying-bubble.suck {
    transform: translate(var(--tx), var(--ty)) scale(0.1);
    opacity: 0; filter: blur(10px);
  }
  .flying-bubble.split {
    transform: scale(0.1); opacity: 0;
    filter: blur(5px);
  }
  .flying-bubble.fly {
    transform: translate(var(--dx), var(--dy)) scale(1);
    opacity: 1; filter: blur(0);
  }
  
  /* 氣泡落地彈跳 */
  .bubble.land {
    animation: bubbleLand 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes bubbleLand {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 飛行軌跡粒子 */
  .trail-dot {
    position: fixed; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle, #e0aaff, transparent);
    pointer-events: none; z-index: 9998;
    box-shadow: 0 0 15px rgba(224, 170, 255, 0.8);
    animation: trailFade 0.6s ease-out forwards;
  }
  @keyframes trailFade { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.2); } }

  /* 能量衝擊波（分裂時） */
  .split-wave {
    position: fixed; border-radius: 50%; border: 2px solid rgba(224, 170, 255, 0.8);
    pointer-events: none; z-index: 9997;
    transform: translate(-50%, -50%) scale(0);
    animation: splitWaveExpand 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }
  @keyframes splitWaveExpand { to { transform: translate(-50%, -50%) scale(5); opacity: 0; } }

  /* Toast 样式 */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(40px); background: rgba(74, 0, 128, 0.98); backdrop-filter: blur(16px); padding: 12px 28px; border-radius: 100px; color: #e0c8ff; font-size: 0.9rem; border: 1px solid rgba(176, 38, 255, 0.7); opacity: 0; transition: all 0.7s cubic-bezier(0.2, 0.9, 0.3, 1); pointer-events: none; z-index: 10000; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px) {
    .app-container { height: 94vh; border-radius: 32px; }
    .bubble { padding: 12px 18px; font-size: 0.92rem; }
    .send-btn { width: 52px; height: 52px; font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div class="aurora-bg">
  <div class="aurora-layer aurora-1"></div>
  <div class="aurora-layer aurora-2"></div>
  <div class="aurora-layer aurora-3"></div>
  <div class="aurora-layer aurora-4"></div>
</div>
<div class="stars-bg" id="starsBg"></div>

<div class="app-container" id="appContainer">
  <!-- 視圖1：會話列表 -->
  <div class="view" id="listView">
    <div class="list-header">
      <div class="list-title"><span class="title-icon">✦</span><span>紫耀會話</span></div>
      <div class="list-subtitle">選擇一個對話開始</div>
    </div>
    <div class="conversation-list" id="conversationList"></div>
  </div>

  <!-- 視圖2：聊天詳情 -->
  <div class="view view-right-hidden" id="chatView">
    <div class="chat-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="chat-header-info">
        <div class="chat-header-name"><span id="chatHeaderEmoji">💬</span><span id="chatHeaderTitle">正常對話</span></div>
        <div class="chat-header-status"><span class="status-dot"></span><span id="chatHeaderStatus">在线</span></div>
        <div class="api-input-wrapper">
          <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API 密钥...">
          <button class="save-btn" id="saveApiBtn">保存</button>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="followup-section" id="followupSection">
      <div class="followup-title">
        <span class="dot"></span><span>可能想問</span>
        <div class="auto-followup" id="autoFollowup"><span class="toggle-switch"></span><span>自動追問</span></div>
      </div>
      <div class="followup-list" id="followupList"><span class="followup-empty">AI 回覆後將顯示跟進建議...</span></div>
    </div>

    <div class="chat-footer">
      <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
      <button class="send-btn" id="sendBtn"><span>➤</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  // ================= 數據 =================
  const conversations = [
    { id: 'normal', emoji: '💬', title: '正常對話', preview: '你好！我是 DeepSeek 助手...', time: '剛剛', avatarClass: 'avatar-1', status: '在线 · DeepSeek 已连接', welcome: '你好！我是 DeepSeek 助手 ✨<br><br>请先输入 API 密钥，然后就可以开始对话了。<br><br><span style="color: rgba(224, 170, 255, 0.7); font-size: 0.85em;">💡 点击任意气泡即可复制内容</span>', history: [] },
    { id: 'roleplay', emoji: '🎭', title: '角色扮演', preview: '你是我的专属武侠小说家...', time: '昨天', avatarClass: 'avatar-2', status: '角色模式 · 武侠世界', welcome: '欢迎来到武侠世界 🗡️<br><br>我是你的专属武侠小说家。请告诉我你想扮演的角色或想展开的剧情。', history: [] },
    { id: 'game', emoji: '🎮', title: '游戏询问', preview: '最近有什么好玩的游戏...', time: '昨天', avatarClass: 'avatar-3', status: '游戏助手 · 在线', welcome: '你好！我是你的游戏助手 🎮<br><br>想找新游戏？想了解攻略？还是想聊聊最近的热门大作？', history: [] },
    { id: 'study', emoji: '📚', title: '学习助手', preview: '帮我解释一下量子力学...', time: '星期一', avatarClass: 'avatar-4', status: '学习模式 · 专注中', welcome: '你好！我是你的学习助手 📚<br><br>无论是数学、物理、编程还是语言学习，我都能帮你。', history: [] }
  ];

  let currentConversation = null;
  let apiKey = localStorage.getItem('deepseek_api_key') || '';
  let isWaitingForResponse = false;
  let autoFollowupEnabled = false;

  // ================= DOM =================
  const appContainer = document.getElementById('appContainer');
  const listView = document.getElementById('listView');
  const chatView = document.getElementById('chatView');
  const conversationList = document.getElementById('conversationList');
  const backBtn = document.getElementById('backBtn');
  const chatHeaderEmoji = document.getElementById('chatHeaderEmoji');
  const chatHeaderTitle = document.getElementById('chatHeaderTitle');
  const chatHeaderStatus = document.getElementById('chatHeaderStatus');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveApiBtn = document.getElementById('saveApiBtn');
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const toastEl = document.getElementById('toast');
  const starsBg = document.getElementById('starsBg');
  const followupList = document.getElementById('followupList');
  const autoFollowupToggle = document.getElementById('autoFollowup');

  if (apiKey) apiKeyInput.value = apiKey;

  // ================= 渲染列表 =================
  function renderConversationList() {
    conversationList.innerHTML = '';
    conversations.forEach((conv, i) => {
      const item = document.createElement('div');
      item.className = 'conv-item';
      item.style.animationDelay = (i * 0.1) + 's';
      item.innerHTML = `
        <div class="conv-avatar ${conv.avatarClass}">${conv.emoji}</div>
        <div class="conv-content">
          <div class="conv-name"><span>${conv.title}</span><span class="conv-time">${conv.time}</span></div>
          <div class="conv-preview">${conv.preview}</div>
        </div>`;
      item.addEventListener('click', () => openConversation(conv));
      conversationList.appendChild(item);
    });
  }

  // ================= 開啟會話 =================
  function openConversation(conv) {
    currentConversation = conv;
    chatHeaderEmoji.textContent = conv.emoji;
    chatHeaderTitle.textContent = conv.title;
    chatHeaderStatus.textContent = conv.status;

    chatMessages.innerHTML = '';
    if (conv.history.length === 0) {
      addMessageToUI('bot', conv.welcome, true);
      conv.history.push({ role: 'assistant', content: conv.welcome, isHTML: true });
    } else {
      conv.history.forEach(msg => addMessageToUI(msg.role === 'user' ? 'user' : 'bot', msg.content, msg.isHTML));
    }

    listView.classList.add('view-hidden');
    chatView.classList.remove('view-right-hidden');
    setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; messageInput.focus(); }, 500);
  }

  // ================= 返回列表 =================
  backBtn.addEventListener('click', () => {
    listView.classList.remove('view-hidden');
    chatView.classList.add('view-right-hidden');
    setTimeout(() => { currentConversation = null; }, 600);
  });

  // ================= 3D 傾斜 & 滑鼠光軌 & 星塵 =================
  appContainer.addEventListener('mousemove', (e) => {
    const rect = appContainer.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    appContainer.style.transform = `perspective(1500px) rotateY(${x * 2.5}deg) rotateX(${-y * 2.5}deg) translateY(-4px)`;
  });
  appContainer.addEventListener('mouseleave', () => { appContainer.style.transform = ''; });

  document.addEventListener('mousemove', (e) => {
    const bubble = e.target.closest('.bubble');
    if (bubble) {
      const rect = bubble.getBoundingClientRect();
      bubble.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width) * 100 + '%');
      bubble.style.setProperty('--my', ((e.clientY - rect.top) / rect.height) * 100 + '%');
    }
  });

  function createStars() {
    for (let i = 0; i < 70; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.bottom = '-20px';
      const size = Math.random() * 4 + 1.5;
      star.style.width = size + 'px'; star.style.height = size + 'px';
      star.style.animationDuration = (Math.random() * 20 + 15) + 's, ' + (Math.random() * 2 + 1.5) + 's';
      star.style.animationDelay = (Math.random() * 20) + 's, ' + (Math.random() * 2) + 's';
      starsBg.appendChild(star);
    }
  }
  createStars();

  // ================= Toast =================
  function showToast(text, duration = 2000) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  // ================= 複製 =================
  function copyBubbleContent(bubble, e) {
    let text = bubble.innerText || bubble.textContent || '';
    text = text.trim(); if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      bubble.classList.add('copied'); setTimeout(() => bubble.classList.remove('copied'), 900);
      if (e) {
        const rect = bubble.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.style.cssText = `position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(224,170,255,.9),transparent 70%);transform:scale(0);pointer-events:none;z-index:5;animation:copyRipple 1s forwards;width:${Math.max(rect.width,rect.height)}px;height:${Math.max(rect.width,rect.height)}px;left:${e.clientX-rect.left-Math.max(rect.width,rect.height)/2}px;top:${e.clientY-rect.top-Math.max(rect.width,rect.height)/2}px;`;
        bubble.appendChild(ripple); setTimeout(() => ripple.remove(), 1000);
      }
      showToast('✨ 已複製到剪貼板');
    }).catch(() => {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('✨ 已複製');
    });
  }

  // ================= 保存密鑰 =================
  saveApiBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (!key) { showToast('密钥不能为空'); return; }
    apiKey = key; localStorage.setItem('deepseek_api_key', key); showToast('✅ API 密钥已保存');
  });

  // ================= 添加消息到 UI =================
  function addMessageToUI(role, content, isHTML = false, isLanding = false) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', role);

    const bubbleDiv = document.createElement('div');
    bubbleDiv.classList.add('bubble');

    if (role === 'bot' && !isHTML) {
      try {
        const rawHtml = marked.parse(content);
        bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
        bubbleDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      } catch (e) { bubbleDiv.textContent = content; }
    } else if (isHTML) {
      bubbleDiv.innerHTML = content;
    } else {
      // 用戶訊息：如果是落地動畫，則直接填入；否則逐字浮現
      if (isLanding) {
        bubbleDiv.textContent = content;
        bubbleDiv.classList.add('land');
      } else {
        const text = content; bubbleDiv.textContent = ''; let i = 0;
        const interval = setInterval(() => {
          if (i >= text.length) { clearInterval(interval); return; }
          const span = document.createElement('span'); span.className = 'char'; span.textContent = text[i];
          bubbleDiv.appendChild(span); i++; chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 20);
      }
    }

    bubbleDiv.addEventListener('click', (e) => { e.stopPropagation(); copyBubbleContent(bubbleDiv, e); });

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('time');
    timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    messageDiv.appendChild(bubbleDiv); messageDiv.appendChild(timeDiv); chatMessages.appendChild(messageDiv);
    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' }));
    return messageDiv;
  }

  // ================= 打字指示器 =================
  function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.classList.add('message', 'bot'); typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    chatMessages.appendChild(typingDiv);
    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' }));
  }
  function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

  // ================= 跟進建議 =================
  function generateFollowups(userText, botText, convId) {
    const suggestions = [];
    if (convId === 'roleplay') suggestions.push('继续这个剧情', '换个场景', '加入一个角色');
    else if (convId === 'game') suggestions.push('推荐类似游戏', '这个游戏怎么玩？', '有什么隐藏玩法？');
    else if (convId === 'study') suggestions.push('可以详细解释吗？', '给我一个例题', '有什么实际应用？');
    else if (botText.includes('```') || botText.includes('代码')) suggestions.push('可以帮我解释这段代码吗？', '给我一个更简单的例子', '这段代码有什么注意事项？');
    else if (userText.length < 8) suggestions.push('可以详细解释吗？', '给我一个例子', '这有什么实际应用？');
    else suggestions.push('继续深入讲讲', '能举个例子吗？', '这和其他概念有什么关系？');
    return suggestions.slice(0, 3);
  }
  function showFollowups(suggestions) {
    followupList.innerHTML = '';
    suggestions.forEach((text, i) => {
      const chip = document.createElement('button'); chip.className = 'followup-chip'; chip.textContent = text;
      chip.style.animationDelay = (i * 0.12) + 's';
      chip.addEventListener('click', (e) => { e.stopPropagation(); messageInput.value = text; messageInput.focus(); });
      followupList.appendChild(chip);
    });
  }
  function resetFollowups() { followupList.innerHTML = '<span class="followup-empty">AI 回覆後將顯示跟進建議...</span>'; }

  // ================= 調用 API =================
  async function callDeepSeekAPI(userMessage) {
    if (!apiKey) { addMessageToUI('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。'); return null; }
    const history = currentConversation.history.filter(m => !m.isHTML).slice(-10);
    const messages = history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })).concat([{ role: 'user', content: userMessage }]);
    try {
      const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model: 'deepseek-chat', messages, temperature: 0.7, stream: false })
      });
      if (!response.ok) { const err = await response.json().catch(() => ({})); throw new Error(err.error?.message || `HTTP ${response.status}`); }
      const data = await response.json();
      const botReply = data.choices?.[0]?.message?.content;
      if (!botReply) throw new Error('API 返回内容为空'); return botReply;
    } catch (error) {
      let msg = '';
      if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) msg = '🌐 网络请求失败。可能是网络不通或浏览器阻挡。';
      else if (error.message.includes('401')) msg = '🔑 API 密钥无效或已过期。';
      else if (error.message.includes('402')) msg = '💰 帐户余额不足。';
      else msg = `❌ 请求失败：${error.message || '未知错误'}`;
      return msg;
    }
  }

  // ================= 🌟 核心：發送訊息（細胞分裂動畫） =================
  async function sendMessage() {
    if (isWaitingForResponse || !currentConversation) return;
    const text = messageInput.value.trim();
    if (!text) { showToast('请输入消息内容'); return; }
    
    const btnRect = sendBtn.getBoundingClientRect();
    const btnX = btnRect.left + btnRect.width / 2;
    const btnY = btnRect.top + btnRect.height / 2;

    // 1. 創建「幽靈氣泡」準備從輸入框飛向按鈕
    const ghost = document.createElement('div');
    ghost.className = 'flying-bubble';
    ghost.textContent = text;
    ghost.style.left = (btnX - 100) + 'px'; 
    ghost.style.top = (btnY - 40) + 'px';
    ghost.style.opacity = '1';
    document.body.appendChild(ghost);

    // 記錄輸入框位置
    const inputRect = messageInput.getBoundingClientRect();
    const inputX = inputRect.left + inputRect.width / 2;
    const inputY = inputRect.top + inputRect.height / 2;

    // 階段一：文字從輸入框「吸入」按鈕
    requestAnimationFrame(() => {
      ghost.style.left = inputX + 'px';
      ghost.style.top = inputY + 'px';
      ghost.style.transform = `translate(-50%, -50%) scale(0.1)`;
      ghost.style.opacity = '0';
      ghost.style.filter = 'blur(10px)';
    });

    // 2. 清空輸入框並禁用
    messageInput.value = '';
    messageInput.disabled = true;
    sendBtn.disabled = true;

    // 等待吸入動畫完成（約 400ms）
    setTimeout(() => {
      ghost.remove(); // 移除幽靈

      // 階段二：按鈕「細胞分裂」→ 產生新氣泡
      // 先讓按鈕膨脹
      sendBtn.style.transform = 'scale(1.3)';
      setTimeout(() => sendBtn.style.transform = '', 200);

      // 在按鈕位置創建分裂出的新氣泡
      const splitBubble = document.createElement('div');
      splitBubble.className = 'flying-bubble split';
      splitBubble.textContent = text;
      splitBubble.style.left = btnX + 'px';
      splitBubble.style.top = btnY + 'px';
      document.body.appendChild(splitBubble);

      // 分裂衝擊波
      const wave = document.createElement('div');
      wave.className = 'split-wave';
      wave.style.cssText = `left:${btnX}px;top:${btnY}px;width:60px;height:60px;`;
      document.body.appendChild(wave);
      setTimeout(() => wave.remove(), 800);

      // 階段三：氣泡飛向聊天區域
      setTimeout(() => {
        splitBubble.classList.remove('split');
        splitBubble.classList.add('fly');
        
        // 計算目標位置（訊息區底部）
        const msgRect = chatMessages.getBoundingClientRect();
        const targetX = msgRect.right - 100;
        const targetY = msgRect.bottom - 80;

        splitBubble.style.left = targetX + 'px';
        splitBubble.style.top = targetY + 'px';
        splitBubble.style.transform = 'translate(-50%, -50%) scale(1)';

        // 飛行軌跡粒子
        for (let i = 0; i < 8; i++) {
          setTimeout(() => {
            const dot = document.createElement('div');
            dot.className = 'trail-dot';
            dot.style.left = (btnX + (targetX - btnX) * (i / 8)) + 'px';
            dot.style.top = (btnY + (targetY - btnY) * (i / 8)) + 'px';
            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 600);
          }, i * 40);
        }

        // 階段四：氣泡落地，真實訊息出現
        setTimeout(() => {
          splitBubble.remove(); // 移除幽靈氣泡
          
          // 真實氣泡落地
          addMessageToUI('user', text, false, true);
          currentConversation.history.push({ role: 'user', content: text });

          // 執行 API 請求
          executeAPI(text);
        }, 800); // 飛行時間

      }, 200); // 分裂延遲
    }, 400); // 吸入時間
  }

  // ================= 執行 API 請求（獨立出來） =================
  async function executeAPI(text) {
    resetFollowups();
    showTypingIndicator();

    try {
      const reply = await callDeepSeekAPI(text);
      removeTypingIndicator();
      if (reply) {
        addMessageToUI('bot', reply);
        currentConversation.history.push({ role: 'assistant', content: reply });
        const suggestions = generateFollowups(text, reply, currentConversation.id);
        showFollowups(suggestions);
        if (autoFollowupEnabled && suggestions.length > 0) {
          setTimeout(() => {
            if (!isWaitingForResponse && currentConversation) {
              messageInput.value = suggestions[0];
              sendMessage();
            }
          }, 1500);
        }
      } else addMessageToUI('bot', '⚠️ 未收到有效回复。');
    } catch (error) {
      removeTypingIndicator(); addMessageToUI('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
    } finally {
      isWaitingForResponse = false; sendBtn.disabled = false; messageInput.disabled = false; messageInput.focus();
    }
  }

  // ================= 綁定事件 =================
  sendBtn.addEventListener('click', () => {
    if (isWaitingForResponse) return;
    sendMessage();
  });
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
  });
  apiKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveApiBtn.click(); });
  autoFollowupToggle.addEventListener('click', (e) => {
    e.stopPropagation(); autoFollowupEnabled = !autoFollowupEnabled;
    autoFollowupToggle.classList.toggle('on', autoFollowupEnabled);
    showToast(autoFollowupEnabled ? '🤖 自动追问已开启' : '自动追问已关闭', 1500);
  });

  // ================= 初始化 =================
  renderConversationList();
})();
</script>
</body>
</html>
