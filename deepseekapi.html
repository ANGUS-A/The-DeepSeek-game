<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DeepSeek · 極致會話</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<style>
  /* ================= 主題變數（保持不變） ================= */
  /* ... 此处保留你上一版所有主题变数 ... */
  /* 为节省篇幅，这里只写粉色主题作为代表，其他主题代码需原样保留 */
  body, body[data-theme="pink"] {
    --bg-page: #fff0f5;
    --card-1: rgba(255, 240, 245, 0.85);
    --card-2: rgba(255, 228, 236, 0.92);
    --header-1: rgba(255, 235, 242, 0.92);
    --header-2: rgba(255, 220, 232, 0.85);
    --accent-1: #ff9eb5;
    --accent-2: #ff7d9c;
    --accent-3: #ffb6c1;
    --accent-soft: rgba(255, 182, 193, 0.35);
    --accent-glow: rgba(255, 143, 163, 0.5);
    --text-1: #4a2c3a;
    --text-2: rgba(74, 44, 58, 0.7);
    --text-3: rgba(74, 44, 58, 0.45);
    --bubble-user-bg: linear-gradient(135deg, #ff9eb5, #ff7d9c);
    --bubble-bot-bg: rgba(255, 250, 252, 0.95);
    --border-soft: rgba(255, 182, 193, 0.4);
    --border-medium: rgba(255, 143, 163, 0.5);
    --border-strong: rgba(255, 125, 156, 0.75);
  }
  /* ... 其他主题（deepred, deeppurple 等）保持原样 ... */

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg-page); display: flex; justify-content: center; align-items: center; padding: 16px; margin: 0; position: relative; transition: background 0.4s ease; }
  :root { --apple-spring: cubic-bezier(0.32, 0.72, 0, 1); }

  /* ================= 背景、主容器、视图切换、会话列表（保持原样） ================= */
  /* ... 保持原有的 aurora-bg, stars-bg, app-container, view, list-header, conversation-list 样式 ... */
  
  /* ================= 聊天视图 ================= */
  .chat-header { padding: 14px 18px; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, var(--header-1), var(--header-2)); border-bottom: 1px solid var(--border-soft); backdrop-filter: blur(16px); position: relative; z-index: 2; }
  .back-btn { background: var(--bubble-bot-bg); border: 1px solid var(--border-medium); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--accent-2); cursor: pointer; transition: all 0.4s var(--apple-spring); flex-shrink: 0; }
  .back-btn:hover { transform: scale(1.12) translateX(-3px); border-color: var(--border-strong); box-shadow: 0 0 25px var(--accent-soft); }
  .back-btn:active { transform: scale(0.92); }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-name { font-size: 1.05rem; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
  .chat-header-status { font-size: 0.72rem; color: var(--text-2); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 8px var(--accent-glow); animation: statusPulse 2s ease-in-out infinite; }
  @keyframes statusPulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  .api-input-wrapper { display: flex; align-items: center; background: var(--bubble-bot-bg); border-radius: 100px; padding: 2px 2px 2px 16px; border: 1px solid var(--border-medium); transition: all 0.4s var(--apple-spring); margin-top: 10px; }
  .api-input-wrapper:focus-within { border-color: var(--border-strong); box-shadow: 0 0 0 4px var(--accent-soft), 0 0 50px var(--accent-soft); }
  .api-input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-1); font-size: 0.85rem; padding: 10px 0; min-width: 0; }
  .api-input-wrapper input::placeholder { color: var(--text-3); }
  .save-btn { background: var(--bubble-user-bg); border-radius: 100px; padding: 8px 16px; font-size: 0.78rem; font-weight: 600; color: white; border: 1px solid var(--border-medium); cursor: pointer; transition: all 0.4s var(--apple-spring); }
  .save-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 12px 30px var(--accent-soft); }

  /* ================= 訊息區域 ================= */
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; background: radial-gradient(ellipse at 30% 10%, var(--accent-soft), transparent 60%), radial-gradient(ellipse at 70% 90%, var(--accent-soft), transparent 60%); position: relative; z-index: 2; }
  .chat-messages::-webkit-scrollbar { width: 8px; } .chat-messages::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent-1), var(--accent-2)); border-radius: 20px; }

  /* ================= 訊息氣泡 ================= */
  .message { max-width: 85%; display: flex; flex-direction: column; position: relative; }
  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.bot { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 14px 22px; font-size: 0.98rem; line-height: 1.65; word-break: break-word; backdrop-filter: blur(12px); position: relative; cursor: pointer; user-select: none; transition: transform 0.3s var(--apple-spring); }
  .bubble:active { transform: scale(0.97); }
  
  .message.user .bubble { background: var(--bubble-user-bg); color: #ffffff; border: 1px solid var(--border-medium); border-radius: 24px 24px 6px 24px; box-shadow: 0 14px 32px -8px var(--accent-soft), 0 0 40px var(--accent-soft); }
  .message.bot .bubble { background: var(--bubble-bot-bg); color: var(--text-1); border: 1px solid var(--border-medium); border-radius: 24px 24px 24px 6px; box-shadow: 0 14px 32px -8px rgba(0, 0, 0, 0.15); }
  
  .message .time { font-size: 0.7rem; color: var(--text-3); margin-top: 8px; margin-left: 10px; margin-right: 10px; }
  @keyframes bubbleLand { 0% { transform: scale(0.7); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  /* 圖片訊息氣泡 */
  .message .bubble.image-bubble {
    padding: 6px;
    background: var(--bubble-bot-bg);
    border: 1px solid var(--border-medium);
    border-radius: 20px;
    max-width: 260px;
  }
  .message.user .bubble.image-bubble {
    background: var(--bubble-user-bg);
    border-radius: 20px 20px 4px 20px;
  }
  .bubble img {
    width: 100%;
    height: auto;
    max-height: 280px;
    object-fit: cover;
    border-radius: 16px;
    display: block;
  }

  /* ================= Markdown、跟進建議（保持原样） ================= */
  /* ... 保持原有的 Markdown 和 followup-section 样式 ... */

  /* ================= 底部輸入（重點改造） ================= */
  .chat-footer { 
    padding: 14px 18px 18px; 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    background: linear-gradient(135deg, var(--header-1), var(--header-2)); 
    backdrop-filter: blur(16px); 
    border-top: 1px solid var(--border-soft); 
    position: relative; 
    z-index: 2; 
    flex-wrap: wrap; /* 讓預覽圖可以換行 */
  }

  /* 上傳按鈕 (左側 + 號) */
  .attach-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border-medium);
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 300;
    cursor: pointer; transition: all 0.3s var(--apple-spring);
    flex-shrink: 0;
    background: var(--bubble-bot-bg);
  }
  .attach-btn:hover { transform: scale(1.1); border-color: var(--border-strong); color: var(--accent-2); }
  .attach-btn:active { transform: scale(0.92); }

  /* 輸入框包裹層 */
  .input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--bubble-bot-bg);
    border: 1px solid var(--border-medium);
    border-radius: 100px;
    padding: 0 16px;
    transition: all 0.4s var(--apple-spring);
    min-width: 0;
  }
  .input-wrapper:focus-within { border-color: var(--border-strong); box-shadow: 0 0 0 4px var(--accent-soft); }
  .input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-1); font-size: 0.95rem; padding: 16px 0; min-width: 0; }
  .input-wrapper input::placeholder { color: var(--text-3); }

  /* 輸入框內的圖片按鈕 */
  .img-btn {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-3); font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
    padding: 4px; transition: color 0.3s; flex-shrink: 0;
  }
  .img-btn:hover { color: var(--accent-2); }

  /* 發送按鈕 */
  .send-btn { background: var(--bubble-user-bg); width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; border: 1px solid var(--border-medium); flex-shrink: 0; cursor: pointer; transition: transform 0.3s var(--apple-spring), box-shadow 0.4s ease; box-shadow: 0 8px 25px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,0.3); position: relative; overflow: hidden; }
  .send-btn::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.5), transparent 70%); opacity: 0; transition: opacity 0.4s ease; }
  .send-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 30px var(--accent-soft), 0 0 30px var(--accent-glow); }
  .send-btn:hover::before { opacity: 1; }
  .send-btn:active { transform: scale(0.92); }
  .send-btn span { display: inline-block; transition: transform 0.4s var(--apple-spring); }
  .send-btn:hover span { transform: translateX(2px); }
  .send-btn:disabled { opacity: 0.5; pointer-events: none; }
  .send-btn.pulsing { animation: btnPulse 0.5s var(--apple-spring); }
  @keyframes btnPulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); box-shadow: 0 0 50px var(--accent-glow), 0 0 80px var(--accent-soft); } 100% { transform: scale(1); } }

  /* 圖片預覽區 */
  .image-preview-container {
    width: 100%;
    display: flex;
    padding: 4px 0 8px;
    gap: 8px;
    flex-wrap: wrap;
    order: -1; /* 放在最上方 */
  }
  .image-preview-item {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 12px;
    border: 2px solid var(--border-medium);
    background: var(--card-1);
    overflow: hidden;
    animation: previewAppear 0.4s var(--apple-spring);
  }
  @keyframes previewAppear { 0% { opacity: 0; transform: scale(0.7); } 100% { opacity: 1; transform: scale(1); } }
  .image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .image-preview-item .remove-preview {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-2); color: white;
    border: none; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  /* ================= 文字融入按鈕幽靈元素（保持原样） ================= */
  .text-ghost { /* ... 保持原样 ... */ }

  /* ================= 性能等級調整（保持原样） ================= */
  /* ... 保持原有的 low, high 模式样式 ... */

  /* ================= 響應式 ================= */
  @media (max-width: 520px) {
    .app-container { height: 94vh; border-radius: 32px; }
    .bubble { padding: 12px 18px; font-size: 0.92rem; }
    .send-btn { width: 52px; height: 52px; font-size: 1.6rem; }
    .attach-btn { width: 38px; height: 38px; font-size: 1.4rem; }
    .input-wrapper input { padding: 14px 0; }
  }
</style>
</head>
<body data-theme="pink" data-perf="normal">

<!-- 背景与主容器保持原样 -->

<div class="app-container" id="appContainer">
  <!-- 视图1：会话列表（保持原样） -->
  <!-- ... -->

  <!-- 视图2：聊天详情 -->
  <div class="view view-right-hidden" id="chatView">
    <div class="chat-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="chat-header-info">
        <div class="chat-header-name"><span id="chatHeaderEmoji">💬</span><span id="chatHeaderTitle">正常對話</span></div>
        <div class="chat-header-status"><span class="status-dot"></span><span id="chatHeaderStatus">在线</span></div>
        <div class="api-input-wrapper">
          <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API 密钥...">
          <button class="save-btn" id="saveApiBtn">保存</button>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="followup-section" id="followupSection">
      <div class="followup-title">
        <span class="dot"></span><span>可能想問</span>
        <div class="auto-followup" id="autoFollowup"><span class="toggle-switch"></span><span>自動追問</span></div>
      </div>
      <div class="followup-list" id="followupList"><span class="followup-empty">AI 回覆後將顯示跟進建議...</span></div>
    </div>

    <!-- 底部输入区（改造后） -->
    <div class="chat-footer">
      <!-- 图片预览容器 -->
      <div class="image-preview-container" id="imagePreviewContainer"></div>
      
      <!-- 左侧 + 按钮 -->
      <button class="attach-btn" id="attachBtn" aria-label="上传照片">+</button>

      <!-- 输入框包裹层 -->
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
        <!-- 输入框内的图片图标 -->
        <button class="img-btn" id="imgBtn" aria-label="选择图片">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
      </div>

      <!-- 发送按钮 -->
      <button class="send-btn" id="sendBtn"><span>➤</span></button>
    </div>
    
    <!-- 隐藏的文件选择器 -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" multiple>
  </div>

  <!-- 设置面板（保持原样） -->
  <!-- ... -->
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  // 保持原有的主题/性能逻辑和变量
  let savedTheme = localStorage.getItem('deepseek_theme') || 'pink';
  let savedPerf = localStorage.getItem('deepseek_perf') || 'normal';
  document.body.dataset.theme = savedTheme;
  document.body.dataset.perf = savedPerf;

  // ... 保持原有的对话数据、DOM获取、设置逻辑 ...

  // ================= 新增：图片上传相关 DOM =================
  const attachBtn = document.getElementById('attachBtn');
  const imgBtn = document.getElementById('imgBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewContainer = document.getElementById('imagePreviewContainer');

  // 暂存待发送的图片（可多张）
  let pendingImages = []; // 存储 Base64 字符串

  // ================= 新增：图片上传事件 =================
  function triggerFileInput(e) {
    e.preventDefault();
    fileInput.click();
  }

  attachBtn.addEventListener('click', triggerFileInput);
  imgBtn.addEventListener('click', triggerFileInput);

  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    // 限制最多 3 张
    if (pendingImages.length + files.length > 3) {
      showToast('最多只能上传 3 张图片');
      return;
    }

    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const base64 = event.target.result;
        pendingImages.push(base64);
        renderImagePreviews();
      };
      reader.readAsDataURL(file);
    });

    // 清空 file input，允许重复选择同一张图片
    fileInput.value = '';
  });

  function renderImagePreviews() {
    imagePreviewContainer.innerHTML = '';
    pendingImages.forEach((imgSrc, index) => {
      const item = document.createElement('div');
      item.className = 'image-preview-item';
      item.innerHTML = `
        <img src="${imgSrc}" alt="预览">
        <button class="remove-preview" data-index="${index}">×</button>
      `;
      imagePreviewContainer.appendChild(item);
    });

    // 绑定删除事件
    document.querySelectorAll('.remove-preview').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.index);
        pendingImages.splice(idx, 1);
        renderImagePreviews();
      });
    });
  }

  // ================= 修改：addMessageToUI 支持图片 =================
  function addMessageToUI(role, content, isHTML = false, isLanding = false, imageList = []) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', role);

    // 如果有图片，优先渲染图片气泡
    if (imageList && imageList.length > 0) {
      imageList.forEach(imgSrc => {
        const bubbleDiv = document.createElement('div');
        bubbleDiv.classList.add('bubble', 'image-bubble');
        bubbleDiv.innerHTML = `<img src="${imgSrc}" alt="图片" onclick="event.stopPropagation(); window.open('${imgSrc}', '_blank')">`;
        
        // 点击复制：图片复制 base64 比较麻烦，这里可以跳过复制或简单提示
        bubbleDiv.addEventListener('click', (e) => {
          e.stopPropagation();
          showToast('长按可保存图片哦～');
        });

        messageDiv.appendChild(bubbleDiv);
      });
    }

    // 如果有文字，渲染文字气泡
    if (content && content.trim() !== '') {
      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('bubble');

      if (role === 'bot' && !isHTML) {
        try {
          const rawHtml = marked.parse(content);
          bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
          bubbleDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        } catch (e) { bubbleDiv.textContent = content; }
      } else if (isHTML) {
        bubbleDiv.innerHTML = content;
      } else {
        bubbleDiv.textContent = content;
      }

      bubbleDiv.addEventListener('click', (e) => { e.stopPropagation(); copyBubbleContent(bubbleDiv, e); });
      messageDiv.appendChild(bubbleDiv);
    }

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('time');
    timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    messageDiv.appendChild(timeDiv);

    chatMessages.appendChild(messageDiv);

    if (isLanding && savedPerf !== 'low') {
      const bubbles = messageDiv.querySelectorAll('.bubble');
      bubbles.forEach(b => {
        b.style.animation = 'none';
        b.offsetHeight;
        b.style.animation = 'bubbleLand 0.5s var(--apple-spring)';
      });
    }

    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' }));
    return messageDiv;
  }

  // ================= 修改：sendMessage 逻辑 =================
  async function sendMessage() {
    if (isWaitingForResponse || !currentConversation) return;
    const text = messageInput.value.trim();
    
    // 如果没有文字也没有图片，不发送
    if (!text && pendingImages.length === 0) {
      showToast('请输入消息或上传图片');
      return;
    }

    // 保存即将发送的图片副本
    const imagesToSend = [...pendingImages];
    
    // 清空输入框和预览
    messageInput.value = '';
    pendingImages = [];
    renderImagePreviews();

    // 按钮动画
    sendBtn.classList.add('pulsing');
    setTimeout(() => sendBtn.classList.remove('pulsing'), 500);

    // 能量波纹（保持原样）
    if (savedPerf !== 'low') {
      const btnRect = sendBtn.getBoundingClientRect();
      const cx = btnRect.left + btnRect.width / 2;
      const cy = btnRect.top + btnRect.height / 2;
      for (let i = 0; i < 2; i++) {
        setTimeout(() => {
          const ripple = document.createElement('div');
          ripple.className = 'energy-ripple';
          ripple.style.left = cx + 'px';
          ripple.style.top = cy + 'px';
          ripple.style.width = '60px';
          ripple.style.height = '60px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 900);
        }, i * 100);
      }
    }

    // 文字融入按鈕動畫（如果有文字）
    if (text) {
      await mergeTextToButton(text);
    }

    // 添加到 UI 和历史记录
    addMessageToUI('user', text, false, true, imagesToSend);
    currentConversation.history.push({ 
      role: 'user', 
      content: text, 
      imageList: imagesToSend // 保存图片数据到历史
    });

    // 如果没有 API Key，则提示后停止
    if (!apiKey) {
      addMessageToUI('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
      return;
    }

    // 发送给 API 的文本（如果只有图片没文字，给个默认提示语让 AI 回应）
    let apiPrompt = text;
    if (!apiPrompt && imagesToSend.length > 0) {
      apiPrompt = '[用户上传了一张图片]';
    }

    isWaitingForResponse = true;
    sendBtn.disabled = true;
    messageInput.disabled = true;
    resetFollowups();
    showTypingIndicator();

    try {
      const reply = await callDeepSeekAPI(apiPrompt);
      removeTypingIndicator();
      if (reply) {
        addMessageToUI('bot', reply, false, true);
        currentConversation.history.push({ role: 'assistant', content: reply });
        const suggestions = generateFollowups(text, reply, currentConversation.id);
        showFollowups(suggestions);
        if (autoFollowupEnabled && suggestions.length > 0) {
          setTimeout(() => {
            if (!isWaitingForResponse && currentConversation) {
              messageInput.value = suggestions[0];
              sendMessage();
            }
          }, 1500);
        }
      } else addMessageToUI('bot', '⚠️ 未收到有效回复。');
    } catch (error) {
      removeTypingIndicator();
      addMessageToUI('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
    } finally {
      isWaitingForResponse = false;
      sendBtn.disabled = false;
      messageInput.disabled = false;
      messageInput.focus();
    }
  }

  // ... 保持其余事件绑定和初始化逻辑不变 ...
  sendBtn.addEventListener('click', () => { if (isWaitingForResponse) return; sendMessage(); });
  messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
  // ... 等等 ...
})();
</script>
</body>
</html>
