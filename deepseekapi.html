<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeepSeek 聊天 · 丝滑模拟</title>
  <style>
    /* 全局重置 + 柔滑基调 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
    }

    /* 聊天卡片 — 玻璃拟态 + 丝滑阴影 */
    .chat-container {
      width: 100%;
      max-width: 780px;
      height: 90vh;
      max-height: 820px;
      background: rgba(20, 25, 40, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(100, 180, 255, 0.2);
      border-radius: 36px;
      box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.6), 
                  0 0 0 1px rgba(80, 160, 255, 0.1) inset,
                  0 0 30px rgba(0, 180, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .chat-container:focus-within {
      border-color: rgba(0, 200, 255, 0.5);
      box-shadow: 0 35px 55px -12px rgba(0, 150, 255, 0.3), 
                  0 0 0 1px rgba(0, 220, 255, 0.3) inset,
                  0 0 40px rgba(0, 200, 255, 0.2);
    }

    /* 头部 — 包含API密钥输入区，横向布局 */
    .chat-header {
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.6);
      border-bottom: 1px solid rgba(70, 150, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* API 密钥输入框 — 丝滑圆角 */
    .api-input-wrapper {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 100px;
      padding: 2px 2px 2px 20px;
      border: 1px solid rgba(120, 180, 255, 0.25);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .api-input-wrapper:focus-within {
      border-color: #4da6ff;
      box-shadow: 0 0 0 3px rgba(77, 166, 255, 0.15), 0 0 20px rgba(0, 140, 255, 0.2);
      background: rgba(10, 25, 45, 0.8);
    }

    .api-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #eef5ff;
      font-size: 0.95rem;
      padding: 12px 0;
      letter-spacing: 0.3px;
      font-weight: 400;
      min-width: 0;
    }

    .api-input-wrapper input::placeholder {
      color: rgba(170, 210, 255, 0.45);
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    /* 按钮通用重置 + 丝滑过渡 */
    button {
      background: none;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      letter-spacing: 0.2px;
    }

    /* 「保存」按钮 – 由代码生成，有自己的小动画 */
    .save-btn {
      background: linear-gradient(135deg, #1b6aff, #00b4ff);
      border-radius: 100px;
      padding: 10px 18px;
      font-size: 0.85rem;
      box-shadow: 0 6px 14px rgba(0, 120, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 600;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .save-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .save-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 20px rgba(0, 150, 255, 0.5);
      background: linear-gradient(135deg, #2f7aff, #1ebaff);
    }

    .save-btn:hover::after {
      opacity: 1;
    }

    .save-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 120, 255, 0.5);
      transition: all 0.1s ease;
    }

    /* 消息区域 — 丝滑滚动 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 22px 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      background: radial-gradient(ellipse at 30% 10%, rgba(30, 70, 120, 0.2), transparent 70%);
    }

    /* 自定义滚动条 — 更现代 */
    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 20px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(100, 180, 255, 0.4);
      border-radius: 20px;
      transition: background 0.3s;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 200, 255, 0.8);
    }

    /* 消息气泡 */
    .message {
      max-width: 85%;
      display: flex;
      flex-direction: column;
      animation: messageAppear 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
    }

    @keyframes messageAppear {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 14px 20px;
      border-radius: 26px;
      font-size: 0.98rem;
      line-height: 1.55;
      word-break: break-word;
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      letter-spacing: 0.2px;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #0066ff, #0099ff);
      color: white;
      border-bottom-right-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 18px -8px rgba(0, 120, 255, 0.5);
    }

    .message.bot .bubble {
      background: rgba(30, 42, 60, 0.85);
      color: #e6f0ff;
      border-bottom-left-radius: 8px;
      border: 1px solid rgba(80, 160, 255, 0.25);
      box-shadow: 0 12px 18px -8px rgba(0, 0, 0, 0.6);
    }

    .message .time {
      font-size: 0.7rem;
      color: rgba(180, 210, 255, 0.5);
      margin-top: 6px;
      margin-left: 8px;
      margin-right: 8px;
      letter-spacing: 0.3px;
    }

    /* 底部输入区域 — 精巧 */
    .chat-footer {
      padding: 16px 22px 20px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(70, 150, 255, 0.15);
    }

    .chat-footer input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 100px;
      padding: 16px 22px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .chat-footer input:focus {
      border-color: #4da6ff;
      box-shadow: 0 0 0 4px rgba(77, 166, 255, 0.15), 0 0 24px rgba(0, 150, 255, 0.2);
      background: rgba(10, 25, 45, 0.8);
    }

    .chat-footer input::placeholder {
      color: rgba(170, 210, 255, 0.45);
      font-weight: 300;
    }

    /* 发送按钮 — 代码生成，带悬浮/点击动画 */
    .send-btn {
      background: linear-gradient(145deg, #0b6eff, #00a2ff);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 20px rgba(0, 120, 255, 0.4), 0 0 0 0 rgba(0, 180, 255, 0.6);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .send-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.5), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .send-btn:hover {
      transform: scale(1.07) translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 150, 255, 0.6), 0 0 0 8px rgba(0, 170, 255, 0.15);
    }

    .send-btn:hover::before {
      opacity: 1;
    }

    .send-btn:active {
      transform: scale(0.94) translateY(1px);
      box-shadow: 0 4px 12px rgba(0, 120, 255, 0.6), 0 0 0 2px rgba(0, 170, 255, 0.3);
      transition: all 0.08s ease;
    }

    /* 防抖/禁用状态 */
    .send-btn:disabled, .save-btn:disabled {
      opacity: 0.5;
      transform: scale(0.98);
      pointer-events: none;
      filter: grayscale(0.5);
      box-shadow: none;
    }

    /* 模拟「DeepSeek 正在输入」效果 */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      background: rgba(40, 60, 90, 0.8);
      border-radius: 30px;
      width: fit-content;
      margin-top: 4px;
      border: 1px solid rgba(80, 160, 255, 0.3);
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #7abaff;
      border-radius: 50%;
      display: inline-block;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* 通知小提示 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 35, 60, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 100px;
      color: #bfe2ff;
      font-size: 0.9rem;
      border: 1px solid rgba(0, 180, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 小屏幕适应 */
    @media (max-width: 520px) {
      .chat-container {
        height: 94vh;
        border-radius: 28px;
      }
      .chat-header {
        padding: 14px 16px;
      }
      .message {
        max-width: 92%;
      }
      .bubble {
        padding: 12px 16px;
        font-size: 0.92rem;
      }
      .chat-footer {
        padding: 12px 16px 16px;
      }
      .chat-footer input {
        padding: 14px 18px;
      }
      .send-btn {
        width: 52px;
        height: 52px;
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- 头部：API 密钥设置 + 保存按钮 -->
  <div class="chat-header">
    <div class="api-input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API 密钥..." autocomplete="off" spellcheck="false">
    </div>
    <button class="save-btn" id="saveApiBtn">保存密钥</button>
  </div>

  <!-- 消息显示区 -->
  <div class="chat-messages" id="chatMessages">
    <!-- 初始欢迎消息，由 JS 动态生成也可以，这里直接写一条为了视觉 -->
    <div class="message bot">
      <div class="bubble">你好！我是 DeepSeek 助手。请先输入 API 密钥，然后就可以开始对话了 ✨</div>
      <div class="time">刚刚</div>
    </div>
  </div>

  <!-- 底部输入区 -->
  <div class="chat-footer">
    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script>
  (function() {
    // --- 获取 DOM 元素 ---
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiBtn = document.getElementById('saveApiBtn');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const toastEl = document.getElementById('toast');

    // --- 全局状态 ---
    let apiKey = localStorage.getItem('deepseek_api_key') || '';   // 从本地存储恢复
    let isWaitingForResponse = false;   // 防止重复发送

    // 初始化：如果本地有密钥，填入输入框
    if (apiKey) {
      apiKeyInput.value = apiKey;
    }

    // --- 工具函数：显示 toast 通知 ---
    function showToast(text, duration = 2000) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    // --- 保存 API 密钥 ---
    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        showToast('密钥不能为空', 1800);
        return;
      }
      apiKey = key;
      localStorage.setItem('deepseek_api_key', key);
      showToast('✅ API 密钥已保存', 1600);
      // 小动画反馈：按钮短暂变化
      saveApiBtn.style.transform = 'scale(0.95)';
      setTimeout(() => { saveApiBtn.style.transform = ''; }, 120);
    }

    // --- 添加消息到界面 (平滑滚动到底部) ---
    function addMessage(role, content, isTyping = false) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', role);

      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('bubble');
      bubbleDiv.textContent = content;

      const timeDiv = document.createElement('div');
      timeDiv.classList.add('time');
      // 简单的时间格式
      const now = new Date();
      timeDiv.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      messageDiv.appendChild(bubbleDiv);
      messageDiv.appendChild(timeDiv);
      chatMessages.appendChild(messageDiv);

      // 丝滑滚动到底部
      requestAnimationFrame(() => {
        chatMessages.scrollTo({
          top: chatMessages.scrollHeight,
          behavior: 'smooth'
        });
      });

      return messageDiv;
    }

    // --- 显示「正在输入」指示器 (返回元素用于移除) ---
    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.classList.add('message', 'bot');
      typingDiv.id = 'typingIndicator';

      const indicatorWrapper = document.createElement('div');
      indicatorWrapper.classList.add('typing-indicator');
      indicatorWrapper.innerHTML = '<span></span><span></span><span></span>';

      typingDiv.appendChild(indicatorWrapper);
      chatMessages.appendChild(typingDiv);

      requestAnimationFrame(() => {
        chatMessages.scrollTo({
          top: chatMessages.scrollHeight,
          behavior: 'smooth'
        });
      });

      return typingDiv;
    }

    // --- 移除打字指示器 ---
    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    // --- 核心：调用 DeepSeek API (兼容 OpenAI 格式) ---
    async function callDeepSeekAPI(userMessage) {
      // 检查密钥
      if (!apiKey) {
        addMessage('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。');
        return null;
      }

      const url = 'https://api.deepseek.com/v1/chat/completions';  // 官方 API 端点

      const requestBody = {
        model: 'deepseek-chat',  // 标准模型
        messages: [
          { role: 'user', content: userMessage }
        ],
        temperature: 0.7,
        stream: false
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          const errorMsg = errorData.error?.message || `HTTP ${response.status}`;
          throw new Error(errorMsg);
        }

        const data = await response.json();
        const botReply = data.choices?.[0]?.message?.content;
        if (!botReply) throw new Error('API 返回内容为空');
        return botReply;

      } catch (error) {
        console.error('DeepSeek API 错误:', error);
        // 将错误信息作为 bot 消息返回，但不要直接暴露密钥等敏感信息
        return `❌ 请求失败: ${error.message || '未知错误，请检查密钥或网络'}`;
      }
    }

    // --- 发送消息逻辑 ---
    async function sendMessage() {
      // 防止重复发送 / 等待状态
      if (isWaitingForResponse) {
        showToast('请等待当前回复完成', 1200);
        return;
      }

      const text = messageInput.value.trim();
      if (!text) {
        showToast('请输入消息内容', 1200);
        return;
      }

      // 清空输入框（提前，提升手感）
      messageInput.value = '';

      // 1. 将用户消息添加到界面
      addMessage('user', text);

      // 2. 检查是否有 API 密钥
      if (!apiKey) {
        addMessage('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
        return;
      }

      // 3. 锁定发送，显示打字指示器
      isWaitingForResponse = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;  // 可选，防止输入，但让用户依然可看，体验更好；也可以不禁用，看个人喜好，这里禁用输入框加强反馈
      // 但为了友好，让输入框依然可聚焦但不可编辑？ 简化处理，暂时禁用
      // 使用 300ms 后恢复输入框可用状态？ 但我们要在响应后恢复。 ok

      const typingIndicator = showTypingIndicator();

      try {
        // 4. 调用 API
        const reply = await callDeepSeekAPI(text);

        // 5. 移除打字指示器，显示回复
        removeTypingIndicator();

        if (reply) {
          addMessage('bot', reply);
        } else {
          addMessage('bot', '⚠️ 未收到有效回复。');
        }

      } catch (error) {
        removeTypingIndicator();
        addMessage('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
      } finally {
        // 6. 解锁
        isWaitingForResponse = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();  // 丝滑聚焦
      }
    }

    // --- 绑定事件监听 ---

    // 保存密钥按钮
    saveApiBtn.addEventListener('click', saveApiKey);

    // 发送按钮点击
    sendBtn.addEventListener('click', sendMessage);

    // 输入框按 Enter 发送（但排除 shift+enter 换行，这里单行输入不需要）
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();  // 防止任何默认行为
        sendMessage();
      }
    });

    // 当输入框重新获得焦点时，移除可能遗留的disabled（但由状态管理已经处理）
    // 额外优化：点击发送按钮后，确保输入框可用（由 finally 处理）

    // 允许用户按回车保存密钥？不用，用点击保存。
    // 但是为了体验：在 apiKeyInput 按下回车也可以触发保存
    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveApiKey();
      }
    });

    // 额外丝滑动画：在发送按钮上添加涟漪效果 (简单处理，点击时已由 CSS 提供)
    // 另外，按钮点击时禁用是在逻辑中完成的

    // 在页面加载时，如果本地存储有密钥，显示一个小提示（可选）
    window.addEventListener('load', () => {
      if (apiKey) {
        showToast('已加载保存的 API 密钥', 1500);
      }
      // 自动聚焦到输入框，方便聊天
      messageInput.focus();
    });

    // 滚动条自动到底部初始
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // 处理 user 禁用输入框时候的视觉反馈已经在 CSS 中 .send-btn:disabled 等
    // 同时也要让 messageInput 视觉上有禁用感，但不用太明显，保留可读性
    // 添加一点样式？ 可以动态加类，但无伤大雅

    // 为了输入框禁用时视觉更好，可以加一个样式类，但我们直接使用css属性选择器即可
    // 在 style 中补充: 可添加 input:disabled { opacity: 0.6; }
    // 但已经动态生成，加在style中
    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
      .chat-footer input:disabled {
        opacity: 0.55;
        background: rgba(0, 0, 0, 0.2);
        border-color: rgba(120, 180, 255, 0.1);
        cursor: not-allowed;
      }
    `;
    document.head.appendChild(styleSheet);

  })();
</script>
</body>
</html>
