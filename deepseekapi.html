<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeepSeek 聊天 · Q弹丝滑版</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    /* ============ 弹簧曲线变量 ============ */
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);        /* 强回弹 */
      --spring-soft: cubic-bezier(0.25, 1.4, 0.5, 1);      /* 柔回弹 */
      --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);    /* 大弹跳 */
      --smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    /* 背景漂浮光斑 */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.4;
      z-index: 0;
      pointer-events: none;
      animation: floatBlob 16s ease-in-out infinite;
    }
    body::before {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #1b6aff, transparent 70%);
      top: -120px; left: -140px;
    }
    body::after {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #00b4ff, transparent 70%);
      bottom: -200px; right: -170px;
      animation-delay: -8s;
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(50px,-40px) scale(1.2); }
    }

    /* ============ 聊天卡片 — 入场弹跳 ============ */
    .chat-container {
      width: 100%;
      max-width: 780px;
      height: 90vh;
      max-height: 820px;
      background: rgba(20, 25, 40, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(100, 180, 255, 0.2);
      border-radius: 46px;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7),
                  0 0 0 1px rgba(80,160,255,0.1) inset,
                  0 0 40px rgba(0,180,255,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
      transition: box-shadow 0.5s var(--smooth),
                  border-color 0.5s var(--smooth),
                  transform 0.6s var(--spring);
      animation: containerIn 1s var(--spring) both;
    }

    @keyframes containerIn {
      0% { opacity: 0; transform: translateY(60px) scale(0.85); }
      60% { opacity: 1; transform: translateY(-8px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-container:focus-within {
      border-color: rgba(0, 200, 255, 0.5);
      transform: scale(1.005);
      box-shadow: 0 40px 70px -15px rgba(0,150,255,0.35),
                  0 0 0 1px rgba(0,220,255,0.3) inset,
                  0 0 60px rgba(0,200,255,0.25);
    }

    /* ============ 头部 ============ */
    .chat-header {
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.6);
      border-bottom: 1px solid rgba(70, 150, 255, 0.15);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* ============ API 输入框 ============ */
    .api-input-wrapper {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 100px;
      padding: 2px 2px 2px 22px;
      border: 1px solid rgba(120, 180, 255, 0.25);
      transition: all 0.5s var(--spring);
    }

    .api-input-wrapper:focus-within {
      border-color: #4da6ff;
      box-shadow: 0 0 0 4px rgba(77,166,255,0.15),
                  0 0 24px rgba(0,140,255,0.25);
      background: rgba(10, 25, 45, 0.85);
      transform: scale(1.02);
    }

    .api-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #eef5ff;
      font-size: 0.95rem;
      padding: 12px 0;
      letter-spacing: 0.3px;
      min-width: 0;
    }

    .api-input-wrapper input::placeholder {
      color: rgba(170, 210, 255, 0.45);
      font-weight: 300;
    }

    /* ============ 按钮通用 ============ */
    button {
      background: none;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s var(--spring);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      letter-spacing: 0.2px;
    }

    /* ============ 保存按钮 ============ */
    .save-btn {
      background: linear-gradient(135deg, #1b6aff, #00b4ff);
      border-radius: 100px;
      padding: 11px 22px;
      font-size: 0.85rem;
      box-shadow: 0 6px 16px rgba(0, 120, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 600;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      animation: btnBreath 3s ease-in-out infinite;
    }

    @keyframes btnBreath {
      0%, 100% {
        box-shadow: 0 6px 16px rgba(0, 120, 255, 0.35);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 8px 26px rgba(0, 180, 255, 0.65);
        transform: scale(1.03);
      }
    }

    .save-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .save-btn:hover {
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 16px 32px rgba(0, 150, 255, 0.65);
      animation: none;
    }

    .save-btn:hover::after { opacity: 1; }

    .save-btn:active {
      transform: translateY(2px) scale(0.92);
      box-shadow: 0 3px 10px rgba(0, 120, 255, 0.6);
      transition: all 0.12s var(--bounce);
    }

    /* ============ 消息区 ============ */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 22px 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      background: radial-gradient(ellipse at 30% 10%, rgba(30,70,120,0.2), transparent 70%);
      overflow-x: hidden;
    }

    .chat-messages::-webkit-scrollbar { width: 7px; }
    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius: 20px;
      margin: 6px 0;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(100,180,255,0.5), rgba(0,150,255,0.7));
      border-radius: 20px;
      transition: background 0.3s;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 200, 255, 0.9);
    }

    /* ============ 消息气泡 — Q弹入场 ============ */
    .message {
      max-width: 85%;
      display: flex;
      flex-direction: column;
      transform-origin: bottom;
      animation: messageQ 0.7s var(--spring) forwards;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* 用户消息从右下方弹入 */
    .message.user {
      align-self: flex-end;
      align-items: flex-end;
      transform-origin: bottom right;
      animation: messageQRight 0.65s var(--spring) forwards;
    }

    /* bot 消息从左下方弹入 */
    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
      transform-origin: bottom left;
      animation: messageQLeft 0.65s var(--spring) forwards;
    }

    @keyframes messageQRight {
      0% {
        opacity: 0;
        transform: translate(40px, 20px) scale(0.5) rotate(6deg);
      }
      50% {
        opacity: 1;
        transform: translate(-6px, -4px) scale(1.08) rotate(-2deg);
      }
      75% {
        transform: translate(3px, 2px) scale(0.97) rotate(1deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0);
      }
    }

    @keyframes messageQLeft {
      0% {
        opacity: 0;
        transform: translate(-40px, 20px) scale(0.5) rotate(-6deg);
      }
      50% {
        opacity: 1;
        transform: translate(6px, -4px) scale(1.08) rotate(2deg);
      }
      75% {
        transform: translate(-3px, 2px) scale(0.97) rotate(-1deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0);
      }
    }

    @keyframes messageQ {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============ 气泡本体 — 极圆润 ============ */
    .bubble {
      padding: 15px 22px;
      border-radius: 32px;   /* 超大圆角，无任何尖角 */
      font-size: 0.98rem;
      line-height: 1.6;
      word-break: break-word;
      transition: all 0.5s var(--spring);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      letter-spacing: 0.2px;
      position: relative;
      overflow: hidden;
      will-change: transform;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #0066ff, #0099ff);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 14px 26px -8px rgba(0, 120, 255, 0.55);
      animation: bubbleShine 3s ease-in-out infinite;
    }

    /* 气泡上有一道缓慢扫过的光晕 */
    @keyframes bubbleShine {
      0%, 100% { box-shadow: 0 14px 26px -8px rgba(0,120,255,0.55); }
      50% { box-shadow: 0 18px 34px -8px rgba(0,160,255,0.85); }
    }

    .message.bot .bubble {
      background: rgba(30, 42, 60, 0.85);
      color: #e6f0ff;
      border: 1px solid rgba(80, 160, 255, 0.28);
      box-shadow: 0 14px 26px -8px rgba(0, 0, 0, 0.6);
    }

    /* 悬浮 Q 弹 */
    .bubble:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .message.user .bubble:hover {
      box-shadow: 0 20px 40px -10px rgba(0, 140, 255, 0.8);
      transform: translateY(-4px) scale(1.03);
    }

    .message.bot .bubble:hover {
      box-shadow: 0 20px 38px -10px rgba(0, 80, 180, 0.6);
      border-color: rgba(80, 180, 255, 0.55);
      transform: translateY(-4px) scale(1.02);
    }

    .message .time {
      font-size: 0.7rem;
      color: rgba(180, 210, 255, 0.5);
      margin-top: 6px;
      margin-left: 10px;
      margin-right: 10px;
      letter-spacing: 0.3px;
    }

    /* ============ Markdown 内容样式 ============ */
    .bubble p { margin: 0 0 8px 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: #7ec8ff; font-weight: 700; }
    .bubble em { color: #a8d8ff; font-style: italic; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      margin: 12px 0 6px; color: #b8e0ff; font-weight: 600; line-height: 1.35;
    }
    .bubble h1 { font-size: 1.2rem; }
    .bubble h2 { font-size: 1.08rem; }
    .bubble h3 { font-size: 1rem; }
    .bubble h4 { font-size: 0.95rem; }
    .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }

    .bubble ul, .bubble ol { margin: 8px 0; padding-left: 24px; }
    .bubble li { margin: 5px 0; line-height: 1.55; }
    .bubble li::marker { color: #4da6ff; }

    .bubble code:not(pre code) {
      background: rgba(0, 100, 200, 0.28);
      padding: 3px 8px;
      border-radius: 10px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.88em;
      color: #9fd5ff;
      border: 1px solid rgba(80, 160, 255, 0.2);
    }

    .bubble pre {
      background: rgba(0, 0, 0, 0.55) !important;
      border: 1px solid rgba(80, 160, 255, 0.28);
      border-radius: 22px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 10px 0;
      font-size: 0.85rem;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    }
    .bubble pre code {
      background: transparent !important;
      padding: 0;
      font-family: 'Consolas', 'Monaco', monospace;
      color: #e6f0ff;
      border: none;
    }

    .bubble blockquote {
      border-left: 3px solid #4da6ff;
      padding: 8px 14px;
      margin: 10px 0;
      color: #a8c8e8;
      font-style: italic;
      background: rgba(0, 100, 200, 0.1);
      border-radius: 0 18px 18px 0;
    }

    .bubble table {
      border-collapse: separate;
      border-spacing: 0;
      margin: 10px 0;
      font-size: 0.9rem;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(80, 160, 255, 0.3);
    }
    .bubble th, .bubble td {
      border-bottom: 1px solid rgba(80, 160, 255, 0.2);
      padding: 8px 12px;
    }
    .bubble th { background: rgba(0, 100, 200, 0.25); color: #bfe2ff; font-weight: 600; }
    .bubble tr:last-child td { border-bottom: none; }

    .bubble a {
      color: #4da6ff;
      text-decoration: none;
      border-bottom: 1px dashed rgba(77, 166, 255, 0.5);
      transition: all 0.3s ease;
    }
    .bubble a:hover { color: #7ec8ff; border-bottom-style: solid; border-bottom-color: #7ec8ff; }

    .bubble hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(80,160,255,0.4), transparent);
      margin: 14px 0;
    }

    /* ============ 底部输入 ============ */
    .chat-footer {
      padding: 16px 22px 20px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(70, 150, 255, 0.15);
    }

    .chat-footer input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 100px;
      padding: 16px 24px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.5s var(--spring);
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .chat-footer input:focus {
      border-color: #4da6ff;
      box-shadow: 0 0 0 4px rgba(77,166,255,0.15),
                  0 0 28px rgba(0,150,255,0.25);
      background: rgba(10, 25, 45, 0.85);
      transform: scale(1.02);
    }

    .chat-footer input::placeholder {
      color: rgba(170, 210, 255, 0.45);
      font-weight: 300;
    }

    .chat-footer input:disabled {
      opacity: 0.55;
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(120, 180, 255, 0.1);
      cursor: not-allowed;
    }

    /* ============ 发送按钮 — 更圆、更Q ============ */
    .send-btn {
      background: linear-gradient(145deg, #0b6eff, #00a2ff);
      width: 62px;
      height: 62px;
      border-radius: 50%;       /* 完美圆形 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      box-shadow: 0 10px 26px rgba(0, 120, 255, 0.5),
                  inset 0 -2px 8px rgba(0, 0, 0, 0.15),
                  inset 0 2px 8px rgba(255, 255, 255, 0.25);
      transition: all 0.5s var(--spring);
      border: none;
      flex-shrink: 0;
      color: white;
      position: relative;
      overflow: hidden;
      animation: sendBreath 2.6s ease-in-out infinite;
    }

    /* 呼吸光晕 */
    @keyframes sendBreath {
      0%, 100% {
        box-shadow: 0 10px 26px rgba(0, 120, 255, 0.5),
                    0 0 0 0 rgba(0, 180, 255, 0.5),
                    inset 0 -2px 8px rgba(0,0,0,0.15),
                    inset 0 2px 8px rgba(255,255,255,0.25);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 12px 34px rgba(0, 160, 255, 0.75),
                    0 0 0 8px rgba(0, 180, 255, 0.12),
                    inset 0 -2px 8px rgba(0,0,0,0.15),
                    inset 0 2px 8px rgba(255,255,255,0.25);
        transform: scale(1.04);
      }
    }

    /* 内圈光斑 */
    .send-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.6), transparent 65%);
      opacity: 0;
      transition: opacity 0.4s;
      border-radius: 50%;
    }

    /* 外圈涟漪 */
    .send-btn::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(0, 200, 255, 0.5);
      opacity: 0;
      transition: all 0.6s var(--spring);
    }

    .send-btn:hover {
      transform: scale(1.15) rotate(6deg);
      box-shadow: 0 18px 38px rgba(0, 150, 255, 0.85),
                  inset 0 -2px 8px rgba(0,0,0,0.15),
                  inset 0 2px 8px rgba(255,255,255,0.3);
      animation: none;
    }

    .send-btn:hover::before { opacity: 1; }

    .send-btn:hover::after {
      inset: -10px;
      opacity: 1;
      border-color: rgba(0, 200, 255, 0);
      background: radial-gradient(circle, rgba(0,180,255,0.3), transparent 70%);
    }

    .send-btn:active {
      transform: scale(0.85) rotate(-4deg);
      box-shadow: 0 4px 14px rgba(0, 120, 255, 0.7);
      transition: all 0.15s var(--bounce);
    }

    .send-btn:disabled {
      opacity: 0.5;
      transform: scale(0.95);
      pointer-events: none;
      filter: grayscale(0.5);
      box-shadow: none;
      animation: none;
    }

    /* ============ 打字指示器 ============ */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 22px;
      background: rgba(40, 60, 90, 0.8);
      border-radius: 100px;
      width: fit-content;
      border: 1px solid rgba(80, 160, 255, 0.3);
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.5);
      animation: typingIn 0.5s var(--spring) both;
    }

    @keyframes typingIn {
      0% { opacity: 0; transform: scale(0.4) translateY(10px); }
      60% { opacity: 1; transform: scale(1.08) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #7abaff;
      border-radius: 50%;
      display: inline-block;
      animation: typingBounce 1.4s infinite var(--spring);
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      30% { transform: translateY(-9px) scale(1.2); opacity: 1; }
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(30px) scale(0.85);
      background: rgba(20, 35, 60, 0.95);
      backdrop-filter: blur(14px);
      padding: 12px 26px;
      border-radius: 100px;
      color: #bfe2ff;
      font-size: 0.9rem;
      border: 1px solid rgba(0, 180, 255, 0.4);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: all 0.55s var(--spring);
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* ============ 小屏 ============ */
    @media (max-width: 520px) {
      .chat-container { height: 94vh; border-radius: 36px; }
      .chat-header { padding: 14px 16px; }
      .message { max-width: 92%; }
      .bubble { padding: 13px 18px; font-size: 0.92rem; border-radius: 28px; }
      .chat-footer { padding: 12px 16px 16px; }
      .chat-footer input { padding: 14px 20px; }
      .send-btn { width: 56px; height: 56px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="api-input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API 密钥..." autocomplete="off" spellcheck="false">
    </div>
    <button class="save-btn" id="saveApiBtn">保存密钥</button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="bubble">你好！我是 DeepSeek 助手 ✨<br>请先输入 API 密钥，然后就可以开始对话了。</div>
      <div class="time">刚刚</div>
    </div>
  </div>

  <div class="chat-footer">
    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function() {
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiBtn = document.getElementById('saveApiBtn');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const toastEl = document.getElementById('toast');

    let apiKey = localStorage.getItem('deepseek_api_key') || '';
    let isWaitingForResponse = false;

    if (apiKey) apiKeyInput.value = apiKey;

    marked.setOptions({ breaks: true, gfm: true });

    function showToast(text, duration = 2000) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (!key) { showToast('密钥不能为空', 1800); return; }
      apiKey = key;
      localStorage.setItem('deepseek_api_key', key);
      showToast('✅ API 密钥已保存', 1600);
      // Q弹反馈
      saveApiBtn.animate(
        [
          { transform: 'scale(1)' },
          { transform: 'scale(0.85)' },
          { transform: 'scale(1.1)' },
          { transform: 'scale(1)' }
        ],
        { duration: 500, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
      );
    }

    // 添加消息
    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', role);

      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('bubble');

      if (role === 'bot') {
        const rawHtml = marked.parse(content);
        bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
        bubbleDiv.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
      } else {
        bubbleDiv.textContent = content;
      }

      const timeDiv = document.createElement('div');
      timeDiv.classList.add('time');
      const now = new Date();
      timeDiv.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      messageDiv.appendChild(bubbleDiv);
      messageDiv.appendChild(timeDiv);
      chatMessages.appendChild(messageDiv);

      // 追加一个 Q 弹涟漪在气泡外层
      setTimeout(() => {
        bubbleDiv.animate(
          [
            { transform: 'scale(1)' },
            { transform: 'scale(1.03)' },
            { transform: 'scale(1)' }
          ],
          { duration: 600, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
        );
      }, 650);

      requestAnimationFrame(() => {
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
      });

      return messageDiv;
    }

    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.classList.add('message', 'bot');
      typingDiv.id = 'typingIndicator';

      const wrapper = document.createElement('div');
      wrapper.classList.add('typing-indicator');
      wrapper.innerHTML = '<span></span><span></span><span></span>';

      typingDiv.appendChild(wrapper);
      chatMessages.appendChild(typingDiv);

      requestAnimationFrame(() => {
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
      });
      return typingDiv;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        indicator.style.opacity = '0';
        indicator.style.transform = 'scale(0.6) translateY(-6px)';
        setTimeout(() => indicator.remove(), 300);
      }
    }

    async function callDeepSeekAPI(userMessage) {
      if (!apiKey) {
        addMessage('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。');
        return null;
      }

      const url = 'https://api.deepseek.com/v1/chat/completions';
      const requestBody = {
        model: 'deepseek-chat',
        messages: [{ role: 'user', content: userMessage }],
        temperature: 0.7,
        stream: false
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const botReply = data.choices?.[0]?.message?.content;
        if (!botReply) throw new Error('API 返回内容为空');
        return botReply;

      } catch (error) {
        console.error('DeepSeek API 错误:', error);
        let friendlyMsg = '';
        if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
          friendlyMsg = '🌐 网络请求失败。请改用本机伺服器打开，或检查网络。';
        } else if (error.message.includes('401')) {
          friendlyMsg = '🔑 API 密钥无效或已过期。';
        } else if (error.message.includes('402')) {
          friendlyMsg = '💰 账户余额不足。';
        } else if (error.message.includes('429')) {
          friendlyMsg = '⏳ 请求太频繁，请稍后再试。';
        } else {
          friendlyMsg = `❌ 请求失败：${error.message || '未知错误'}`;
        }
        return friendlyMsg;
      }
    }

    async function sendMessage() {
      if (isWaitingForResponse) {
        showToast('请等待当前回复完成', 1200);
        return;
      }

      const text = messageInput.value.trim();
      if (!text) {
        showToast('请输入消息内容', 1200);
        return;
      }

      messageInput.value = '';
      addMessage('user', text);

      if (!apiKey) {
        addMessage('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
        return;
      }

      isWaitingForResponse = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;

      const typingIndicator = showTypingIndicator();

      try {
        const reply = await callDeepSeekAPI(text);
        removeTypingIndicator();
        if (reply) addMessage('bot', reply);
        else addMessage('bot', '⚠️ 未收到有效回复。');
      } catch (error) {
        removeTypingIndicator();
        addMessage('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
      } finally {
        isWaitingForResponse = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    saveApiBtn.addEventListener('click', saveApiKey);
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveApiKey(); }
    });

    window.addEventListener('load', () => {
      if (apiKey) showToast('已加载保存的 API 密钥', 1500);
      messageInput.focus();
    });

    chatMessages.scrollTop = chatMessages.scrollHeight;
  })();
</script>
</body>
</html>
