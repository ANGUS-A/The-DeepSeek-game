<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DeepSeek</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }

  body {
    background: #05060a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    margin: 0;
    overflow: hidden;
    position: relative;
  }

  /* ===== 極光背景 ===== */
  .aurora-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .aurora-bg::before,
  .aurora-bg::after {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background:
      radial-gradient(circle at 20% 30%, rgba(0, 120, 255, 0.22) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(150, 0, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(0, 220, 255, 0.12) 0%, transparent 50%);
    animation: auroraMove1 20s ease-in-out infinite alternate;
    filter: blur(40px);
  }

  .aurora-bg::after {
    background:
      radial-gradient(circle at 70% 20%, rgba(0, 180, 255, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 30% 80%, rgba(80, 0, 200, 0.15) 0%, transparent 45%);
    animation: auroraMove2 25s ease-in-out infinite alternate;
  }

  @keyframes auroraMove1 {
    0% { transform: translate(0, 0) rotate(0deg) scale(1); }
    100% { transform: translate(8%, -6%) rotate(8deg) scale(1.1); }
  }

  @keyframes auroraMove2 {
    0% { transform: translate(0, 0) rotate(0deg) scale(1); }
    100% { transform: translate(-8%, 6%) rotate(-8deg) scale(1.15); }
  }

  /* ===== 粒子層 ===== */
  .bg-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .bg-particles span {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120, 200, 255, 0.95), transparent 70%);
    animation: floatUp linear infinite;
    opacity: 0;
    box-shadow: 0 0 8px rgba(0, 180, 255, 0.8);
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) scale(0.3); opacity: 0; }
    10% { opacity: 1; }
    50% { transform: translateY(-50vh) translateX(30px) scale(1.3); opacity: 0.7; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-110vh) translateX(-20px) scale(0.3); opacity: 0; }
  }

  /* ===== 主卡片 ===== */
  .chat-container {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 780px;
    height: 90vh;
    max-height: 820px;
    background: rgba(15, 20, 35, 0.72);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(100, 180, 255, 0.22);
    border-radius: 44px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.6s ease, border-color 0.6s ease;
    animation:
      cardEntrance 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) both,
      cardFloat 7s ease-in-out infinite alternate,
      cardGlow 4s ease-in-out infinite alternate;
    transform-style: preserve-3d;
  }

  @keyframes cardEntrance {
    0% {
      opacity: 0;
      transform: translateY(60px) scale(0.88) rotateX(12deg);
      filter: blur(12px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotateX(0);
      filter: blur(0);
    }
  }

  @keyframes cardFloat {
    0% { transform: translateY(0px) rotateZ(0deg); }
    100% { transform: translateY(-8px) rotateZ(0.4deg); }
  }

  @keyframes cardGlow {
    0% {
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8),
                  0 0 0 1px rgba(80, 160, 255, 0.1) inset,
                  0 0 30px rgba(0, 180, 255, 0.1);
      border-color: rgba(100, 180, 255, 0.2);
    }
    100% {
      box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.9),
                  0 0 0 1px rgba(80, 200, 255, 0.3) inset,
                  0 0 70px rgba(0, 200, 255, 0.3);
      border-color: rgba(0, 200, 255, 0.5);
    }
  }

  /* 頂部科技掃描線 */
  .chat-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #4da6ff, #00e0ff, #4da6ff, transparent);
    background-size: 200% 100%;
    animation: topScan 3s linear infinite;
    z-index: 10;
    border-radius: 44px 44px 0 0;
    filter: blur(0.5px);
    box-shadow: 0 0 12px rgba(0, 200, 255, 0.8);
  }

  @keyframes topScan {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ===== 頭部 ===== */
  .chat-header {
    padding: 18px 22px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    background: rgba(8, 14, 26, 0.65);
    border-bottom: 1px solid rgba(70, 150, 255, 0.15);
    backdrop-filter: blur(14px);
    position: relative;
    overflow: hidden;
    animation: headerSlide 0.9s 0.2s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }

  @keyframes headerSlide {
    0% { opacity: 0; transform: translateY(-40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .chat-header::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(80, 180, 255, 0.12), transparent);
    animation: headerShine 5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes headerShine {
    0%, 100% { left: -100%; }
    50% { left: 100%; }
  }

  .api-input-wrapper {
    flex: 1;
    min-width: 160px;
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 100px;
    padding: 2px 2px 2px 20px;
    border: 1px solid rgba(120, 180, 255, 0.25);
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    position: relative;
    animation: fadeSlideUp 0.9s 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }

  @keyframes fadeSlideUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .api-input-wrapper::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 100px;
    background: linear-gradient(90deg, transparent, rgba(0, 220, 255, 0.5), transparent);
    background-size: 200% 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: -1;
    filter: blur(2px);
  }

  .api-input-wrapper:focus-within::before {
    opacity: 1;
    animation: borderFlow 2.5s linear infinite;
  }

  @keyframes borderFlow {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .api-input-wrapper:focus-within {
    border-color: #4da6ff;
    box-shadow: 0 0 0 4px rgba(77, 166, 255, 0.15), 0 0 40px rgba(0, 140, 255, 0.35);
    background: rgba(10, 25, 50, 0.9);
    transform: scale(1.018);
  }

  .api-input-wrapper input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #eef5ff;
    font-size: 0.95rem;
    padding: 12px 0;
    min-width: 0;
    transition: color 0.5s ease;
  }

  .api-input-wrapper input::placeholder {
    color: rgba(170, 210, 255, 0.4);
    transition: all 0.5s ease;
  }

  .api-input-wrapper input:focus::placeholder {
    color: rgba(170, 210, 255, 0.15);
    transform: translateX(6px);
  }

  /* ===== 按鈕 ===== */
  button {
    background: none;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .save-btn {
    background: linear-gradient(135deg, #1b6aff, #00b4ff);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 0.85rem;
    box-shadow: 0 6px 18px rgba(0, 120, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.15);
    font-weight: 600;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    animation: fadeSlideUp 0.9s 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both,
               btnBreath 3.5s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes btnBreath {
    0%, 100% {
      box-shadow: 0 6px 18px rgba(0, 120, 255, 0.4);
    }
    50% {
      box-shadow: 0 10px 30px rgba(0, 150, 255, 0.7), 0 0 25px rgba(0, 200, 255, 0.4);
    }
  }

  .save-btn::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), transparent 70%);
    opacity: 0;
    transition: opacity 0.5s ease;
    border-radius: 100px;
  }

  .save-btn::after {
    content: '';
    position: absolute;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    top: 0;
    left: -80%;
    transform: skewX(-20deg);
    transition: left 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  .save-btn:hover {
    transform: translateY(-4px) scale(1.06);
    box-shadow: 0 20px 40px rgba(0, 150, 255, 0.7);
    background: linear-gradient(135deg, #3a85ff, #2ec4ff);
  }

  .save-btn:hover::before { opacity: 1; }
  .save-btn:hover::after { left: 140%; }

  .save-btn:active {
    transform: translateY(2px) scale(0.92);
    transition: all 0.1s ease;
    animation-play-state: paused;
  }

  .save-btn.saved {
    animation: savePulse 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes savePulse {
    0% { transform: scale(1); box-shadow: 0 6px 18px rgba(0, 120, 255, 0.4); }
    50% { transform: scale(1.15); box-shadow: 0 0 0 15px rgba(0, 220, 255, 0.4), 0 0 40px rgba(0, 200, 255, 0.8); }
    100% { transform: scale(1); box-shadow: 0 6px 18px rgba(0, 120, 255, 0.4); }
  }

  /* ===== 消息區域 ===== */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px 16px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
    background: radial-gradient(ellipse at 30% 10%, rgba(30, 70, 120, 0.25), transparent 70%);
    transition: background 1s ease;
    animation: fadeIn 1.2s 0.4s both;
    position: relative;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 20px; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(100, 180, 255, 0.5), rgba(0, 150, 255, 0.7));
    border-radius: 20px;
    transition: all 0.4s ease;
  }
  .chat-messages::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(100, 200, 255, 0.9), rgba(0, 180, 255, 1));
  }

  /* ===== 訊息氣泡 ===== */
  .message {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    opacity: 0;
    animation: messageAppear 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    position: relative;
  }

  @keyframes messageAppear {
    0% {
      opacity: 0;
      transform: translateY(30px) scale(0.85) rotateZ(3deg);
      filter: blur(10px);
    }
    55% {
      opacity: 1;
      transform: translateY(-6px) scale(1.03) rotateZ(-1deg);
      filter: blur(0);
    }
    75% {
      transform: translateY(3px) scale(0.99) rotateZ(0.5deg);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotateZ(0);
    }
  }

  .message.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .message.bot {
    align-self: flex-start;
    align-items: flex-start;
  }

  /* 訊息左側漣漪線 */
  .message::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 20%;
    width: 2px;
    height: 60%;
    border-radius: 2px;
    background: linear-gradient(180deg, transparent, rgba(0, 200, 255, 0.6), transparent);
    animation: sideLine 2.5s ease-in-out infinite;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .message.user::before {
    left: auto;
    right: -12px;
  }

  .message:hover::before {
    opacity: 1;
  }

  @keyframes sideLine {
    0%, 100% { transform: scaleY(0.5); opacity: 0.3; }
    50% { transform: scaleY(1.2); opacity: 1; }
  }

  /* 氣泡本體 */
  .bubble {
    padding: 14px 22px;
    border-radius: 28px;
    font-size: 0.98rem;
    line-height: 1.65;
    word-break: break-word;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    animation: bubbleBreath 5s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
  }

  /* 點擊時閃爍提示 */
  .bubble:active {
    transform: scale(0.98);
    transition: all 0.1s ease;
  }

  @keyframes bubbleBreath {
    0%, 100% {
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.6), 0 0 0 0 rgba(0, 200, 255, 0);
    }
    50% {
      box-shadow: 0 18px 38px -8px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 200, 255, 0.15);
    }
  }

  /* 複製成功時的脈衝 */
  .bubble.copied {
    animation: copyPulse 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes copyPulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(0, 220, 255, 0.4), 0 0 40px rgba(0, 220, 255, 0.8); }
    100% { transform: scale(1); box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.6); }
  }

  /* 複製漣漪 */
  .copy-ripple {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 220, 255, 0.6), transparent 70%);
    transform: scale(0);
    animation: copyRippleExpand 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes copyRippleExpand {
    to { transform: scale(5); opacity: 0; }
  }

  /* 氣泡光暈跟隨滑鼠 */
  .bubble::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.15), transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .bubble:hover::before {
    opacity: 1;
  }

  /* 高光掃過 */
  .bubble::after {
    content: '';
    position: absolute;
    top: 0;
    left: -150%;
    width: 80%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    transform: skewX(-25deg);
    transition: left 1s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none;
  }

  .bubble:hover::after {
    left: 150%;
  }

  /* 用戶氣泡 */
  .message.user .bubble {
    background: linear-gradient(135deg, #0066ff, #0099ff, #00b4ff);
    background-size: 200% 200%;
    animation: userGradient 4s ease-in-out infinite, bubbleBreath 4s ease-in-out infinite;
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 14px 28px -8px rgba(0, 120, 255, 0.6), 0 0 20px rgba(0, 150, 255, 0.2);
  }

  @keyframes userGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .message.user .bubble:hover {
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 20px 40px -8px rgba(0, 150, 255, 0.8), 0 0 40px rgba(0, 180, 255, 0.4);
  }

  /* 機器人氣泡 */
  .message.bot .bubble {
    background: rgba(28, 40, 60, 0.88);
    color: #e6f0ff;
    border: 1px solid rgba(80, 160, 255, 0.28);
    box-shadow: 0 14px 28px -8px rgba(0, 0, 0, 0.7);
    animation: botBorderPulse 4s ease-in-out infinite;
  }

  @keyframes botBorderPulse {
    0%, 100% {
      border-color: rgba(80, 160, 255, 0.28);
    }
    50% {
      border-color: rgba(0, 200, 255, 0.65);
      box-shadow: 0 14px 28px -8px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 180, 255, 0.25);
    }
  }

  .message.bot .bubble:hover {
    background: rgba(35, 50, 75, 0.95);
    transform: translateY(-3px) scale(1.015);
  }

  /* 時間戳 */
  .message .time {
    font-size: 0.7rem;
    color: rgba(180, 210, 255, 0.5);
    margin-top: 8px;
    margin-left: 10px;
    margin-right: 10px;
    transition: all 0.5s ease;
    animation: timeFadeIn 0.9s 0.3s both;
  }

  @keyframes timeFadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message:hover .time {
    color: rgba(180, 220, 255, 0.95);
    transform: translateX(3px);
  }

  /* 光標閃爍 */
  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 1.1em;
    background: linear-gradient(180deg, #4da6ff, #00e0ff);
    vertical-align: middle;
    margin-left: 2px;
    border-radius: 2px;
    animation: cursorBlink 0.9s steps(2) infinite;
    box-shadow: 0 0 8px rgba(0, 200, 255, 0.8);
  }

  @keyframes cursorBlink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* ===== Markdown 樣式 ===== */
  .bubble p { margin: 0 0 8px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: #7ec8ff; font-weight: 700; }
  .bubble em { color: #a8d8ff; font-style: italic; }
  .bubble h1, .bubble h2, .bubble h3 {
    margin: 12px 0 8px;
    color: #b8e0ff;
    font-weight: 600;
    transition: all 0.5s ease;
  }
  .bubble h1:hover, .bubble h2:hover, .bubble h3:hover {
    transform: translateX(6px);
    color: #d0eeff;
    text-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
  }
  .bubble h1 { font-size: 1.15rem; }
  .bubble h2 { font-size: 1.05rem; }
  .bubble h3 { font-size: 1rem; }

  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 24px; }
  .bubble li { margin: 5px 0; transition: all 0.4s ease; }
  .bubble li:hover { transform: translateX(5px); color: #bfe2ff; }

  .bubble code:not(pre code) {
    background: rgba(0, 100, 200, 0.28);
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.88em;
    color: #9fd5ff;
    transition: all 0.5s ease;
    display: inline-block;
  }
  .bubble code:not(pre code):hover {
    background: rgba(0, 150, 255, 0.5);
    transform: scale(1.08) rotate(-2deg);
    box-shadow: 0 0 15px rgba(0, 180, 255, 0.5);
  }

  .bubble pre {
    background: rgba(0, 0, 0, 0.6) !important;
    border: 1px solid rgba(80, 160, 255, 0.3);
    border-radius: 18px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 12px 0;
    font-size: 0.85rem;
    transition: all 0.6s ease;
    position: relative;
  }
  .bubble pre:hover {
    border-color: rgba(0, 200, 255, 0.7);
    box-shadow: 0 0 40px rgba(0, 180, 255, 0.3), 0 0 0 1px rgba(0, 200, 255, 0.3) inset;
    transform: translateY(-3px);
  }
  .bubble pre code {
    background: transparent !important;
    padding: 0;
    font-family: 'Consolas', 'Monaco', monospace;
    color: #e6f0ff;
  }

  .bubble blockquote {
    border-left: 4px solid #4da6ff;
    padding-left: 14px;
    margin: 10px 0;
    color: #a8c8e8;
    font-style: italic;
    transition: all 0.5s ease;
  }
  .bubble blockquote:hover {
    border-left-color: #7ec8ff;
    padding-left: 22px;
    color: #d0e8ff;
    text-shadow: 0 0 10px rgba(100, 200, 255, 0.3);
  }

  .bubble table {
    border-collapse: separate;
    border-spacing: 0;
    margin: 10px 0;
    font-size: 0.9rem;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(80, 160, 255, 0.3);
    transition: all 0.5s ease;
  }
  .bubble table:hover {
    border-color: rgba(0, 200, 255, 0.6);
    box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
  }
  .bubble th, .bubble td {
    border: none;
    border-bottom: 1px solid rgba(80, 160, 255, 0.2);
    border-right: 1px solid rgba(80, 160, 255, 0.2);
    padding: 8px 12px;
    transition: background 0.4s ease;
  }
  .bubble th:last-child, .bubble td:last-child { border-right: none; }
  .bubble tr:last-child td { border-bottom: none; }
  .bubble th { background: rgba(0, 100, 200, 0.3); color: #bfe2ff; font-weight: 600; }
  .bubble tr:hover td { background: rgba(0, 140, 240, 0.15); }

  .bubble a {
    color: #4da6ff;
    text-decoration: none;
    border-bottom: 1.5px dashed rgba(77, 166, 255, 0.6);
    transition: all 0.5s ease;
    position: relative;
  }
  .bubble a:hover {
    color: #7ec8ff;
    border-bottom-style: solid;
    text-shadow: 0 0 18px rgba(100, 200, 255, 0.8);
  }

  /* ===== 跟進建議區（永遠顯示，AI 回覆後填入） ===== */
  .followup-section {
    padding: 12px 22px 8px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(8, 14, 26, 0.5);
    border-top: 1px solid rgba(70, 150, 255, 0.15);
    animation: followupSlideIn 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    min-height: 0;
    transition: all 0.5s ease;
  }

  @keyframes followupSlideIn {
    0% {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      filter: blur(8px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  .followup-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: rgba(140, 190, 255, 0.7);
    letter-spacing: 0.5px;
    font-weight: 500;
    padding-left: 4px;
  }

  .followup-title .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00e0ff;
    box-shadow: 0 0 10px rgba(0, 220, 255, 0.9);
    animation: dotPulse 1.8s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.6); opacity: 1; box-shadow: 0 0 18px rgba(0, 220, 255, 1); }
  }

  .followup-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .followup-chip {
    background: rgba(30, 50, 80, 0.7);
    border: 1px solid rgba(80, 180, 255, 0.3);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 0.85rem;
    color: #bfe2ff;
    cursor: pointer;
    transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    position: relative;
    overflow: hidden;
    animation: chipAppear 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    backdrop-filter: blur(10px);
    white-space: nowrap;
    max-width: 100%;
    text-overflow: ellipsis;
  }

  @keyframes chipAppear {
    0% {
      opacity: 0;
      transform: translateY(15px) scale(0.7);
      filter: blur(4px);
    }
    60% {
      opacity: 1;
      transform: translateY(-4px) scale(1.08);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  .followup-chip::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.3), transparent);
    background-size: 200% 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
    animation: chipShine 3s linear infinite;
  }

  @keyframes chipShine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .followup-chip:hover {
    background: rgba(0, 120, 220, 0.5);
    border-color: rgba(0, 220, 255, 0.9);
    color: #ffffff;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 25px -6px rgba(0, 180, 255, 0.5), 0 0 25px rgba(0, 200, 255, 0.3);
  }

  .followup-chip:hover::before { opacity: 1; }

  .followup-chip:active {
    transform: translateY(0) scale(0.94);
    transition: all 0.1s ease;
  }

  /* 空狀態提示 */
  .followup-empty {
    font-size: 0.78rem;
    color: rgba(140, 190, 255, 0.4);
    padding: 8px 4px;
    font-style: italic;
    letter-spacing: 0.3px;
  }

  /* 自動追問開關 */
  .auto-followup {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: rgba(140, 190, 255, 0.7);
    padding-left: 8px;
    cursor: pointer;
    user-select: none;
    transition: color 0.4s ease;
    margin-left: auto;
  }

  .auto-followup:hover { color: rgba(180, 220, 255, 1); }

  .toggle-switch {
    width: 36px;
    height: 20px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 100px;
    position: relative;
    transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    border: 1px solid rgba(80, 160, 255, 0.3);
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a9fff, #4da6ff);
    top: 2px;
    left: 2px;
    transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 0 10px rgba(0, 150, 255, 0.6);
  }

  .auto-followup.on .toggle-switch {
    background: rgba(0, 150, 255, 0.3);
    border-color: #00d0ff;
    box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
  }

  .auto-followup.on .toggle-switch::after {
    left: 18px;
    background: linear-gradient(135deg, #00e0ff, #7ec8ff);
    box-shadow: 0 0 18px rgba(0, 220, 255, 0.9);
  }

  /* ===== 底部輸入 ===== */
  .chat-footer {
    padding: 16px 22px 20px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(8, 14, 26, 0.65);
    backdrop-filter: blur(14px);
    border-top: 1px solid rgba(70, 150, 255, 0.15);
    transition: all 0.6s ease;
    animation: footerSlide 0.9s 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    position: relative;
  }

  @keyframes footerSlide {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .chat-footer input {
    flex: 1;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 100px;
    padding: 16px 24px;
    color: white;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    backdrop-filter: blur(8px);
    position: relative;
  }

  .chat-footer input:focus {
    border-color: #4da6ff;
    box-shadow: 0 0 0 4px rgba(77, 166, 255, 0.15), 0 0 45px rgba(0, 150, 255, 0.3);
    background: rgba(10, 25, 50, 0.9);
    transform: scale(1.01);
    padding-left: 28px;
  }

  .chat-footer input::placeholder {
    color: rgba(170, 210, 255, 0.4);
    transition: all 0.5s ease;
  }

  .chat-footer input:focus::placeholder {
    color: rgba(170, 210, 255, 0.15);
    transform: translateX(8px);
  }

  /* ===== 發送按鈕 ===== */
  .send-btn {
    background: linear-gradient(145deg, #0b6eff, #00a2ff, #00d0ff);
    background-size: 200% 200%;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    color: white;
    position: relative;
    animation: sendBreath 3.5s ease-in-out infinite, sendGradient 5s ease infinite;
  }

  @keyframes sendGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes sendBreath {
    0%, 100% {
      box-shadow: 0 8px 25px rgba(0, 120, 255, 0.5), 0 0 0 0 rgba(0, 180, 255, 0.5);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 12px 35px rgba(0, 150, 255, 0.8), 0 0 0 12px rgba(0, 180, 255, 0.08);
      transform: scale(1.04);
    }
  }

  .send-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7), transparent 70%);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  .send-btn::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: rgba(0, 220, 255, 0.8);
    border-right-color: rgba(0, 220, 255, 0.4);
    opacity: 0;
    transition: opacity 0.5s ease;
    animation: spinRing 2.5s linear infinite;
    pointer-events: none;
  }

  @keyframes spinRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .send-btn span {
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    animation: arrowFloat 2s ease-in-out infinite;
    z-index: 2;
  }

  @keyframes arrowFloat {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3px); }
  }

  .send-btn:hover {
    transform: scale(1.15) translateY(-4px);
    box-shadow: 0 22px 45px rgba(0, 150, 255, 0.8), 0 0 0 15px rgba(0, 170, 255, 0.1), 0 0 60px rgba(0, 200, 255, 0.4);
    animation-play-state: paused, running;
  }

  .send-btn:hover::before { opacity: 1; }
  .send-btn:hover::after { opacity: 1; }
  .send-btn:hover span { transform: translateX(5px) scale(1.15); }

  .send-btn:active {
    transform: scale(0.9) translateY(3px);
    transition: all 0.1s ease;
  }

  .send-btn.flash {
    animation: sendFlash 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes sendFlash {
    0% {
      transform: scale(1.3);
      box-shadow: 0 0 0 0 rgba(0, 220, 255, 0.9), 0 0 70px rgba(0, 200, 255, 1);
      background: linear-gradient(145deg, #00d4ff, #b0e0ff);
    }
    100% {
      transform: scale(1);
      box-shadow: 0 8px 25px rgba(0, 120, 255, 0.5);
      background: linear-gradient(145deg, #0b6eff, #00a2ff, #00d0ff);
    }
  }

  .burst-particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, #00e0ff, transparent);
    pointer-events: none;
    animation: burst 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }

  @keyframes burst {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 220, 255, 0.7), transparent 70%);
    transform: scale(0);
    animation: rippleExpand 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes rippleExpand {
    to { transform: scale(4); opacity: 0; }
  }

  .send-btn:disabled, .save-btn:disabled {
    opacity: 0.45;
    transform: scale(0.96);
    pointer-events: none;
    filter: grayscale(0.5);
    box-shadow: none;
    animation-play-state: paused, paused;
  }

  /* ===== 打字指示器 ===== */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: rgba(35, 55, 85, 0.9);
    border-radius: 40px;
    width: fit-content;
    margin-top: 4px;
    border: 1px solid rgba(80, 160, 255, 0.4);
    transition: all 0.5s ease;
    animation: typingBreath 2s ease-in-out infinite;
    backdrop-filter: blur(10px);
  }

  @keyframes typingBreath {
    0%, 100% {
      border-color: rgba(80, 160, 255, 0.4);
      box-shadow: 0 8px 25px -6px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 150, 255, 0.2);
    }
    50% {
      border-color: rgba(0, 220, 255, 0.8);
      box-shadow: 0 8px 25px -6px rgba(0, 0, 0, 0.7), 0 0 45px rgba(0, 200, 255, 0.5);
    }
  }

  .typing-indicator span {
    width: 10px;
    height: 10px;
    background: linear-gradient(135deg, #7abaff, #00d0ff);
    border-radius: 50%;
    display: inline-block;
    animation: typingBounce 1.6s infinite cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 0 12px rgba(0, 200, 255, 0.6);
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% {
      transform: translateY(0) scale(1);
      opacity: 0.5;
      box-shadow: 0 0 8px rgba(0, 180, 255, 0.3);
    }
    30% {
      transform: translateY(-12px) scale(1.35);
      opacity: 1;
      box-shadow: 0 0 25px rgba(0, 220, 255, 1);
    }
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(40px) scale(0.85);
    background: rgba(20, 35, 60, 0.96);
    backdrop-filter: blur(16px);
    padding: 12px 28px;
    border-radius: 100px;
    color: #bfe2ff;
    font-size: 0.9rem;
    border: 1px solid rgba(0, 180, 255, 0.5);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 150, 255, 0.3);
    opacity: 0;
    transition: all 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none;
    z-index: 1000;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  /* 複製專用 Toast */
  .copy-toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px) scale(0.8);
    background: linear-gradient(135deg, rgba(0, 150, 255, 0.95), rgba(0, 200, 255, 0.95));
    backdrop-filter: blur(16px);
    padding: 10px 24px;
    border-radius: 100px;
    color: #ffffff;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 15px 40px rgba(0, 150, 255, 0.7), 0 0 30px rgba(0, 200, 255, 0.5);
    opacity: 0;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none;
    z-index: 2000;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  /* ===== 響應式 ===== */
  @media (max-width: 520px) {
    .chat-container { height: 94vh; border-radius: 32px; }
    .chat-header { padding: 14px 16px; }
    .message { max-width: 92%; }
    .bubble { padding: 12px 18px; font-size: 0.92rem; border-radius: 24px; }
    .chat-footer { padding: 12px 16px 16px; }
    .chat-footer input { padding: 14px 20px; }
    .send-btn { width: 52px; height: 52px; font-size: 1.6rem; }
    .followup-section { padding: 10px 16px 6px 16px; }
    .followup-chip { font-size: 0.78rem; padding: 6px 12px; }
  }

  .chat-footer input:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: scale(0.99);
  }
</style>
</head>
<body>

<div class="aurora-bg"></div>
<div class="bg-particles" id="bgParticles"></div>

<div class="chat-container" id="chatContainer">
  <div class="chat-header">
    <div class="api-input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API 密钥..." autocomplete="off" spellcheck="false">
    </div>
    <button class="save-btn" id="saveApiBtn">保存密钥</button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="bubble">你好！我是 DeepSeek 助手。请先输入 API 密钥，然后就可以开始对话了 ✨<br><br><span style="color: rgba(180, 220, 255, 0.7); font-size: 0.85em;">💡 提示：点击任意气泡即可复制内容</span></div>
      <div class="time">刚刚</div>
    </div>
  </div>

  <!-- 跟進建議區（永遠顯示） -->
  <div class="followup-section" id="followupSection">
    <div class="followup-title">
      <span class="dot"></span>
      <span>可能想問</span>
      <div class="auto-followup" id="autoFollowup">
        <span class="toggle-switch"></span>
        <span>自動追問</span>
      </div>
    </div>
    <div class="followup-list" id="followupList">
      <span class="followup-empty">AI 回覆後將顯示跟進建議...</span>
    </div>
  </div>

  <div class="chat-footer">
    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn"><span>➤</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="copy-toast" id="copyToast">📋 已複製</div>

<script>
(function() {
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveApiBtn = document.getElementById('saveApiBtn');
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const toastEl = document.getElementById('toast');
  const copyToastEl = document.getElementById('copyToast');
  const bgParticles = document.getElementById('bgParticles');
  const chatContainer = document.getElementById('chatContainer');
  const followupList = document.getElementById('followupList');
  const autoFollowupToggle = document.getElementById('autoFollowup');

  let apiKey = localStorage.getItem('deepseek_api_key') || '';
  let isWaitingForResponse = false;
  let conversationHistory = [];
  let autoFollowupEnabled = false;

  if (apiKey) apiKeyInput.value = apiKey;

  // ===== 卡片 3D 傾斜 =====
  chatContainer.addEventListener('mousemove', (e) => {
    const rect = chatContainer.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    chatContainer.style.transform = `perspective(1500px) rotateY(${x * 2.5}deg) rotateX(${-y * 2.5}deg) translateY(-4px)`;
  });

  chatContainer.addEventListener('mouseleave', () => {
    chatContainer.style.transform = '';
  });

  // ===== 氣泡光暈跟隨滑鼠 =====
  document.addEventListener('mousemove', (e) => {
    const bubble = e.target.closest('.bubble');
    if (bubble) {
      const rect = bubble.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      bubble.style.setProperty('--mx', x + '%');
      bubble.style.setProperty('--my', y + '%');
    }
  });

  // ===== 背景粒子 =====
  function createParticles() {
    for (let i = 0; i < 40; i++) {
      const span = document.createElement('span');
      span.style.left = Math.random() * 100 + '%';
      span.style.bottom = '-20px';
      const size = Math.random() * 5 + 2;
      span.style.width = size + 'px';
      span.style.height = size + 'px';
      span.style.animationDuration = (Math.random() * 18 + 14) + 's';
      span.style.animationDelay = (Math.random() * 20) + 's';
      span.style.opacity = Math.random() * 0.7 + 0.2;
      bgParticles.appendChild(span);
    }
  }
  createParticles();

  // ===== Toast =====
  function showToast(text, duration = 2000) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
    }, duration);
  }

  // ===== 複製 Toast =====
  function showCopyToast() {
    copyToastEl.classList.add('show');
    clearTimeout(window.copyToastTimer);
    window.copyToastTimer = setTimeout(() => {
      copyToastEl.classList.remove('show');
    }, 1500);
  }

  // ===== 複製氣泡內容 =====
  function copyBubbleContent(bubble, e) {
    // 取得純文字內容
    let text = bubble.innerText || bubble.textContent || '';
    text = text.trim();

    if (!text) return;

    // 使用 Clipboard API
    const copyToClipboard = async () => {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {
        // 降級方案
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          document.body.removeChild(textarea);
          return true;
        } catch (e) {
          document.body.removeChild(textarea);
          return false;
        }
      }
    };

    copyToClipboard().then((success) => {
      if (success) {
        // 氣泡脈衝動畫
        bubble.classList.add('copied');
        setTimeout(() => bubble.classList.remove('copied'), 700);

        // 複製漣漪
        if (e) {
          const rect = bubble.getBoundingClientRect();
          const ripple = document.createElement('span');
          ripple.classList.add('copy-ripple');
          const size = Math.max(rect.width, rect.height);
          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
          bubble.appendChild(ripple);
          setTimeout(() => ripple.remove(), 900);
        }

        showCopyToast();
      } else {
        showToast('复制失败，请手动选取', 1800);
      }
    });
  }

  // ===== 保存密鑰 =====
  function saveApiKey() {
    const key = apiKeyInput.value.trim();
    if (!key) { showToast('密钥不能为空', 1800); return; }
    apiKey = key;
    localStorage.setItem('deepseek_api_key', key);
    showToast('✅ API 密钥已保存', 1600);
    saveApiBtn.classList.add('saved');
    setTimeout(() => saveApiBtn.classList.remove('saved'), 800);
  }

  // ===== 漣漪 + 爆炸粒子 =====
  function createRipple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.classList.add('ripple');
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 900);

    for (let i = 0; i < 8; i++) {
      const p = document.createElement('span');
      p.classList.add('burst-particle');
      const angle = (Math.PI * 2 * i) / 8;
      const dist = 40 + Math.random() * 30;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.left = '50%';
      p.style.top = '50%';
      p.style.animationDelay = (i * 0.02) + 's';
      btn.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }

  // ===== 添加消息 =====
  function addMessage(role, content) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', role);

    const bubbleDiv = document.createElement('div');
    bubbleDiv.classList.add('bubble');

    if (role === 'bot') {
      try {
        const rawHtml = marked.parse(content);
        bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
        bubbleDiv.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      } catch (e) {
        bubbleDiv.textContent = content;
      }
    } else {
      bubbleDiv.textContent = content;
    }

    // 點擊複製
    bubbleDiv.addEventListener('click', (e) => {
      e.stopPropagation();
      copyBubbleContent(bubbleDiv, e);
    });

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('time');
    const now = new Date();
    timeDiv.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    messageDiv.appendChild(bubbleDiv);
    messageDiv.appendChild(timeDiv);
    chatMessages.appendChild(messageDiv);

    requestAnimationFrame(() => {
      chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
    });

    return messageDiv;
  }

  // ===== 打字指示器 =====
  function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.classList.add('message', 'bot');
    typingDiv.id = 'typingIndicator';
    const indicatorWrapper = document.createElement('div');
    indicatorWrapper.classList.add('typing-indicator');
    indicatorWrapper.innerHTML = '<span></span><span></span><span></span>';
    typingDiv.appendChild(indicatorWrapper);
    chatMessages.appendChild(typingDiv);
    requestAnimationFrame(() => {
      chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
    });
    return typingDiv;
  }

  function removeTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  // ===== 生成跟進建議 =====
  function generateFollowups(userText, botText) {
    const suggestions = [];
    const lowerBot = (botText || '').toLowerCase();
    const lowerUser = (userText || '').toLowerCase();

    if (botText.includes('```') || lowerBot.includes('code') || botText.includes('代码')) {
      suggestions.push('可以帮我解释一下这段代码吗？');
      suggestions.push('能给我一个更简单的例子吗？');
      suggestions.push('这段代码有什么需要注意的地方？');
    } else if (lowerUser.includes('+') || lowerUser.includes('=') || /[0-9]/.test(userText)) {
      suggestions.push('再给我出一个类似的题目');
      suggestions.push('为什么是这样计算的？');
      suggestions.push('还有其他解法吗？');
    } else if (lowerUser.includes('什麼') || lowerUser.includes('什么') || lowerUser.includes('how')) {
      suggestions.push('可以详细解释一下吗？');
      suggestions.push('能给我举个例子吗？');
      suggestions.push('这有什么实际应用？');
    } else if (userText.length < 8) {
      suggestions.push('可以详细解释一下吗？');
      suggestions.push('能给我举个例子吗？');
      suggestions.push('这有什么实际应用？');
    } else {
      suggestions.push('继续深入讲讲');
      suggestions.push('能举个例子吗？');
      suggestions.push('这和其他概念有什么关系？');
    }

    return suggestions.slice(0, 3);
  }

  // ===== 顯示跟進建議 =====
  function showFollowups(suggestions) {
    followupList.innerHTML = '';

    suggestions.forEach((text, i) => {
      const chip = document.createElement('button');
      chip.classList.add('followup-chip');
      chip.textContent = text;
      chip.style.animationDelay = (i * 0.1) + 's';
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        messageInput.value = text;
        messageInput.focus();
        chip.style.transform = 'scale(0.9)';
        setTimeout(() => chip.style.transform = '', 150);
      });
      followupList.appendChild(chip);
    });

    // 重新觸發動畫
    const section = document.getElementById('followupSection');
    section.style.animation = 'none';
    void section.offsetWidth;
    section.style.animation = '';
  }

  // ===== 重置跟進建議 =====
  function resetFollowups() {
    followupList.innerHTML = '<span class="followup-empty">AI 回覆後將顯示跟進建議...</span>';
  }

  // ===== 調用 API =====
  async function callDeepSeekAPI(userMessage) {
    if (!apiKey) {
      addMessage('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。');
      return null;
    }

    const messages = conversationHistory.slice(-10).concat([
      { role: 'user', content: userMessage }
    ]);

    const url = 'https://api.deepseek.com/v1/chat/completions';
    const requestBody = {
      model: 'deepseek-chat',
      messages: messages,
      temperature: 0.7,
      stream: false
    };

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        const errorMsg = errorData.error?.message || `HTTP ${response.status}`;
        throw new Error(errorMsg);
      }

      const data = await response.json();
      const botReply = data.choices?.[0]?.message?.content;
      if (!botReply) throw new Error('API 返回内容为空');

      conversationHistory.push({ role: 'user', content: userMessage });
      conversationHistory.push({ role: 'assistant', content: botReply });

      return botReply;

    } catch (error) {
      console.error('DeepSeek API 错误:', error);
      let friendlyMsg = '';
      if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
        friendlyMsg = '🌐 网络请求失败。可能原因：① 你用 file:// 打开（需改用本机伺服器）② 网络不通 ③ 浏览器扩充阻挡';
      } else if (error.message.includes('401')) {
        friendlyMsg = '🔑 API 密钥无效或已过期。';
      } else if (error.message.includes('402')) {
        friendlyMsg = '💰 帐户余额不足。';
      } else if (error.message.includes('429')) {
        friendlyMsg = '⏳ 请求太频繁，请稍后再试。';
      } else {
        friendlyMsg = `❌ 请求失败：${error.message || '未知错误'}`;
      }
      return friendlyMsg;
    }
  }

  // ===== 發送消息 =====
  async function sendMessage() {
    if (isWaitingForResponse) { showToast('请等待当前回复完成', 1200); return; }

    const text = messageInput.value.trim();
    if (!text) { showToast('请输入消息内容', 1200); return; }

    sendBtn.classList.add('flash');
    setTimeout(() => sendBtn.classList.remove('flash'), 700);

    messageInput.value = '';
    addMessage('user', text);

    if (!apiKey) {
      addMessage('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
      return;
    }

    isWaitingForResponse = true;
    sendBtn.disabled = true;
    messageInput.disabled = true;
    resetFollowups();

    const typingIndicator = showTypingIndicator();

    try {
      const reply = await callDeepSeekAPI(text);
      removeTypingIndicator();
      if (reply) {
        addMessage('bot', reply);

        // 生成並顯示跟進建議（保證執行）
        const suggestions = generateFollowups(text, reply);
        console.log('生成跟進建議:', suggestions);
        showFollowups(suggestions);

        // 自動追問
        if (autoFollowupEnabled && suggestions.length > 0) {
          setTimeout(() => {
            if (!isWaitingForResponse) {
              messageInput.value = suggestions[0];
              sendMessage();
            }
          }, 1500);
        }
      } else {
        addMessage('bot', '⚠️ 未收到有效回复。');
      }
    } catch (error) {
      removeTypingIndicator();
      addMessage('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
    } finally {
      isWaitingForResponse = false;
      sendBtn.disabled = false;
      messageInput.disabled = false;
      messageInput.focus();
    }
  }

  // ===== 事件綁定 =====
  saveApiBtn.addEventListener('click', saveApiKey);

  sendBtn.addEventListener('click', (e) => {
    createRipple(e);
    sendMessage();
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  apiKeyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveApiKey();
    }
  });

  // 自動追問開關
  autoFollowupToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    autoFollowupEnabled = !autoFollowupEnabled;
    autoFollowupToggle.classList.toggle('on', autoFollowupEnabled);
    showToast(autoFollowupEnabled ? '🤖 自动追问已开启' : '自动追问已关闭', 1500);
  });

  window.addEventListener('load', () => {
    if (apiKey) showToast('已加载保存的 API 密钥', 1500);
    messageInput.focus();
  });

  chatMessages.scrollTop = chatMessages.scrollHeight;
})();
</script>
</body>
