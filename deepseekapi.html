<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DeepSeek 聊天 · 紫耀進化</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }

  :root {
    --purple-deep: #1a0533;
    --purple-dark: #2a0a4a;
    --purple-mid: #4a1a7a;
    --purple-bright: #7b2fbe;
    --purple-glow: #c77dff;
    --purple-neon: #e0aaff;
    --purple-soft: #b892ff;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #0d0118;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    margin: 0;
    position: relative;
  }

  /* ===== 多層紫色極光背景 ===== */
  .aurora-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .aurora-layer {
    position: absolute;
    inset: -50%;
    filter: blur(60px);
    opacity: 0.7;
  }

  .aurora-1 {
    background:
      radial-gradient(circle at 20% 30%, rgba(123, 47, 190, 0.55) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(199, 125, 255, 0.35) 0%, transparent 45%);
    animation: aurora1 22s ease-in-out infinite alternate;
  }

  .aurora-2 {
    background:
      radial-gradient(circle at 70% 20%, rgba(74, 26, 122, 0.6) 0%, transparent 50%),
      radial-gradient(circle at 30% 80%, rgba(224, 170, 255, 0.3) 0%, transparent 50%);
    animation: aurora2 28s ease-in-out infinite alternate;
  }

  .aurora-3 {
    background:
      radial-gradient(circle at 50% 50%, rgba(123, 47, 190, 0.4) 0%, transparent 60%),
      radial-gradient(circle at 15% 85%, rgba(224, 170, 255, 0.25) 0%, transparent 50%);
    animation: aurora3 25s ease-in-out infinite alternate;
  }

  .aurora-4 {
    background:
      radial-gradient(circle at 85% 40%, rgba(199, 125, 255, 0.3) 0%, transparent 45%),
      radial-gradient(circle at 25% 55%, rgba(168, 85, 247, 0.35) 0%, transparent 50%);
    animation: aurora4 32s ease-in-out infinite alternate;
  }

  @keyframes aurora1 {
    0% { transform: translate(0, 0) rotate(0deg) scale(1); }
    100% { transform: translate(10%, -8%) rotate(15deg) scale(1.15); }
  }
  @keyframes aurora2 {
    0% { transform: translate(0, 0) rotate(0deg) scale(1.1); }
    100% { transform: translate(-10%, 8%) rotate(-12deg) scale(1); }
  }
  @keyframes aurora3 {
    0% { transform: translate(-5%, 5%) rotate(-5deg); }
    100% { transform: translate(8%, -6%) rotate(8deg); }
  }
  @keyframes aurora4 {
    0% { transform: translate(5%, 5%) rotate(8deg) scale(1); }
    100% { transform: translate(-8%, -5%) rotate(-10deg) scale(1.1); }
  }

  /* ===== 紫色星塵 ===== */
  .stars-bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #e0aaff, rgba(199, 125, 255, 0.4) 50%, transparent 70%);
    box-shadow: 0 0 10px rgba(199, 125, 255, 0.8), 0 0 20px rgba(123, 47, 190, 0.5);
    animation: starFloat linear infinite, starTwinkle ease-in-out infinite alternate;
    opacity: 0;
  }

  @keyframes starFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-110vh) translateX(50px); opacity: 0; }
  }

  @keyframes starTwinkle {
    0% { filter: brightness(0.7); }
    100% { filter: brightness(1.5); }
  }

  /* ===== 滑鼠光軌 ===== */
  .mouse-trail {
    position: fixed;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224, 170, 255, 0.9), rgba(123, 47, 190, 0.5) 50%, transparent);
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 0 20px rgba(199, 125, 255, 0.8);
    animation: trailFade 1s ease-out forwards;
    transform: translate(-50%, -50%);
  }

  @keyframes trailFade {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
  }

  /* ===== 主卡片 ===== */
  .chat-container {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 780px;
    height: 90vh;
    max-height: 820px;
    background: linear-gradient(135deg, rgba(26, 5, 51, 0.85), rgba(42, 10, 74, 0.75));
    backdrop-filter: blur(32px) saturate(200%);
    -webkit-backdrop-filter: blur(32px) saturate(200%);
    border: 1px solid rgba(199, 125, 255, 0.35);
    border-radius: 44px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.8s ease, border-color 0.8s ease;
    animation:
      cardEntrance 1.4s cubic-bezier(0.2, 0.9, 0.3, 1) both,
      cardFloat 8s ease-in-out infinite alternate,
      cardGlow 5s ease-in-out infinite alternate;
    transform-style: preserve-3d;
    isolation: isolate;
  }

  /* 內部紫色光環 */
  .chat-container::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 44px;
    background: radial-gradient(ellipse at 50% -20%, rgba(199, 125, 255, 0.18), transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  @keyframes cardEntrance {
    0% {
      opacity: 0;
      transform: translateY(60px) scale(0.85) rotateX(15deg);
      filter: blur(15px) hue-rotate(45deg);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotateX(0);
      filter: blur(0) hue-rotate(0);
    }
  }

  @keyframes cardFloat {
    0% { transform: translateY(0px) rotateZ(0deg); }
    100% { transform: translateY(-10px) rotateZ(0.5deg); }
  }

  @keyframes cardGlow {
    0% {
      box-shadow: 
        0 30px 80px -20px rgba(123, 47, 190, 0.6),
        0 0 0 1px rgba(199, 125, 255, 0.2) inset,
        0 0 60px rgba(123, 47, 190, 0.4),
        0 0 100px rgba(199, 125, 255, 0.15);
      border-color: rgba(199, 125, 255, 0.35);
    }
    100% {
      box-shadow: 
        0 40px 100px -20px rgba(123, 47, 190, 0.9),
        0 0 0 1px rgba(224, 170, 255, 0.4) inset,
        0 0 100px rgba(123, 47, 190, 0.7),
        0 0 160px rgba(199, 125, 255, 0.3);
      border-color: rgba(224, 170, 255, 0.6);
    }
  }

  /* 頂部紫色掃描光線 */
  .chat-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #7b2fbe, #e0aaff, #c77dff, #7b2fbe, transparent);
    background-size: 300% 100%;
    animation: topScan 4s linear infinite;
    z-index: 15;
    border-radius: 44px 44px 0 0;
    filter: blur(0.5px);
    box-shadow: 0 0 20px rgba(199, 125, 255, 1), 0 0 40px rgba(123, 47, 190, 0.8);
  }

  @keyframes topScan {
    0% { background-position: 300% 0; }
    100% { background-position: -300% 0; }
  }

  /* ===== 頭部 ===== */
  .chat-header {
    padding: 18px 22px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(26, 5, 51, 0.7), rgba(42, 10, 74, 0.5));
    border-bottom: 1px solid rgba(199, 125, 255, 0.2);
    backdrop-filter: blur(16px);
    position: relative;
    overflow: hidden;
    animation: headerSlide 1s 0.2s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    z-index: 2;
  }

  @keyframes headerSlide {
    0% { opacity: 0; transform: translateY(-50px); filter: blur(10px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .chat-header::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(199, 125, 255, 0.18), transparent);
    animation: headerShine 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes headerShine {
    0%, 100% { left: -100%; }
    50% { left: 100%; }
  }

  /* API 輸入框 */
  .api-input-wrapper {
    flex: 1;
    min-width: 160px;
    display: flex;
    align-items: center;
    background: rgba(13, 1, 24, 0.6);
    border-radius: 100px;
    padding: 2px 2px 2px 20px;
    border: 1px solid rgba(199, 125, 255, 0.3);
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    position: relative;
    animation: fadeSlideUp 1s 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }

  @keyframes fadeSlideUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .api-input-wrapper::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 100px;
    background: linear-gradient(90deg, transparent, rgba(224, 170, 255, 0.7), transparent);
    background-size: 200% 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: -1;
    filter: blur(3px);
  }

  .api-input-wrapper:focus-within::before {
    opacity: 1;
    animation: borderFlow 2.5s linear infinite;
  }

  @keyframes borderFlow {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .api-input-wrapper:focus-within {
    border-color: #c77dff;
    box-shadow: 
      0 0 0 4px rgba(199, 125, 255, 0.18), 
      0 0 50px rgba(123, 47, 190, 0.6),
      inset 0 0 20px rgba(199, 125, 255, 0.1);
    background: rgba(26, 5, 51, 0.9);
    transform: scale(1.02);
  }

  .api-input-wrapper input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f0e5ff;
    font-size: 0.95rem;
    padding: 12px 0;
    min-width: 0;
    transition: color 0.5s ease;
    letter-spacing: 0.3px;
  }

  .api-input-wrapper input::placeholder {
    color: rgba(199, 125, 255, 0.5);
    transition: all 0.5s ease;
  }

  .api-input-wrapper input:focus::placeholder {
    color: rgba(199, 125, 255, 0.2);
    transform: translateX(6px);
  }

  /* ===== 按鈕 ===== */
  button {
    background: none;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* 保存按鈕 — 紫色金屬漸層 */
  .save-btn {
    background: linear-gradient(135deg, #4a1a7a, #7b2fbe, #c77dff);
    background-size: 200% 200%;
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 0.85rem;
    box-shadow: 
      0 6px 20px rgba(123, 47, 190, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.2),
      inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(224, 170, 255, 0.4);
    font-weight: 600;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    animation: 
      fadeSlideUp 1s 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both,
      btnBreath 4s ease-in-out infinite,
      btnGradient 6s ease infinite;
    z-index: 1;
    letter-spacing: 0.3px;
  }

  @keyframes btnGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes btnBreath {
    0%, 100% {
      box-shadow: 
        0 6px 20px rgba(123, 47, 190, 0.6),
        0 0 20px rgba(199, 125, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    50% {
      box-shadow: 
        0 10px 35px rgba(123, 47, 190, 0.9),
        0 0 40px rgba(199, 125, 255, 0.6),
        0 0 80px rgba(224, 170, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
  }

  .save-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), transparent 70%);
    opacity: 0;
    transition: opacity 0.5s ease;
    border-radius: 100px;
  }

  .save-btn::after {
    content: '';
    position: absolute;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    top: 0;
    left: -80%;
    transform: skewX(-20deg);
    transition: left 1s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  .save-btn:hover {
    transform: translateY(-4px) scale(1.07);
    box-shadow: 
      0 20px 45px rgba(123, 47, 190, 0.9),
      0 0 60px rgba(199, 125, 255, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  .save-btn:hover::before { opacity: 1; }
  .save-btn:hover::after { left: 140%; }

  .save-btn:active {
    transform: translateY(2px) scale(0.92);
    transition: all 0.1s ease;
    animation-play-state: paused;
  }

  .save-btn.saved {
    animation: savePulse 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes savePulse {
    0% { transform: scale(1); }
    50% { 
      transform: scale(1.18); 
      box-shadow: 
        0 0 0 20px rgba(199, 125, 255, 0.3), 
        0 0 60px rgba(224, 170, 255, 1),
        0 0 100px rgba(199, 125, 255, 0.8);
    }
    100% { transform: scale(1); }
  }

  /* ===== 消息區域 ===== */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px 16px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
    background: 
      radial-gradient(ellipse at 30% 10%, rgba(74, 26, 122, 0.35), transparent 60%),
      radial-gradient(ellipse at 70% 90%, rgba(123, 47, 190, 0.2), transparent 60%);
    transition: background 1s ease;
    animation: fadeIn 1.4s 0.4s both;
    position: relative;
    z-index: 2;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .chat-messages::-webkit-scrollbar { width: 8px; }
  .chat-messages::-webkit-scrollbar-track { background: rgba(123, 47, 190, 0.05); border-radius: 20px; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(123, 47, 190, 0.7), rgba(199, 125, 255, 0.9));
    border-radius: 20px;
    transition: all 0.4s ease;
    box-shadow: 0 0 10px rgba(199, 125, 255, 0.5);
  }
  .chat-messages::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(199, 125, 255, 1), rgba(224, 170, 255, 1));
    box-shadow: 0 0 20px rgba(224, 170, 255, 0.9);
  }

  /* ===== 訊息氣泡 ===== */
  .message {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    opacity: 0;
    animation: messageAppear 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    position: relative;
  }

  @keyframes messageAppear {
    0% {
      opacity: 0;
      transform: translateY(40px) scale(0.8) rotateZ(4deg);
      filter: blur(12px);
    }
    40% {
      opacity: 1;
      transform: translateY(-10px) scale(1.05) rotateZ(-1.5deg);
      filter: blur(0);
    }
    60% {
      transform: translateY(5px) scale(0.98) rotateZ(1deg);
    }
    80% {
      transform: translateY(-2px) scale(1.01) rotateZ(-0.3deg);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotateZ(0);
    }
  }

  .message.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .message.bot {
    align-self: flex-start;
    align-items: flex-start;
  }

  /* 訊息光暈擴散 */
  .message::before {
    content: '';
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(199, 125, 255, 0.15), transparent 60%);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    z-index: -1;
    filter: blur(20px);
  }

  .message:hover::before {
    opacity: 1;
    animation: auraPulse 2s ease-in-out infinite;
  }

  @keyframes auraPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 1; }
  }

  /* 氣泡本體 */
  .bubble {
    padding: 14px 22px;
    border-radius: 28px;
    font-size: 0.98rem;
    line-height: 1.65;
    word-break: break-word;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
    animation: bubbleBreath 5s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
  }

  .bubble:active {
    transform: scale(0.97);
    transition: all 0.1s ease;
  }

  @keyframes bubbleBreath {
    0%, 100% {
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.7), 0 0 0 0 rgba(199, 125, 255, 0);
    }
    50% {
      box-shadow: 
        0 18px 40px -8px rgba(0, 0, 0, 0.8), 
        0 0 40px rgba(123, 47, 190, 0.3);
    }
  }

  .bubble.copied {
    animation: copyPulse 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes copyPulse {
    0% { transform: scale(1); }
    30% { 
      transform: scale(1.08); 
      box-shadow: 
        0 0 0 12px rgba(199, 125, 255, 0.5), 
        0 0 60px rgba(224, 170, 255, 1),
        0 0 100px rgba(199, 125, 255, 0.7);
    }
    100% { transform: scale(1); }
  }

  /* 複製漣漪 */
  .copy-ripple {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224, 170, 255, 0.8), rgba(123, 47, 190, 0.4) 50%, transparent 70%);
    transform: scale(0);
    animation: copyRippleExpand 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes copyRippleExpand {
    to { transform: scale(6); opacity: 0; }
  }

  /* 光暈跟隨滑鼠 */
  .bubble::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(224, 170, 255, 0.25), transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .bubble:hover::before {
    opacity: 1;
  }

  /* 高光掃過 */
  .bubble::after {
    content: '';
    position: absolute;
    top: 0;
    left: -150%;
    width: 80%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(224, 170, 255, 0.25), transparent);
    transform: skewX(-25deg);
    transition: left 1.2s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none;
  }

  .bubble:hover::after {
    left: 150%;
  }

  /* 用戶氣泡 — 紫色金屬 */
  .message.user .bubble {
    background: linear-gradient(135deg, #4a1a7a, #7b2fbe, #a855f7);
    background-size: 200% 200%;
    animation: userGradient 5s ease-in-out infinite, bubbleBreath 5s ease-in-out infinite;
    color: #ffffff;
    border: 1px solid rgba(224, 170, 255, 0.45);
    box-shadow: 
      0 14px 32px -8px rgba(123, 47, 190, 0.7), 
      0 0 30px rgba(199, 125, 255, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  @keyframes userGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .message.user .bubble:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 
      0 24px 50px -8px rgba(123, 47, 190, 1), 
      0 0 60px rgba(199, 125, 255, 0.6);
  }

  /* 機器人氣泡 — 深紫玻璃 */
  .message.bot .bubble {
    background: rgba(42, 10, 74, 0.88);
    color: #f0e5ff;
    border: 1px solid rgba(199, 125, 255, 0.35);
    box-shadow: 
      0 14px 32px -8px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(224, 170, 255, 0.15);
    animation: botBorderPulse 4s ease-in-out infinite;
  }

  @keyframes botBorderPulse {
    0%, 100% {
      border-color: rgba(199, 125, 255, 0.35);
    }
    50% {
      border-color: rgba(224, 170, 255, 0.8);
      box-shadow: 
        0 14px 32px -8px rgba(0, 0, 0, 0.8), 
        0 0 45px rgba(123, 47, 190, 0.5);
    }
  }

  .message.bot .bubble:hover {
    background: rgba(52, 15, 90, 0.95);
    transform: translateY(-4px) scale(1.02);
    border-color: rgba(224, 170, 255, 1);
  }

  /* 時間戳 */
  .message .time {
    font-size: 0.7rem;
    color: rgba(199, 125, 255, 0.6);
    margin-top: 8px;
    margin-left: 10px;
    margin-right: 10px;
    transition: all 0.5s ease;
    animation: timeFadeIn 1s 0.3s both;
    letter-spacing: 0.3px;
  }

  @keyframes timeFadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message:hover .time {
    color: rgba(224, 170, 255, 1);
    transform: translateX(4px);
    text-shadow: 0 0 10px rgba(224, 170, 255, 0.6);
  }

  /* 光標閃爍 */
  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 1.1em;
    background: linear-gradient(180deg, #c77dff, #e0aaff);
    vertical-align: middle;
    margin-left: 2px;
    border-radius: 2px;
    animation: cursorBlink 0.9s steps(2) infinite;
    box-shadow: 0 0 10px rgba(224, 170, 255, 1);
  }

  @keyframes cursorBlink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* ===== Markdown 樣式 ===== */
  .bubble p { margin: 0 0 8px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { 
    color: #e0aaff; 
    font-weight: 700; 
    text-shadow: 0 0 12px rgba(224, 170, 255, 0.5);
  }
  .bubble em { color: #c77dff; font-style: italic; }
  .bubble h1, .bubble h2, .bubble h3 {
    margin: 12px 0 8px;
    font-weight: 600;
    transition: all 0.5s ease;
    background: linear-gradient(90deg, #c77dff, #e0aaff, #c77dff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleGradient 4s linear infinite;
  }
  @keyframes titleGradient {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  .bubble h1:hover, .bubble h2:hover, .bubble h3:hover {
    transform: translateX(6px);
    filter: drop-shadow(0 0 15px rgba(224, 170, 255, 0.8));
  }
  .bubble h1 { font-size: 1.15rem; }
  .bubble h2 { font-size: 1.05rem; }
  .bubble h3 { font-size: 1rem; }

  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 24px; }
  .bubble li { margin: 5px 0; transition: all 0.4s ease; }
  .bubble li:hover { 
    transform: translateX(6px); 
    color: #e0aaff;
    text-shadow: 0 0 10px rgba(224, 170, 255, 0.4);
  }

  .bubble code:not(pre code) {
    background: rgba(123, 47, 190, 0.4);
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.88em;
    color: #e0aaff;
    transition: all 0.5s ease;
    display: inline-block;
    border: 1px solid rgba(199, 125, 255, 0.3);
  }
  .bubble code:not(pre code):hover {
    background: rgba(199, 125, 255, 0.5);
    transform: scale(1.1) rotate(-2deg);
    box-shadow: 0 0 20px rgba(224, 170, 255, 0.7);
  }

  .bubble pre {
    background: rgba(13, 1, 24, 0.75) !important;
    border: 1px solid rgba(199, 125, 255, 0.4);
    border-radius: 18px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 12px 0;
    font-size: 0.85rem;
    transition: all 0.6s ease;
    position: relative;
  }
  .bubble pre:hover {
    border-color: rgba(224, 170, 255, 0.9);
    box-shadow: 
      0 0 50px rgba(123, 47, 190, 0.6), 
      0 0 0 1px rgba(224, 170, 255, 0.5) inset;
    transform: translateY(-3px);
  }
  .bubble pre code {
    background: transparent !important;
    padding: 0;
    font-family: 'Consolas', 'Monaco', monospace;
    color: #f0e5ff;
  }

  .bubble blockquote {
    border-left: 4px solid #c77dff;
    padding-left: 14px;
    margin: 10px 0;
    color: #d0b8ff;
    font-style: italic;
    transition: all 0.5s ease;
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.1), transparent);
    border-radius: 4px;
  }
  .bubble blockquote:hover {
    border-left-color: #e0aaff;
    padding-left: 22px;
    color: #f0e5ff;
    text-shadow: 0 0 15px rgba(224, 170, 255, 0.5);
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.25), transparent);
  }

  .bubble table {
    border-collapse: separate;
    border-spacing: 0;
    margin: 10px 0;
    font-size: 0.9rem;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(199, 125, 255, 0.4);
    transition: all 0.5s ease;
  }
  .bubble table:hover {
    border-color: rgba(224, 170, 255, 0.8);
    box-shadow: 0 0 40px rgba(123, 47, 190, 0.5);
  }
  .bubble th, .bubble td {
    border: none;
    border-bottom: 1px solid rgba(199, 125, 255, 0.2);
    border-right: 1px solid rgba(199, 125, 255, 0.2);
    padding: 8px 12px;
    transition: background 0.4s ease;
  }
  .bubble th:last-child, .bubble td:last-child { border-right: none; }
  .bubble tr:last-child td { border-bottom: none; }
  .bubble th { 
    background: rgba(123, 47, 190, 0.4); 
    color: #e0aaff; 
    font-weight: 600; 
  }
  .bubble tr:hover td { background: rgba(199, 125, 255, 0.15); }

  .bubble a {
    color: #c77dff;
    text-decoration: none;
    border-bottom: 1.5px dashed rgba(199, 125, 255, 0.6);
    transition: all 0.5s ease;
    position: relative;
  }
  .bubble a:hover {
    color: #e0aaff;
    border-bottom-style: solid;
    text-shadow: 0 0 20px rgba(224, 170, 255, 0.9);
  }

  /* ===== 跟進建議區 ===== */
  .followup-section {
    padding: 12px 22px 8px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: linear-gradient(180deg, transparent, rgba(26, 5, 51, 0.5));
    border-top: 1px solid rgba(199, 125, 255, 0.2);
    animation: followupSlideIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    transition: all 0.5s ease;
    position: relative;
    z-index: 2;
  }

  @keyframes followupSlideIn {
    0% {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      filter: blur(8px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  .followup-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: rgba(199, 125, 255, 0.8);
    letter-spacing: 0.5px;
    font-weight: 500;
    padding-left: 4px;
  }

  .followup-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, #e0aaff, #7b2fbe);
    box-shadow: 0 0 12px rgba(224, 170, 255, 1), 0 0 24px rgba(123, 47, 190, 0.7);
    animation: dotPulse 1.8s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.8); opacity: 1; box-shadow: 0 0 25px rgba(224, 170, 255, 1); }
  }

  .followup-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .followup-chip {
    background: linear-gradient(135deg, rgba(74, 26, 122, 0.7), rgba(42, 10, 74, 0.7));
    border: 1px solid rgba(199, 125, 255, 0.4);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 0.85rem;
    color: #e0c8ff;
    cursor: pointer;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    position: relative;
    overflow: hidden;
    animation: chipAppear 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    backdrop-filter: blur(12px);
    white-space: nowrap;
    max-width: 100%;
    text-overflow: ellipsis;
    font-weight: 500;
    transform-style: preserve-3d;
  }

  @keyframes chipAppear {
    0% {
      opacity: 0;
      transform: translateY(25px) scale(0.5) rotateX(90deg);
      filter: blur(8px);
    }
    60% {
      opacity: 1;
      transform: translateY(-6px) scale(1.1) rotateX(-10deg);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotateX(0);
      filter: blur(0);
    }
  }

  .followup-chip::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(224, 170, 255, 0.4), transparent);
    background-size: 200% 100%;
    opacity: 0;
    transition: opacity 0.5s ease;
    animation: chipShine 3s linear infinite;
  }

  @keyframes chipShine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .followup-chip:hover {
    background: linear-gradient(135deg, rgba(123, 47, 190, 0.8), rgba(74, 26, 122, 0.9));
    border-color: rgba(224, 170, 255, 1);
    color: #ffffff;
    transform: translateY(-5px) scale(1.08) rotateX(8deg);
    box-shadow: 
      0 18px 35px -6px rgba(123, 47, 190, 0.9), 
      0 0 35px rgba(199, 125, 255, 0.6),
      0 0 60px rgba(224, 170, 255, 0.3);
    text-shadow: 0 0 10px rgba(224, 170, 255, 0.7);
  }

  .followup-chip:hover::before { opacity: 1; }

  .followup-chip:active {
    transform: translateY(0) scale(0.94) rotateX(0);
    transition: all 0.1s ease;
  }

  .followup-empty {
    font-size: 0.78rem;
    color: rgba(199, 125, 255, 0.4);
    padding: 8px 4px;
    font-style: italic;
    letter-spacing: 0.3px;
  }

  /* 自動追問開關 */
  .auto-followup {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: rgba(199, 125, 255, 0.8);
    padding-left: 8px;
    cursor: pointer;
    user-select: none;
    transition: color 0.4s ease;
    margin-left: auto;
  }

  .auto-followup:hover { color: rgba(224, 170, 255, 1); }

  .toggle-switch {
    width: 38px;
    height: 22px;
    background: rgba(13, 1, 24, 0.6);
    border-radius: 100px;
    position: relative;
    transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    border: 1px solid rgba(199, 125, 255, 0.4);
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7b2fbe, #c77dff);
    top: 2px;
    left: 2px;
    transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 0 12px rgba(199, 125, 255, 0.8);
  }

  .auto-followup.on .toggle-switch {
    background: rgba(123, 47, 190, 0.4);
    border-color: #c77dff;
    box-shadow: 0 0 20px rgba(199, 125, 255, 0.7);
  }

  .auto-followup.on .toggle-switch::after {
    left: 18px;
    background: linear-gradient(135deg, #e0aaff, #c77dff);
    box-shadow: 0 0 20px rgba(224, 170, 255, 1);
  }

  /* ===== 底部輸入 ===== */
  .chat-footer {
    padding: 16px 22px 20px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(26, 5, 51, 0.7), rgba(42, 10, 74, 0.5));
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(199, 125, 255, 0.2);
    transition: all 0.6s ease;
    animation: footerSlide 1s 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    position: relative;
    z-index: 2;
  }

  @keyframes footerSlide {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .chat-footer input {
    flex: 1;
    background: rgba(13, 1, 24, 0.6);
    border: 1px solid rgba(199, 125, 255, 0.3);
    border-radius: 100px;
    padding: 16px 24px;
    color: #f0e5ff;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    backdrop-filter: blur(10px);
    position: relative;
    letter-spacing: 0.3px;
  }

  .chat-footer input:focus {
    border-color: #c77dff;
    box-shadow: 
      0 0 0 4px rgba(199, 125, 255, 0.18), 
      0 0 60px rgba(123, 47, 190, 0.5),
      inset 0 0 25px rgba(199, 125, 255, 0.1);
    background: rgba(26, 5, 51, 0.9);
    transform: scale(1.012);
    padding-left: 28px;
  }

  .chat-footer input::placeholder {
    color: rgba(199, 125, 255, 0.5);
    transition: all 0.5s ease;
  }

  .chat-footer input:focus::placeholder {
    color: rgba(199, 125, 255, 0.2);
    transform: translateX(8px);
  }

  /* ===== 發送按鈕 — 紫色能量球 ===== */
  .send-btn {
    background: linear-gradient(145deg, #4a1a7a, #7b2fbe, #c77dff, #7b2fbe);
    background-size: 300% 300%;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    border: 1px solid rgba(224, 170, 255, 0.5);
    flex-shrink: 0;
    color: white;
    position: relative;
    animation: 
      sendBreath 4s ease-in-out infinite, 
      sendGradient 6s ease infinite;
    box-shadow: 
      0 10px 30px rgba(123, 47, 190, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  @keyframes sendGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes sendBreath {
    0%, 100% {
      box-shadow: 
        0 10px 30px rgba(123, 47, 190, 0.7), 
        0 0 0 0 rgba(199, 125, 255, 0.5),
        0 0 40px rgba(123, 47, 190, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transform: scale(1);
    }
    50% {
      box-shadow: 
        0 16px 45px rgba(123, 47, 190, 1), 
        0 0 0 15px rgba(199, 125, 255, 0.1),
        0 0 80px rgba(199, 125, 255, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }
  }

  .send-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7), transparent 70%);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  .send-btn::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: rgba(224, 170, 255, 0.9);
    border-right-color: rgba(199, 125, 255, 0.5);
    opacity: 0;
    transition: opacity 0.5s ease;
    animation: spinRing 2.5s linear infinite;
    pointer-events: none;
  }

  @keyframes spinRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .send-btn span {
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    animation: arrowFloat 2s ease-in-out infinite;
    z-index: 2;
    filter: drop-shadow(0 0 5px rgba(224, 170, 255, 0.8));
  }

  @keyframes arrowFloat {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(4px); }
  }

  .send-btn:hover {
    transform: scale(1.18) translateY(-5px);
    box-shadow: 
      0 25px 55px rgba(123, 47, 190, 1), 
      0 0 0 18px rgba(199, 125, 255, 0.12), 
      0 0 100px rgba(224, 170, 255, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
    animation-play-state: paused, running;
  }

  .send-btn:hover::before { opacity: 1; }
  .send-btn:hover::after { opacity: 1; }
  .send-btn:hover span { transform: translateX(6px) scale(1.2); }

  .send-btn:active {
    transform: scale(0.88) translateY(4px);
    transition: all 0.1s ease;
  }

  .send-btn.flash {
    animation: sendFlash 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes sendFlash {
    0% {
      transform: scale(1.35);
      box-shadow: 
        0 0 0 0 rgba(224, 170, 255, 1), 
        0 0 100px rgba(224, 170, 255, 1);
      background: linear-gradient(145deg, #c77dff, #e0aaff);
    }
    100% {
      transform: scale(1);
      box-shadow: 0 10px 30px rgba(123, 47, 190, 0.7);
      background: linear-gradient(145deg, #4a1a7a, #7b2fbe, #c77dff);
    }
  }

  .burst-particle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #e0aaff, transparent);
    pointer-events: none;
    animation: burst 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    box-shadow: 0 0 15px rgba(224, 170, 255, 0.9);
  }

  @keyframes burst {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224, 170, 255, 0.8), transparent 70%);
    transform: scale(0);
    animation: rippleExpand 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes rippleExpand {
    to { transform: scale(5); opacity: 0; }
  }

  .send-btn:disabled, .save-btn:disabled {
    opacity: 0.45;
    transform: scale(0.96);
    pointer-events: none;
    filter: grayscale(0.5);
    box-shadow: none;
    animation-play-state: paused, paused;
  }

  /* ===== 打字指示器 ===== */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: linear-gradient(135deg, rgba(74, 26, 122, 0.9), rgba(42, 10, 74, 0.9));
    border-radius: 40px;
    width: fit-content;
    margin-top: 4px;
    border: 1px solid rgba(199, 125, 255, 0.5);
    transition: all 0.5s ease;
    animation: typingBreath 2s ease-in-out infinite;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px -6px rgba(0, 0, 0, 0.8);
  }

  @keyframes typingBreath {
    0%, 100% {
      border-color: rgba(199, 125, 255, 0.5);
      box-shadow: 
        0 10px 30px -6px rgba(0, 0, 0, 0.8), 
        0 0 30px rgba(123, 47, 190, 0.4);
    }
    50% {
      border-color: rgba(224, 170, 255, 0.9);
      box-shadow: 
        0 10px 30px -6px rgba(0, 0, 0, 0.8), 
        0 0 60px rgba(199, 125, 255, 0.7);
    }
  }

  .typing-indicator span {
    width: 10px;
    height: 10px;
    background: radial-gradient(circle at 30% 30%, #e0aaff, #7b2fbe);
    border-radius: 50%;
    display: inline-block;
    animation: typingBounce 1.6s infinite cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 0 15px rgba(224, 170, 255, 0.8);
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% {
      transform: translateY(0) scale(1);
      opacity: 0.5;
      box-shadow: 0 0 10px rgba(199, 125, 255, 0.4);
    }
    30% {
      transform: translateY(-14px) scale(1.5);
      opacity: 1;
      box-shadow: 0 0 30px rgba(224, 170, 255, 1);
    }
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(40px) scale(0.85);
    background: linear-gradient(135deg, rgba(74, 26, 122, 0.98), rgba(42, 10, 74, 0.98));
    backdrop-filter: blur(16px);
    padding: 12px 28px;
    border-radius: 100px;
    color: #e0c8ff;
    font-size: 0.9rem;
    border: 1px solid rgba(199, 125, 255, 0.6);
    box-shadow: 
      0 15px 45px rgba(0, 0, 0, 0.7), 
      0 0 40px rgba(123, 47, 190, 0.6);
    opacity: 0;
    transition: all 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none;
    z-index: 1000;
    white-space: nowrap;
    font-weight: 500;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  .copy-toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px) scale(0.8);
    background: linear-gradient(135deg, rgba(123, 47, 190, 0.98), rgba(199, 125, 255, 0.98));
    backdrop-filter: blur(16px);
    padding: 12px 28px;
    border-radius: 100px;
    color: #ffffff;
    font-size: 0.88rem;
    font-weight: 600;
    border: 1px solid rgba(224, 170, 255, 0.6);
    box-shadow: 
      0 20px 50px rgba(123, 47, 190, 0.9), 
      0 0 50px rgba(199, 125, 255, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    opacity: 0;
    transition: all 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none;
    z-index: 2000;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: copyToastGlow 2s ease-in-out infinite;
  }

  @keyframes copyToastGlow {
    0%, 100% {
      box-shadow: 
        0 20px 50px rgba(123, 47, 190, 0.9), 
        0 0 50px rgba(199, 125, 255, 0.7);
    }
    50% {
      box-shadow: 
        0 20px 50px rgba(123, 47, 190, 1), 
        0 0 80px rgba(224, 170, 255, 1);
    }
  }

  .copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  /* ===== 響應式 ===== */
  @media (max-width: 520px) {
    .chat-container { height: 94vh; border-radius: 32px; }
    .chat-header { padding: 14px 16px; }
    .message { max-width: 92%; }
    .bubble { padding: 12px 18px; font-size: 0.92rem; border-radius: 24px; }
    .chat-footer { padding: 12px 16px 16px; }
    .chat-footer input { padding: 14px 20px; }
    .send-btn { width: 52px; height: 52px; font-size: 1.6rem; }
    .followup-section { padding: 10px 16px 6px 16px; }
    .followup-chip { font-size: 0.78rem; padding: 6px 12px; }
  }

  .chat-footer input:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: scale(0.99);
  }
</style>
</head>
<body>

<!-- 極光多層背景 -->
<div class="aurora-bg">
  <div class="aurora-layer aurora-1"></div>
  <div class="aurora-layer aurora-2"></div>
  <div class="aurora-layer aurora-3"></div>
  <div class="aurora-layer aurora-4"></div>
</div>

<!-- 紫色星塵 -->
<div class="stars-bg" id="starsBg"></div>

<div class="chat-container" id="chatContainer">
  <div class="chat-header">
    <div class="api-input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API 密钥..." autocomplete="off" spellcheck="false">
    </div>
    <button class="save-btn" id="saveApiBtn">保存密钥</button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="bubble">你好！我是 DeepSeek 助手 ✨<br><br>请先输入 API 密钥，然后就可以开始对话了。<br><br><span style="color: rgba(224, 170, 255, 0.7); font-size: 0.85em;">💡 点击任意气泡即可复制内容</span></div>
      <div class="time">刚刚</div>
    </div>
  </div>

  <div class="followup-section" id="followupSection">
    <div class="followup-title">
      <span class="dot"></span>
      <span>可能想問</span>
      <div class="auto-followup" id="autoFollowup">
        <span class="toggle-switch"></span>
        <span>自動追問</span>
      </div>
    </div>
    <div class="followup-list" id="followupList">
      <span class="followup-empty">AI 回覆後將顯示跟進建議...</span>
    </div>
  </div>

  <div class="chat-footer">
    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn"><span>➤</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="copy-toast" id="copyToast">✨ 已複製到剪貼板</div>

<script>
(function() {
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveApiBtn = document.getElementById('saveApiBtn');
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const toastEl = document.getElementById('toast');
  const copyToastEl = document.getElementById('copyToast');
  const starsBg = document.getElementById('starsBg');
  const chatContainer = document.getElementById('chatContainer');
  const followupList = document.getElementById('followupList');
  const autoFollowupToggle = document.getElementById('autoFollowup');

  let apiKey = localStorage.getItem('deepseek_api_key') || '';
  let isWaitingForResponse = false;
  let conversationHistory = [];
  let autoFollowupEnabled = false;

  if (apiKey) apiKeyInput.value = apiKey;

  // ===== 卡片 3D 傾斜 =====
  chatContainer.addEventListener('mousemove', (e) => {
    const rect = chatContainer.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    chatContainer.style.transform = `perspective(1500px) rotateY(${x * 3}deg) rotateX(${-y * 3}deg) translateY(-4px)`;
  });

  chatContainer.addEventListener('mouseleave', () => {
    chatContainer.style.transform = '';
  });

  // ===== 氣泡光暈跟隨滑鼠 =====
  document.addEventListener('mousemove', (e) => {
    const bubble = e.target.closest('.bubble');
    if (bubble) {
      const rect = bubble.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      bubble.style.setProperty('--mx', x + '%');
      bubble.style.setProperty('--my', y + '%');
    }
  });

  // ===== 滑鼠光軌 =====
  let lastTrailTime = 0;
  document.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if (now - lastTrailTime < 40) return;
    lastTrailTime = now;

    const trail = document.createElement('div');
    trail.className = 'mouse-trail';
    trail.style.left = e.clientX + 'px';
    trail.style.top = e.clientY + 'px';
    const size = 8 + Math.random() * 8;
    trail.style.width = size + 'px';
    trail.style.height = size + 'px';
    document.body.appendChild(trail);
    setTimeout(() => trail.remove(), 1000);
  });

  // ===== 星塵背景 =====
  function createStars() {
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.bottom = '-20px';
      const size = Math.random() * 4 + 1.5;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.animationDuration = (Math.random() * 20 + 15) + 's, ' + (Math.random() * 2 + 1.5) + 's';
      star.style.animationDelay = (Math.random() * 20) + 's, ' + (Math.random() * 2) + 's';
      starsBg.appendChild(star);
    }
  }
  createStars();

  // ===== Toast =====
  function showToast(text, duration = 2000) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
    }, duration);
  }

  function showCopyToast() {
    copyToastEl.classList.add('show');
    clearTimeout(window.copyToastTimer);
    window.copyToastTimer = setTimeout(() => {
      copyToastEl.classList.remove('show');
    }, 1800);
  }

  // ===== 複製氣泡 =====
  function copyBubbleContent(bubble, e) {
    let text = bubble.innerText || bubble.textContent || '';
    text = text.trim();
    if (!text) return;

    const copyToClipboard = async () => {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          document.body.removeChild(textarea);
          return true;
        } catch (e) {
          document.body.removeChild(textarea);
          return false;
        }
      }
    };

    copyToClipboard().then((success) => {
      if (success) {
        bubble.classList.add('copied');
        setTimeout(() => bubble.classList.remove('copied'), 900);

        if (e) {
          const rect = bubble.getBoundingClientRect();
          const ripple = document.createElement('span');
          ripple.classList.add('copy-ripple');
          const size = Math.max(rect.width, rect.height);
          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
          bubble.appendChild(ripple);
          setTimeout(() => ripple.remove(), 1200);
        }

        showCopyToast();
      } else {
        showToast('复制失败，请手动选取', 1800);
      }
    });
  }

  // ===== 保存密鑰 =====
  function saveApiKey() {
    const key = apiKeyInput.value.trim();
    if (!key) { showToast('密钥不能为空', 1800); return; }
    apiKey = key;
    localStorage.setItem('deepseek_api_key', key);
    showToast('✅ API 密钥已保存', 1600);
    saveApiBtn.classList.add('saved');
    setTimeout(() => saveApiBtn.classList.remove('saved'), 900);
  }

  // ===== 漣漪 + 爆炸 =====
  function createRipple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.classList.add('ripple');
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 1000);

    for (let i = 0; i < 12; i++) {
      const p = document.createElement('span');
      p.classList.add('burst-particle');
      const angle = (Math.PI * 2 * i) / 12;
      const dist = 50 + Math.random() * 40;
      p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      p.style.left = '50%';
      p.style.top = '50%';
      p.style.animationDelay = (i * 0.02) + 's';
      btn.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  // ===== 添加消息 =====
  function addMessage(role, content) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', role);

    const bubbleDiv = document.createElement('div');
    bubbleDiv.classList.add('bubble');

    if (role === 'bot') {
      try {
        const rawHtml = marked.parse(content);
        bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
        bubbleDiv.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      } catch (e) {
        bubbleDiv.textContent = content;
      }
    } else {
      bubbleDiv.textContent = content;
    }

    bubbleDiv.addEventListener('click', (e) => {
      e.stopPropagation();
      copyBubbleContent(bubbleDiv, e);
    });

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('time');
    const now = new Date();
    timeDiv.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    messageDiv.appendChild(bubbleDiv);
    messageDiv.appendChild(timeDiv);
    chatMessages.appendChild(messageDiv);

    requestAnimationFrame(() => {
      chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
    });

    return messageDiv;
  }

  // ===== 打字指示器 =====
  function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.classList.add('message', 'bot');
    typingDiv.id = 'typingIndicator';
    const indicatorWrapper = document.createElement('div');
    indicatorWrapper.classList.add('typing-indicator');
    indicatorWrapper.innerHTML = '<span></span><span></span><span></span>';
    typingDiv.appendChild(indicatorWrapper);
    chatMessages.appendChild(typingDiv);
    requestAnimationFrame(() => {
      chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
    });
    return typingDiv;
  }

  function removeTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  // ===== 生成跟進建議 =====
  function generateFollowups(userText, botText) {
    const suggestions = [];
    const lowerBot = (botText || '').toLowerCase();
    const lowerUser = (userText || '').toLowerCase();

    if (botText.includes('```') || lowerBot.includes('code') || botText.includes('代码')) {
      suggestions.push('可以帮我解释一下这段代码吗？');
      suggestions.push('能给我一个更简单的例子吗？');
      suggestions.push('这段代码有什么需要注意的地方？');
    } else if (lowerUser.includes('+') || lowerUser.includes('=') || /[0-9]/.test(userText)) {
      suggestions.push('再给我出一个类似的题目');
      suggestions.push('为什么是这样计算的？');
      suggestions.push('还有其他解法吗？');
    } else if (lowerUser.includes('什麼') || lowerUser.includes('什么') || lowerUser.includes('how')) {
      suggestions.push('可以详细解释一下吗？');
      suggestions.push('能给我举个例子吗？');
      suggestions.push('这有什么实际应用？');
    } else if (userText.length < 8) {
      suggestions.push('可以详细解释一下吗？');
      suggestions.push('能给我举个例子吗？');
      suggestions.push('这有什么实际应用？');
    } else {
      suggestions.push('继续深入讲讲');
      suggestions.push('能举个例子吗？');
      suggestions.push('这和其他概念有什么关系？');
    }

    return suggestions.slice(0, 3);
  }

  // ===== 顯示跟進建議 =====
  function showFollowups(suggestions) {
    followupList.innerHTML = '';

    suggestions.forEach((text, i) => {
      const chip = document.createElement('button');
      chip.classList.add('followup-chip');
      chip.textContent = text;
      chip.style.animationDelay = (i * 0.12) + 's';
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        messageInput.value = text;
        messageInput.focus();
        chip.style.transform = 'scale(0.9) rotateX(20deg)';
        setTimeout(() => chip.style.transform = '', 200);
      });
      followupList.appendChild(chip);
    });

    const section = document.getElementById('followupSection');
    section.style.animation = 'none';
    void section.offsetWidth;
    section.style.animation = '';
  }

  function resetFollowups() {
    followupList.innerHTML = '<span class="followup-empty">AI 回覆後將顯示跟進建議...</span>';
  }

  // ===== 調用 API =====
  async function callDeepSeekAPI(userMessage) {
    if (!apiKey) {
      addMessage('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。');
      return null;
    }

    const messages = conversationHistory.slice(-10).concat([
      { role: 'user', content: userMessage }
    ]);

    const url = 'https://api.deepseek.com/v1/chat/completions';
    const requestBody = {
      model: 'deepseek-chat',
      messages: messages,
      temperature: 0.7,
      stream: false
    };

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        const errorMsg = errorData.error?.message || `HTTP ${response.status}`;
        throw new Error(errorMsg);
      }

      const data = await response.json();
      const botReply = data.choices?.[0]?.message?.content;
      if (!botReply) throw new Error('API 返回内容为空');

      conversationHistory.push({ role: 'user', content: userMessage });
      conversationHistory.push({ role: 'assistant', content: botReply });

      return botReply;

    } catch (error) {
      console.error('DeepSeek API 错误:', error);
      let friendlyMsg = '';
      if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
        friendlyMsg = '🌐 网络请求失败。可能原因：① 你用 file:// 打开（需改用本机伺服器）② 网络不通 ③ 浏览器扩充阻挡';
      } else if (error.message.includes('401')) {
        friendlyMsg = '🔑 API 密钥无效或已过期。';
      } else if (error.message.includes('402')) {
        friendlyMsg = '💰 帐户余额不足。';
      } else if (error.message.includes('429')) {
        friendlyMsg = '⏳ 请求太频繁，请稍后再试。';
      } else {
        friendlyMsg = `❌ 请求失败：${error.message || '未知错误'}`;
      }
      return friendlyMsg;
    }
  }

  // ===== 發送消息 =====
  async function sendMessage() {
    if (isWaitingForResponse) { showToast('请等待当前回复完成', 1200); return; }

    const text = messageInput.value.trim();
    if (!text) { showToast('请输入消息内容', 1200); return; }

    sendBtn.classList.add('flash');
    setTimeout(() => sendBtn.classList.remove('flash'), 800);

    messageInput.value = '';
    addMessage('user', text);

    if (!apiKey) {
      addMessage('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
      return;
    }

    isWaitingForResponse = true;
    sendBtn.disabled = true;
    messageInput.disabled = true;
    resetFollowups();

    const typingIndicator = showTypingIndicator();

    try {
      const reply = await callDeepSeekAPI(text);
      removeTypingIndicator();
      if (reply) {
        addMessage('bot', reply);
        const suggestions = generateFollowups(text, reply);
        showFollowups(suggestions);

        if (autoFollowupEnabled && suggestions.length > 0) {
          setTimeout(() => {
            if (!isWaitingForResponse) {
              messageInput.value = suggestions[0];
              sendMessage();
            }
          }, 1500);
        }
      } else {
        addMessage('bot', '⚠️ 未收到有效回复。');
      }
    } catch (error) {
      removeTypingIndicator();
      addMessage('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
    } finally {
      isWaitingForResponse = false;
      sendBtn.disabled = false;
      messageInput.disabled = false;
      messageInput.focus();
    }
  }

  // ===== 事件綁定 =====
  saveApiBtn.addEventListener('click', saveApiKey);

  sendBtn.addEventListener('click', (e) => {
    createRipple(e);
    sendMessage();
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  apiKeyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveApiKey();
    }
  });

  autoFollowupToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    autoFollowupEnabled = !autoFollowupEnabled;
    autoFollowupToggle.classList.toggle('on', autoFollowupEnabled);
    showToast(autoFollowupEnabled ? '🤖 自动追问已开启' : '自动追问已关闭', 1500);
  });

  window.addEventListener('load', () => {
    if (apiKey) showToast('已加载保存的 API 密钥', 1500);
    messageInput.focus();
  });

  chatMessages.scrollTop = chatMessages.scrollHeight;
})();
</script>
</body>
</html>
