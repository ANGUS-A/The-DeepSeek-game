<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeepSeek 聊天 · 丝滑圆润</title>
  <!-- Markdown 渲染库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
  <style>
    /* ========== 全局重置 & 柔滑基调 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%); }
      100% { background: linear-gradient(145deg, #101828 0%, #1e2a44 100%); }
    }

    /* ========== 聊天卡片 — 完全圆润，无尖角 ========== */
    .chat-container {
      width: 100%;
      max-width: 780px;
      height: 90vh;
      max-height: 820px;
      background: rgba(20, 25, 40, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(100, 180, 255, 0.2);
      /* 全圆角 */
      border-radius: 42px;
      box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.6), 
                  0 0 0 1px rgba(80, 160, 255, 0.1) inset,
                  0 0 40px rgba(0, 180, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.6s cubic-bezier(0.2, 0.9, 0.3, 1), 
                  border-color 0.6s cubic-bezier(0.2, 0.9, 0.3, 1),
                  transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
      animation: cardFloat 4s ease-in-out infinite alternate;
    }

    @keyframes cardFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .chat-container:focus-within {
      border-color: rgba(0, 200, 255, 0.55);
      box-shadow: 0 35px 60px -12px rgba(0, 150, 255, 0.3), 
                  0 0 0 1px rgba(0, 220, 255, 0.3) inset,
                  0 0 60px rgba(0, 200, 255, 0.15);
      animation-play-state: paused;
    }

    /* ========== 头部 ========== */
    .chat-header {
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.6);
      border-bottom: 1px solid rgba(70, 150, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.5s ease;
    }

    .chat-header:hover {
      background: rgba(12, 22, 38, 0.7);
    }

    /* API 密钥输入框 — 完全圆润 */
    .api-input-wrapper {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 100px;
      padding: 2px 2px 2px 20px;
      border: 1px solid rgba(120, 180, 255, 0.25);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .api-input-wrapper:focus-within {
      border-color: #4da6ff;
      box-shadow: 0 0 0 4px rgba(77, 166, 255, 0.12), 0 0 25px rgba(0, 140, 255, 0.15);
      background: rgba(10, 25, 45, 0.8);
      transform: scale(1.01);
    }

    .api-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #eef5ff;
      font-size: 0.95rem;
      padding: 12px 0;
      letter-spacing: 0.3px;
      font-weight: 400;
      min-width: 0;
      transition: color 0.4s ease;
    }

    .api-input-wrapper input::placeholder {
      color: rgba(170, 210, 255, 0.45);
      font-weight: 300;
      letter-spacing: 0.2px;
      transition: color 0.4s ease;
    }

    .api-input-wrapper input:focus::placeholder {
      color: rgba(170, 210, 255, 0.25);
    }

    /* ========== 按钮通用 ========== */
    button {
      background: none;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      letter-spacing: 0.2px;
    }

    /* 「保存」按钮 — 圆润，丝滑动画 */
    .save-btn {
      background: linear-gradient(135deg, #1b6aff, #00b4ff);
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 0.85rem;
      box-shadow: 0 6px 16px rgba(0, 120, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font-weight: 600;
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .save-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
      border-radius: 100px;
    }

    .save-btn::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      top: 0;
      left: -100%;
      transition: left 0.7s ease;
      border-radius: 100px;
    }

    .save-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 24px rgba(0, 150, 255, 0.55);
      background: linear-gradient(135deg, #2f7aff, #1ebaff);
    }

    .save-btn:hover::before {
      opacity: 1;
    }

    .save-btn:hover::after {
      left: 100%;
    }

    .save-btn:active {
      transform: translateY(0px) scale(0.96);
      box-shadow: 0 4px 10px rgba(0, 120, 255, 0.5);
      transition: all 0.12s ease;
    }

    /* ========== 消息区域 ========== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 22px 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      background: radial-gradient(ellipse at 30% 10%, rgba(30, 70, 120, 0.2), transparent 70%);
      transition: background 0.6s ease;
    }

    .chat-messages:hover {
      background: radial-gradient(ellipse at 30% 10%, rgba(30, 80, 140, 0.25), transparent 70%);
    }

    /* 滚动条 */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 20px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(100, 180, 255, 0.4);
      border-radius: 20px;
      transition: background 0.4s ease, transform 0.4s ease;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 200, 255, 0.8);
      transform: scaleX(1.5);
    }

    /* ========== 消息气泡 — 完全圆润，无尖角 ========== */
    .message {
      max-width: 85%;
      display: flex;
      flex-direction: column;
      animation: messageAppear 0.55s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px) scale(0.97);
    }

    @keyframes messageAppear {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      60% {
        opacity: 1;
        transform: translateY(-2px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    /* 气泡本体 — 全圆角，无任何尖角 */
    .bubble {
      padding: 14px 22px;
      border-radius: 28px;           /* 全部圆角 */
      font-size: 0.98rem;
      line-height: 1.65;
      word-break: break-word;
      box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.5);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      letter-spacing: 0.2px;
      position: relative;
      overflow: hidden;
    }

    /* 气泡内高光扫过动画 */
    .bubble::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: left 0.8s ease;
      border-radius: 28px;
      pointer-events: none;
    }

    .bubble:hover::after {
      left: 100%;
    }

    /* 用户气泡 — 柔和渐变，圆润到底 */
    .message.user .bubble {
      background: linear-gradient(135deg, #0070ff, #0099ff);
      color: white;
      border-radius: 28px;           /* 全部圆角 */
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 22px -8px rgba(0, 120, 255, 0.5);
    }

    .message.user .bubble:hover {
      box-shadow: 0 16px 30px -8px rgba(0, 140, 255, 0.7);
      transform: translateY(-1px);
    }

    /* 机器人气泡 — 柔和深色，圆润 */
    .message.bot .bubble {
      background: rgba(30, 42, 60, 0.85);
      color: #e6f0ff;
      border-radius: 28px;           /* 全部圆角 */
      border: 1px solid rgba(80, 160, 255, 0.25);
      box-shadow: 0 12px 22px -8px rgba(0, 0, 0, 0.6);
    }

    .message.bot .bubble:hover {
      background: rgba(38, 52, 75, 0.9);
      border-color: rgba(80, 180, 255, 0.4);
      box-shadow: 0 16px 30px -8px rgba(0, 100, 200, 0.4);
      transform: translateY(-1px);
    }

    .message .time {
      font-size: 0.7rem;
      color: rgba(180, 210, 255, 0.5);
      margin-top: 8px;
      margin-left: 10px;
      margin-right: 10px;
      letter-spacing: 0.3px;
      transition: color 0.4s ease;
    }

    .message:hover .time {
      color: rgba(180, 210, 255, 0.8);
    }

    /* ========== Markdown 内容样式 ========== */
    .bubble p {
      margin: 0 0 8px 0;
    }
    .bubble p:last-child {
      margin-bottom: 0;
    }
    .bubble strong {
      color: #7ec8ff;
      font-weight: 700;
    }
    .bubble em {
      color: #a8d8ff;
      font-style: italic;
    }
    .bubble h1, .bubble h2, .bubble h3 {
      margin: 12px 0 8px;
      color: #b8e0ff;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .bubble h1 { font-size: 1.15rem; }
    .bubble h2 { font-size: 1.05rem; }
    .bubble h3 { font-size: 1rem; }

    .bubble ul, .bubble ol {
      margin: 8px 0;
      padding-left: 24px;
    }
    .bubble li {
      margin: 5px 0;
    }

    /* 行内代码 — 圆润 */
    .bubble code:not(pre code) {
      background: rgba(0, 100, 200, 0.25);
      padding: 2px 8px;
      border-radius: 10px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.88em;
      color: #9fd5ff;
      transition: background 0.4s ease;
    }
    .bubble code:not(pre code):hover {
      background: rgba(0, 120, 220, 0.4);
    }

    /* 代码区块 — 圆润 */
    .bubble pre {
      background: rgba(0, 0, 0, 0.55) !important;
      border: 1px solid rgba(80, 160, 255, 0.25);
      border-radius: 18px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
      font-size: 0.85rem;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .bubble pre:hover {
      border-color: rgba(80, 180, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.1);
    }
    .bubble pre code {
      background: transparent !important;
      padding: 0;
      font-family: 'Consolas', 'Monaco', monospace;
      color: #e6f0ff;
    }

    /* 引用区块 — 圆润 */
    .bubble blockquote {
      border-left: 4px solid #4da6ff;
      padding-left: 14px;
      margin: 10px 0;
      color: #a8c8e8;
      font-style: italic;
      border-radius: 4px;
      transition: border-color 0.4s ease, padding-left 0.4s ease;
    }
    .bubble blockquote:hover {
      border-left-color: #7ec8ff;
      padding-left: 18px;
    }

    /* 表格 — 圆润边框 */
    .bubble table {
      border-collapse: separate;
      border-spacing: 0;
      margin: 10px 0;
      font-size: 0.9rem;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(80, 160, 255, 0.3);
    }
    .bubble th, .bubble td {
      border: none;
      border-bottom: 1px solid rgba(80, 160, 255, 0.2);
      border-right: 1px solid rgba(80, 160, 255, 0.2);
      padding: 8px 12px;
      transition: background 0.3s ease;
    }
    .bubble th:last-child, .bubble td:last-child {
      border-right: none;
    }
    .bubble tr:last-child td {
      border-bottom: none;
    }
    .bubble th {
      background: rgba(0, 100, 200, 0.25);
      color: #bfe2ff;
      font-weight: 600;
    }
    .bubble tr:hover td {
      background: rgba(0, 120, 220, 0.08);
    }

    /* 链接 — 圆润下划线 */
    .bubble a {
      color: #4da6ff;
      text-decoration: none;
      border-bottom: 1.5px dashed rgba(77, 166, 255, 0.5);
      transition: all 0.4s ease;
      padding-bottom: 1px;
    }
    .bubble a:hover {
      color: #7ec8ff;
      border-bottom-style: solid;
      border-bottom-color: #7ec8ff;
      text-shadow: 0 0 12px rgba(100, 200, 255, 0.4);
    }

    /* ========== 底部输入区 ========== */
    .chat-footer {
      padding: 16px 22px 20px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(70, 150, 255, 0.15);
      transition: background 0.5s ease;
    }

    .chat-footer:hover {
      background: rgba(12, 22, 38, 0.7);
    }

    .chat-footer input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 100px;
      padding: 16px 24px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .chat-footer input:focus {
      border-color: #4da6ff;
      box-shadow: 0 0 0 4px rgba(77, 166, 255, 0.12), 0 0 30px rgba(0, 150, 255, 0.15);
      background: rgba(10, 25, 45, 0.8);
      transform: scale(1.005);
    }

    .chat-footer input::placeholder {
      color: rgba(170, 210, 255, 0.45);
      font-weight: 300;
      transition: color 0.4s ease;
    }

    .chat-footer input:focus::placeholder {
      color: rgba(170, 210, 255, 0.25);
    }

    /* ========== 发送按钮 — 圆润，多层动画 ========== */
    .send-btn {
      background: linear-gradient(145deg, #0b6eff, #00a2ff);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 22px rgba(0, 120, 255, 0.4), 0 0 0 0 rgba(0, 180, 255, 0.6);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* 脉冲光圈动画 */
    .send-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.5), transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* 旋转光环动画 */
    .send-btn::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: rgba(0, 200, 255, 0.6);
      border-right-color: rgba(0, 200, 255, 0.3);
      opacity: 0;
      transition: opacity 0.5s ease;
      animation: spinRing 2s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .send-btn:hover {
      transform: scale(1.1) translateY(-3px);
      box-shadow: 0 16px 32px rgba(0, 150, 255, 0.6), 0 0 0 10px rgba(0, 170, 255, 0.1);
    }

    .send-btn:hover::before {
      opacity: 1;
    }

    .send-btn:hover::after {
      opacity: 1;
    }

    .send-btn:active {
      transform: scale(0.92) translateY(2px);
      box-shadow: 0 4px 14px rgba(0, 120, 255, 0.6), 0 0 0 4px rgba(0, 170, 255, 0.2);
      transition: all 0.1s ease;
    }

    /* 禁用状态 */
    .send-btn:disabled, .save-btn:disabled {
      opacity: 0.45;
      transform: scale(0.96);
      pointer-events: none;
      filter: grayscale(0.4);
      box-shadow: none;
    }

    /* ========== 打字指示器 — 圆润，动感 ========== */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: rgba(40, 60, 90, 0.8);
      border-radius: 40px;           /* 完全圆润 */
      width: fit-content;
      margin-top: 4px;
      border: 1px solid rgba(80, 160, 255, 0.3);
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #7abaff;
      border-radius: 50%;
      display: inline-block;
      animation: typingBounce 1.4s infinite ease-in-out;
      transition: background 0.4s ease;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* ========== Toast 提示 ========== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(0.95);
      background: rgba(20, 35, 60, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 28px;
      border-radius: 100px;
      color: #bfe2ff;
      font-size: 0.9rem;
      border: 1px solid rgba(0, 180, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* ========== 响应式 ========== */
    @media (max-width: 520px) {
      .chat-container {
        height: 94vh;
        border-radius: 32px;
      }
      .chat-header {
        padding: 14px 16px;
      }
      .message {
        max-width: 92%;
      }
      .bubble {
        padding: 12px 18px;
        font-size: 0.92rem;
        border-radius: 24px;
      }
      .chat-footer {
        padding: 12px 16px 16px;
      }
      .chat-footer input {
        padding: 14px 20px;
      }
      .send-btn {
        width: 52px;
        height: 52px;
        font-size: 1.6rem;
      }
    }

    /* 输入框禁用时 */
    .chat-footer input:disabled {
      opacity: 0.55;
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(120, 180, 255, 0.1);
      cursor: not-allowed;
      transform: scale(0.99);
    }

    /* 额外细节：每个气泡的底部小圆点装饰（圆润感） */
    .message .bubble::before {
      content: '';
      position: absolute;
      bottom: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: inherit;
      opacity: 0.5;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .message.user .bubble::before {
      right: 16px;
      background: linear-gradient(135deg, #0070ff, #0099ff);
    }

    .message.bot .bubble::before {
      left: 16px;
      background: rgba(30, 42, 60, 0.85);
    }

    .message:hover .bubble::before {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- 头部：API 密钥 + 保存 -->
  <div class="chat-header">
    <div class="api-input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="输入 DeepSeek API 密钥..." autocomplete="off" spellcheck="false">
    </div>
    <button class="save-btn" id="saveApiBtn">保存密钥</button>
  </div>

  <!-- 消息区 -->
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="bubble">你好！我是 DeepSeek 助手。请先输入 API 密钥，然后就可以开始对话了 ✨</div>
      <div class="time">刚刚</div>
    </div>
  </div>

  <!-- 底部输入 -->
  <div class="chat-footer">
    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  (function() {
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiBtn = document.getElementById('saveApiBtn');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const toastEl = document.getElementById('toast');

    let apiKey = localStorage.getItem('deepseek_api_key') || '';
    let isWaitingForResponse = false;

    if (apiKey) {
      apiKeyInput.value = apiKey;
    }

    // ===== Toast =====
    function showToast(text, duration = 2000) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    // ===== 保存密钥 =====
    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        showToast('密钥不能为空', 1800);
        return;
      }
      apiKey = key;
      localStorage.setItem('deepseek_api_key', key);
      showToast('✅ API 密钥已保存', 1600);
      saveApiBtn.style.transform = 'scale(0.94)';
      setTimeout(() => { saveApiBtn.style.transform = ''; }, 180);
    }

    // ===== 添加消息（含 Markdown 渲染） =====
    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', role);

      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('bubble');

      if (role === 'bot') {
        try {
          const rawHtml = marked.parse(content);
          bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
          bubbleDiv.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
          });
        } catch (e) {
          bubbleDiv.textContent = content;
        }
      } else {
        bubbleDiv.textContent = content;
      }

      const timeDiv = document.createElement('div');
      timeDiv.classList.add('time');
      const now = new Date();
      timeDiv.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      messageDiv.appendChild(bubbleDiv);
      messageDiv.appendChild(timeDiv);
      chatMessages.appendChild(messageDiv);

      requestAnimationFrame(() => {
        chatMessages.scrollTo({
          top: chatMessages.scrollHeight,
          behavior: 'smooth'
        });
      });

      return messageDiv;
    }

    // ===== 打字指示器 =====
    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.classList.add('message', 'bot');
      typingDiv.id = 'typingIndicator';

      const indicatorWrapper = document.createElement('div');
      indicatorWrapper.classList.add('typing-indicator');
      indicatorWrapper.innerHTML = '<span></span><span></span><span></span>';

      typingDiv.appendChild(indicatorWrapper);
      chatMessages.appendChild(typingDiv);

      requestAnimationFrame(() => {
        chatMessages.scrollTo({
          top: chatMessages.scrollHeight,
          behavior: 'smooth'
        });
      });

      return typingDiv;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    // ===== 调用 DeepSeek API =====
    async function callDeepSeekAPI(userMessage) {
      if (!apiKey) {
        addMessage('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。');
        return null;
      }

      const url = 'https://api.deepseek.com/v1/chat/completions';
      const requestBody = {
        model: 'deepseek-chat',
        messages: [{ role: 'user', content: userMessage }],
        temperature: 0.7,
        stream: false
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          const errorMsg = errorData.error?.message || `HTTP ${response.status}`;
          throw new Error(errorMsg);
        }

        const data = await response.json();
        const botReply = data.choices?.[0]?.message?.content;
        if (!botReply) throw new Error('API 返回内容为空');
        return botReply;

      } catch (error) {
        console.error('DeepSeek API 错误:', error);
        let friendlyMsg = '';
        if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
          friendlyMsg = '🌐 网络请求失败。可能原因：① 你用 file:// 打开（需改用本机伺服器）② 网络不通 ③ 浏览器扩充阻挡';
        } else if (error.message.includes('401')) {
          friendlyMsg = '🔑 API 密钥无效或已过期。';
        } else if (error.message.includes('402')) {
          friendlyMsg = '💰 帐户余额不足。';
        } else if (error.message.includes('429')) {
          friendlyMsg = '⏳ 请求太频繁，请稍后再试。';
        } else {
          friendlyMsg = `❌ 请求失败：${error.message || '未知错误'}`;
        }
        return friendlyMsg;
      }
    }

    // ===== 发送消息 =====
    async function sendMessage() {
      if (isWaitingForResponse) {
        showToast('请等待当前回复完成', 1200);
        return;
      }

      const text = messageInput.value.trim();
      if (!text) {
        showToast('请输入消息内容', 1200);
        return;
      }

      messageInput.value = '';
      addMessage('user', text);

      if (!apiKey) {
        addMessage('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
        return;
      }

      isWaitingForResponse = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;

      const typingIndicator = showTypingIndicator();

      try {
        const reply = await callDeepSeekAPI(text);
        removeTypingIndicator();
        if (reply) {
          addMessage('bot', reply);
        } else {
          addMessage('bot', '⚠️ 未收到有效回复。');
        }
      } catch (error) {
        removeTypingIndicator();
        addMessage('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
      } finally {
        isWaitingForResponse = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    // ===== 事件绑定 =====
    saveApiBtn.addEventListener('click', saveApiKey);
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveApiKey();
      }
    });

    window.addEventListener('load', () => {
      if (apiKey) {
        showToast('已加载保存的 API 密钥', 1500);
      }
      messageInput.focus();
    });

    chatMessages.scrollTop = chatMessages.scrollHeight;
  })();
</script>
</body>
</html>
