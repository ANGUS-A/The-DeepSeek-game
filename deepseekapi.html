<style>
  /* ================= 主題變數（與你之前的版本完全一致） ================= */
  body, body[data-theme="pink"] { --bg-page: #fff0f5; --card-1: rgba(255,240,245,.85); --card-2: rgba(255,228,236,.92); --header-1: rgba(255,235,242,.92); --header-2: rgba(255,220,232,.85); --accent-1: #ff9eb5; --accent-2: #ff7d9c; --accent-3: #ffb6c1; --accent-soft: rgba(255,182,193,.35); --accent-glow: rgba(255,143,163,.5); --text-1: #4a2c3a; --text-2: rgba(74,44,58,.7); --text-3: rgba(74,44,58,.45); --bubble-user-bg: linear-gradient(135deg,#ff9eb5,#ff7d9c); --bubble-bot-bg: rgba(255,250,252,.95); --border-soft: rgba(255,182,193,.4); --border-medium: rgba(255,143,163,.5); --border-strong: rgba(255,125,156,.75); }

  body[data-theme="deeppurple"] { --bg-page:#05000d;--card-1:rgba(42,0,80,.78);--card-2:rgba(21,0,41,.88);--header-1:rgba(21,0,41,.85);--header-2:rgba(42,0,80,.65);--accent-1:#7b2fbe;--accent-2:#b026ff;--accent-3:#e0aaff;--accent-soft:rgba(176,38,255,.4);--accent-glow:rgba(199,125,255,.7);--text-1:#f0e5ff;--text-2:rgba(199,125,255,.75);--text-3:rgba(199,125,255,.5);--bubble-user-bg:linear-gradient(135deg,#7b2fbe,#b026ff);--bubble-bot-bg:linear-gradient(135deg,rgba(42,0,80,.9),rgba(21,0,41,.9));--border-soft:rgba(176,38,255,.25);--border-medium:rgba(176,38,255,.4);--border-strong:rgba(224,170,255,.7); }
  body[data-theme="deepblue"] { --bg-page:#03080f;--card-1:rgba(10,30,60,.78);--card-2:rgba(5,15,35,.88);--header-1:rgba(5,15,35,.85);--header-2:rgba(10,30,60,.65);--accent-1:#1e5fbb;--accent-2:#3a8fff;--accent-3:#7db8ff;--accent-soft:rgba(58,143,255,.4);--accent-glow:rgba(125,184,255,.7);--text-1:#e8f2ff;--text-2:rgba(150,195,255,.75);--text-3:rgba(150,195,255,.5);--bubble-user-bg:linear-gradient(135deg,#1e5fbb,#3a8fff);--bubble-bot-bg:linear-gradient(135deg,rgba(10,30,60,.9),rgba(5,15,35,.9));--border-soft:rgba(58,143,255,.25);--border-medium:rgba(58,143,255,.4);--border-strong:rgba(125,184,255,.7); }
  body[data-theme="lightblue"] { --bg-page:#041018;--card-1:rgba(20,70,100,.75);--card-2:rgba(10,40,65,.85);--header-1:rgba(10,40,65,.85);--header-2:rgba(20,70,100,.65);--accent-1:#1e9dd9;--accent-2:#4dc6ff;--accent-3:#8fe0ff;--accent-soft:rgba(77,198,255,.4);--accent-glow:rgba(143,224,255,.7);--text-1:#e6f8ff;--text-2:rgba(140,210,245,.75);--text-3:rgba(140,210,245,.5);--bubble-user-bg:linear-gradient(135deg,#1e9dd9,#4dc6ff);--bubble-bot-bg:linear-gradient(135deg,rgba(20,70,100,.9),rgba(10,40,65,.9));--border-soft:rgba(77,198,255,.25);--border-medium:rgba(77,198,255,.4);--border-strong:rgba(143,224,255,.7); }
  body[data-theme="green"] { --bg-page:#031207;--card-1:rgba(15,65,30,.78);--card-2:rgba(5,35,15,.88);--header-1:rgba(5,35,15,.85);--header-2:rgba(15,65,30,.65);--accent-1:#146b32;--accent-2:#1e9e4a;--accent-3:#3ac46e;--accent-soft:rgba(30,158,74,.4);--accent-glow:rgba(58,196,110,.7);--text-1:#e6ffef;--text-2:rgba(140,220,175,.75);--text-3:rgba(140,220,175,.5);--bubble-user-bg:linear-gradient(135deg,#146b32,#1e9e4a);--bubble-bot-bg:linear-gradient(135deg,rgba(15,65,30,.9),rgba(5,35,15,.9));--border-soft:rgba(30,158,74,.25);--border-medium:rgba(30,158,74,.4);--border-strong:rgba(58,196,110,.7); }
  body[data-theme="yellow"] { --bg-page:#14100a;--card-1:rgba(85,65,15,.75);--card-2:rgba(50,35,5,.85);--header-1:rgba(50,35,5,.85);--header-2:rgba(85,65,15,.65);--accent-1:#d9a820;--accent-2:#ffcc40;--accent-3:#ffe080;--accent-soft:rgba(255,204,64,.4);--accent-glow:rgba(255,224,128,.7);--text-1:#fff9e6;--text-2:rgba(230,210,150,.75);--text-3:rgba(230,210,150,.5);--bubble-user-bg:linear-gradient(135deg,#d9a820,#ffcc40);--bubble-bot-bg:linear-gradient(135deg,rgba(85,65,15,.9),rgba(50,35,5,.9));--border-soft:rgba(255,204,64,.25);--border-medium:rgba(255,204,64,.4);--border-strong:rgba(255,224,128,.7); }
  body[data-theme="orange"] { --bg-page:#140803;--card-1:rgba(85,40,10,.75);--card-2:rgba(50,20,5,.85);--header-1:rgba(50,20,5,.85);--header-2:rgba(85,40,10,.65);--accent-1:#d96720;--accent-2:#ff8b3a;--accent-3:#ffb37a;--accent-soft:rgba(255,139,58,.4);--accent-glow:rgba(255,179,122,.7);--text-1:#fff3e6;--text-2:rgba(235,180,140,.75);--text-3:rgba(235,180,140,.5);--bubble-user-bg:linear-gradient(135deg,#d96720,#ff8b3a);--bubble-bot-bg:linear-gradient(135deg,rgba(85,40,10,.9),rgba(50,20,5,.9));--border-soft:rgba(255,139,58,.25);--border-medium:rgba(255,139,58,.4);--border-strong:rgba(255,179,122,.7); }
  body[data-theme="mono"] { --bg-page:#0a0a0a;--card-1:rgba(30,30,30,.78);--card-2:rgba(15,15,15,.88);--header-1:rgba(15,15,15,.85);--header-2:rgba(30,30,30,.65);--accent-1:#888;--accent-2:#b0b0b0;--accent-3:#e0e0e0;--accent-soft:rgba(176,176,176,.4);--accent-glow:rgba(224,224,224,.7);--text-1:#f0f0f0;--text-2:rgba(200,200,200,.75);--text-3:rgba(200,200,200,.5);--bubble-user-bg:linear-gradient(135deg,#555,#909090);--bubble-bot-bg:linear-gradient(135deg,rgba(30,30,30,.9),rgba(15,15,15,.9));--border-soft:rgba(176,176,176,.25);--border-medium:rgba(176,176,176,.4);--border-strong:rgba(224,224,224,.7); }

  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  html,body { height:100%; overflow:hidden; }
  body { background:var(--bg-page); display:flex; justify-content:center; align-items:center; padding:16px; margin:0; position:relative; transition:background .4s; }
  :root { --apple-spring: cubic-bezier(.32,.72,0,1); }

  /* ================= 背景 ================= */
  .aurora-bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .aurora-layer { position:absolute; inset:-50%; filter:blur(70px); opacity:.85; }
  .aurora-1 { background:radial-gradient(circle at 20% 30%,var(--accent-soft) 0%,transparent 45%),radial-gradient(circle at 80% 70%,var(--accent-glow) 0%,transparent 45%); animation:aurora1 22s ease-in-out infinite alternate; }
  .aurora-2 { background:radial-gradient(circle at 70% 20%,var(--card-2) 0%,transparent 50%),radial-gradient(circle at 30% 80%,var(--accent-soft) 0%,transparent 50%); animation:aurora2 28s ease-in-out infinite alternate; }
  .aurora-3 { background:radial-gradient(circle at 50% 50%,var(--accent-soft) 0%,transparent 60%),radial-gradient(circle at 15% 85%,var(--accent-glow) 0%,transparent 50%); animation:aurora3 25s ease-in-out infinite alternate; }
  .aurora-4 { background:radial-gradient(circle at 85% 40%,var(--accent-soft) 0%,transparent 45%),radial-gradient(circle at 25% 55%,var(--accent-glow) 0%,transparent 50%); animation:aurora4 32s ease-in-out infinite alternate; }
  @keyframes aurora1 { 0%{transform:translate(0,0) rotate(0) scale(1);}100%{transform:translate(10%,-8%) rotate(15deg) scale(1.15);} }
  @keyframes aurora2 { 0%{transform:translate(0,0) rotate(0) scale(1.1);}100%{transform:translate(-10%,8%) rotate(-12deg) scale(1);} }
  @keyframes aurora3 { 0%{transform:translate(-5%,5%) rotate(-5deg);}100%{transform:translate(8%,-6%) rotate(8deg);} }
  @keyframes aurora4 { 0%{transform:translate(5%,5%) rotate(8deg) scale(1);}100%{transform:translate(-8%,-5%) rotate(-10deg) scale(1.1);} }
  .stars-bg { position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
  .star { position:absolute; border-radius:50%; background:radial-gradient(circle,var(--accent-3),var(--accent-soft) 50%,transparent 70%); box-shadow:0 0 12px var(--accent-glow),0 0 24px var(--accent-soft); animation:starFloat linear infinite, starTwinkle ease-in-out infinite alternate; opacity:0; }
  @keyframes starFloat { 0%{transform:translateY(0) translateX(0);opacity:0;}10%{opacity:1;}90%{opacity:.4;}100%{transform:translateY(-110vh) translateX(50px);opacity:0;} }
  @keyframes starTwinkle { 0%{filter:brightness(.7);}100%{filter:brightness(1.6);} }

  /* ================= 主容器 ================= */
  .app-container { position:relative; z-index:5; width:100%; max-width:780px; height:90vh; max-height:820px; background:linear-gradient(135deg,var(--card-1),var(--card-2)); backdrop-filter:blur(34px) saturate(200%); -webkit-backdrop-filter:blur(34px) saturate(200%); border:1px solid var(--border-medium); border-radius:44px; overflow:hidden; transition:transform .5s var(--apple-spring), box-shadow .8s, background .4s; animation:cardEntrance 1.4s var(--apple-spring) both, cardFloat 8s ease-in-out infinite alternate; transform-style:preserve-3d; isolation:isolate; }
  @keyframes cardEntrance { 0%{opacity:0;transform:translateY(60px) scale(.85) rotateX(15deg);filter:blur(15px);}100%{opacity:1;transform:translateY(0) scale(1) rotateX(0);filter:blur(0);} }
  @keyframes cardFloat { 0%{transform:translateY(0) rotateZ(0);}100%{transform:translateY(-10px) rotateZ(.5deg);} }
  .app-container::after { content:''; position:absolute; inset:0; border-radius:44px; background:radial-gradient(ellipse at 50% -20%,var(--accent-soft),transparent 60%); pointer-events:none; z-index:1; }
  .app-container::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--accent-1),var(--accent-3),var(--accent-2),var(--accent-1),transparent); background-size:300% 100%; animation:topScan 4s linear infinite; z-index:15; border-radius:44px 44px 0 0; box-shadow:0 0 20px var(--accent-glow); }
  @keyframes topScan { 0%{background-position:300% 0;}100%{background-position:-300% 0;} }

  /* 視圖切換 */
  .view { position:absolute; inset:0; display:flex; flex-direction:column; transition:transform .6s var(--apple-spring), opacity .5s; backface-visibility:hidden; }
  .view-hidden { opacity:0; pointer-events:none; transform:translateX(-12%) scale(.96); filter:blur(8px); }
  .view-right-hidden { opacity:0; pointer-events:none; transform:translateX(100%); filter:blur(8px); }

  /* ================= 會話列表 ================= */
  .list-header { padding:20px 22px 16px; background:linear-gradient(135deg,var(--header-1),var(--header-2)); border-bottom:1px solid var(--border-soft); backdrop-filter:blur(16px); position:relative; overflow:hidden; }
  .list-title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .list-title { font-size:1.5rem; font-weight:800; letter-spacing:1.5px; background:linear-gradient(90deg,var(--accent-2),var(--accent-3),var(--accent-1),var(--accent-2)); background-size:300% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:titleGradient 5s linear infinite; display:flex; align-items:center; gap:10px; }
  @keyframes titleGradient { 0%{background-position:0% center;}100%{background-position:300% center;} }
  .list-title .title-icon { font-size:1.5rem; -webkit-text-fill-color:initial; color:var(--accent-2); filter:drop-shadow(0 0 12px var(--accent-glow)); }
  .settings-btn { width:42px; height:42px; border-radius:50%; cursor:pointer; background:var(--bubble-bot-bg); border:1px solid var(--border-medium); color:var(--accent-2); display:flex; align-items:center; justify-content:center; transition:all .4s var(--apple-spring); flex-shrink:0; }
  .settings-btn:hover { transform:rotate(60deg) scale(1.1); border-color:var(--border-strong); box-shadow:0 0 25px var(--accent-glow); }
  .settings-btn:active { transform:rotate(60deg) scale(.95); }
  .list-subtitle { font-size:.78rem; color:var(--text-3); margin-top:6px; letter-spacing:.3px; }
  .conversation-list { flex:1; overflow-y:auto; padding:12px 12px 20px; display:flex; flex-direction:column; gap:8px; background:radial-gradient(ellipse at 30% 10%,var(--accent-soft),transparent 70%); }
  .conversation-list::-webkit-scrollbar { width:8px; } .conversation-list::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--accent-1),var(--accent-2)); border-radius:20px; }
  .conv-item { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:20px; background:var(--bubble-bot-bg); border:1px solid var(--border-soft); cursor:pointer; transition:all .5s var(--apple-spring); animation:convAppear .7s var(--apple-spring) both; }
  @keyframes convAppear { 0%{opacity:0;transform:translateX(-30px) scale(.9);filter:blur(6px);}100%{opacity:1;transform:translateX(0) scale(1);filter:blur(0);} }
  .conv-item:hover { border-color:var(--border-strong); transform:translateX(6px) scale(1.01); box-shadow:0 12px 30px -6px var(--accent-soft),0 0 30px var(--accent-soft); }
  .conv-avatar { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; border:2px solid var(--border-medium); box-shadow:0 0 20px var(--accent-soft); animation:avatarPulse 3s ease-in-out infinite; }
  @keyframes avatarPulse { 0%,100%{box-shadow:0 0 20px var(--accent-soft);}50%{box-shadow:0 0 35px var(--accent-glow),0 0 0 4px var(--accent-soft);} }
  .avatar-1{background:var(--bubble-user-bg);}.avatar-2{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));}.avatar-3{background:linear-gradient(135deg,var(--accent-2),var(--accent-3));}.avatar-4{background:linear-gradient(135deg,var(--card-2),var(--accent-1));}
  .conv-content { flex:1; min-width:0; } .conv-name { font-size:1rem; font-weight:600; color:var(--text-1); display:flex; justify-content:space-between; margin-bottom:4px; }
  .conv-time { font-size:.72rem; color:var(--text-3); } .conv-preview { font-size:.82rem; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ================= 聊天視圖 ================= */
  .chat-header { padding:14px 18px; display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,var(--header-1),var(--header-2)); border-bottom:1px solid var(--border-soft); backdrop-filter:blur(16px); position:relative; z-index:2; }
  .back-btn { background:var(--bubble-bot-bg); border:1px solid var(--border-medium); border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; color:var(--accent-2); cursor:pointer; transition:all .4s var(--apple-spring); flex-shrink:0; }
  .back-btn:hover { transform:scale(1.12) translateX(-3px); border-color:var(--border-strong); box-shadow:0 0 25px var(--accent-soft); }
  .back-btn:active { transform:scale(.92); }
  .chat-header-info { flex:1; min-width:0; }
  .chat-header-name { font-size:1.05rem; font-weight:600; color:var(--text-1); display:flex; align-items:center; gap:8px; }
  .chat-header-status { font-size:.72rem; color:var(--text-2); display:flex; align-items:center; gap:6px; margin-top:2px; }
  .status-dot { width:6px; height:6px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 8px var(--accent-glow); animation:statusPulse 2s ease-in-out infinite; }
  @keyframes statusPulse { 0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.4);} }
  .api-input-wrapper { display:flex; align-items:center; background:var(--bubble-bot-bg); border-radius:100px; padding:2px 2px 2px 16px; border:1px solid var(--border-medium); transition:all .4s var(--apple-spring); margin-top:10px; }
  .api-input-wrapper:focus-within { border-color:var(--border-strong); box-shadow:0 0 0 4px var(--accent-soft),0 0 50px var(--accent-soft); }
  .api-input-wrapper input { flex:1; background:transparent; border:none; outline:none; color:var(--text-1); font-size:.85rem; padding:10px 0; min-width:0; }
  .api-input-wrapper input::placeholder { color:var(--text-3); }
  .save-btn { background:var(--bubble-user-bg); border-radius:100px; padding:8px 16px; font-size:.78rem; font-weight:600; color:#fff; border:1px solid var(--border-medium); cursor:pointer; transition:all .4s var(--apple-spring); }
  .save-btn:hover { transform:translateY(-2px) scale(1.05); box-shadow:0 12px 30px var(--accent-soft); }

  /* ================= 訊息區域 ================= */
  .chat-messages { flex:1; overflow-y:auto; padding:20px 18px 12px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; background:radial-gradient(ellipse at 30% 10%,var(--accent-soft),transparent 60%),radial-gradient(ellipse at 70% 90%,var(--accent-soft),transparent 60%); position:relative; z-index:2; }
  .chat-messages::-webkit-scrollbar { width:8px; } .chat-messages::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--accent-1),var(--accent-2)); border-radius:20px; }

  /* ================= 訊息氣泡 ================= */
  .message { max-width:85%; display:flex; flex-direction:column; position:relative; }
  .message.user { align-self:flex-end; align-items:flex-end; }
  .message.bot { align-self:flex-start; align-items:flex-start; }
  .bubble { padding:14px 22px; font-size:.98rem; line-height:1.65; word-break:break-word; backdrop-filter:blur(12px); position:relative; cursor:pointer; user-select:none; transition:transform .3s var(--apple-spring); }
  .bubble:active { transform:scale(.97); }
  .message.user .bubble { background:var(--bubble-user-bg); color:#fff; border:1px solid var(--border-medium); border-radius:24px 24px 6px 24px; box-shadow:0 14px 32px -8px var(--accent-soft),0 0 40px var(--accent-soft); }
  .message.bot .bubble { background:var(--bubble-bot-bg); color:var(--text-1); border:1px solid var(--border-medium); border-radius:24px 24px 24px 6px; box-shadow:0 14px 32px -8px rgba(0,0,0,.15); }
  .message .time { font-size:.7rem; color:var(--text-3); margin-top:8px; margin-left:10px; margin-right:10px; }
  @keyframes bubbleLand { 0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.04);opacity:1;}100%{transform:scale(1);opacity:1;} }

  /* 🆕 圖片訊息樣式（自適應主題） */
  .message-image { max-width:260px; border-radius:18px; overflow:hidden; border:2px solid var(--border-medium); box-shadow:0 8px 24px -6px var(--accent-soft),0 0 30px var(--accent-soft); cursor:pointer; transition:transform .3s var(--apple-spring), box-shadow .3s; }
  .message-image:hover { transform:scale(1.02); box-shadow:0 12px 30px -6px var(--accent-glow),0 0 40px var(--accent-glow); }
  .message-image img { display:block; width:100%; height:auto; max-height:320px; object-fit:cover; }
  .message.bot .message-image { border-radius:18px 18px 18px 6px; }
  .message.user .message-image { border-radius:18px 18px 6px 18px; }

  /* Markdown */
  .bubble p{margin:0 0 8px;}.bubble p:last-child{margin-bottom:0;}
  .bubble strong{color:var(--accent-3);}.bubble h1,.bubble h2,.bubble h3{margin:12px 0 8px;color:var(--accent-3);}
  .bubble code:not(pre code){background:var(--accent-soft);padding:2px 8px;border-radius:10px;color:var(--accent-3);}
  .bubble pre{background:rgba(0,0,0,.6)!important;border:1px solid var(--border-medium);border-radius:18px;padding:14px;overflow-x:auto;margin:12px 0;}
  .bubble table{border-collapse:separate;border-spacing:0;margin:10px 0;border-radius:14px;overflow:hidden;border:1px solid var(--border-medium);}
  .bubble th,.bubble td{border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);padding:8px 12px;}
  .bubble th{background:var(--accent-soft);color:var(--accent-3);}

  /* 跟進建議 */
  .followup-section{padding:10px 18px 6px;background:linear-gradient(180deg,transparent,var(--card-2));border-top:1px solid var(--border-soft);animation:followupSlideIn .6s var(--apple-spring) both;}

  .perf-options { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }

  /* 性能調整 */

    { id:'roleplay', emoji:'🎭', title:'角色扮演', preview:'你是我的专属武侠小说家...', time:'昨天', avatarClass:'avatar-2', status:'角色模式 · 武侠世界', welcome:'欢迎来到武侠世界 🗡️<br><br>我是你的专属武侠小说家。请告诉我你想扮演的角色或想展开的剧情。', history:[] },
    { id:'game', emoji:'🎮', title:'游戏询问', preview:'最近有什么好玩的游戏...', time:'昨天', avatarClass:'avatar-3', status:'游戏助手 · 在线', welcome:'你好！我是你的游戏助手 🎮<br><br>想找新游戏？想了解攻略？还是想聊聊最近的热门大作？', history:[] },
    { id:'study', emoji:'📚', title:'学习助手', preview:'帮我解释一下量子力学...', time:'星期一', avatarClass:'avatar-4', status:'学习模式 · 专注中', welcome:'你好！我是你的学习助手 📚<br><br>无论是数学、物理、编程还是语言学习，我都能帮你。', history:[] }
  ];

  let currentConversation = null;
  let apiKey = localStorage.getItem('deepseek_api_key') || '';
  let isWaitingForResponse = false;
  let autoFollowupEnabled = false;
  let pendingImageBase64 = null; // 待發送的圖片

  const appContainer = document.getElementById('appContainer');
  const listView = document.getElementById('listView');
  const chatView = document.getElementById('chatView');
  const conversationList = document.getElementById('conversationList');
  const backBtn = document.getElementById('backBtn');
  const chatHeaderEmoji = document.getElementById('chatHeaderEmoji');
  const chatHeaderTitle = document.getElementById('chatHeaderTitle');
  const chatHeaderStatus = document.getElementById('chatHeaderStatus');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveApiBtn = document.getElementById('saveApiBtn');
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const toastEl = document.getElementById('toast');
  const starsBg = document.getElementById('starsBg');
  const followupList = document.getElementById('followupList');
  const autoFollowupToggle = document.getElementById('autoFollowup');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsBack = document.getElementById('settingsBack');
  const themeGrid = document.getElementById('themeGrid');
  const perfOptions = document.getElementById('perfOptions');
  const attachBtn = document.getElementById('attachBtn');
  const inlineAttachBtn = document.getElementById('inlineAttachBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewBar = document.getElementById('imagePreviewBar');

  if (apiKey) apiKeyInput.value = apiKey;

  // ================= 設定 =================
  document.querySelectorAll('.theme-swatch').forEach(sw => {
    if (sw.dataset.theme === savedTheme) sw.classList.add('active');
    sw.addEventListener('click', () => {
      document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      document.body.dataset.theme = sw.dataset.theme;
      localStorage.setItem('deepseek_theme', sw.dataset.theme);
    });
  });
  document.querySelectorAll('.perf-option').forEach(op => {
    if (op.dataset.perf === savedPerf) op.classList.add('active');
    op.addEventListener('click', () => {
      document.querySelectorAll('.perf-option').forEach(o => o.classList.remove('active'));
      op.classList.add('active');
      document.body.dataset.perf = op.dataset.perf;
      localStorage.setItem('deepseek_perf', op.dataset.perf);
      showToast(op.dataset.perf === 'low' ? '⚡ 已切換到極低細節' : op.dataset.perf === 'high' ? '💎 已切換到極高細節' : '✨ 已切換到一般細節');
    });
  });
  settingsBtn.addEventListener('click', () => settingsOverlay.classList.add('open'));
  settingsBack.addEventListener('click', () => settingsOverlay.classList.remove('open'));
  settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

  // ================= 渲染列表 =================
  function renderConversationList() {
    conversationList.innerHTML = '';
    conversations.forEach((conv, i) => {
      const item = document.createElement('div');
      item.className = 'conv-item';
      item.style.animationDelay = (i * 0.1) + 's';
      item.innerHTML = `<div class="conv-avatar ${conv.avatarClass}">${conv.emoji}</div><div class="conv-content"><div class="conv-name"><span>${conv.title}</span><span class="conv-time">${conv.time}</span></div><div class="conv-preview">${conv.preview}</div></div>`;
      item.addEventListener('click', () => openConversation(conv));
      conversationList.appendChild(item);
    });
  }

  function openConversation(conv) {
    currentConversation = conv;
    chatHeaderEmoji.textContent = conv.emoji;
    chatHeaderTitle.textContent = conv.title;
    chatHeaderStatus.textContent = conv.status;
    chatMessages.innerHTML = '';
    if (conv.history.length === 0) {
      addMessageToUI('bot', conv.welcome, true);
      conv.history.push({ role:'assistant', content: conv.welcome, isHTML: true });
    } else {
      conv.history.forEach(msg => addMessageToUI(msg.role === 'user' ? 'user' : 'bot', msg.content, msg.isHTML, false, msg.image));
    }
    listView.classList.add('view-hidden');
    chatView.classList.remove('view-right-hidden');
    setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; messageInput.focus(); }, 500);
  }

  backBtn.addEventListener('click', () => {
    listView.classList.remove('view-hidden');
    chatView.classList.add('view-right-hidden');
    setTimeout(() => { currentConversation = null; }, 600);
  });

  if (savedPerf !== 'low') {
    appContainer.addEventListener('mousemove', (e) => {
      const rect = appContainer.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      appContainer.style.transform = `perspective(1500px) rotateY(${x * 2.5}deg) rotateX(${-y * 2.5}deg) translateY(-4px)`;
    });
    appContainer.addEventListener('mouseleave', () => { appContainer.style.transform = ''; });
  }

  function createStars() {
    if (savedPerf === 'low') return;
    const count = savedPerf === 'high' ? 100 : 70;
    starsBg.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.bottom = '-20px';
      const size = Math.random() * 4 + 1.5;
      star.style.width = size + 'px'; star.style.height = size + 'px';
      star.style.animationDuration = (Math.random() * 20 + 15) + 's, ' + (Math.random() * 2 + 1.5) + 's';
      star.style.animationDelay = (Math.random() * 20) + 's, ' + (Math.random() * 2) + 's';
      starsBg.appendChild(star);
    }
  }
  createStars();

  function showToast(text, duration = 2000) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  function copyBubbleContent(bubble, e) {
    let text = bubble.innerText || bubble.textContent || '';
    text = text.trim(); if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      bubble.style.transition = 'transform 0.3s var(--apple-spring)';
      bubble.style.transform = 'scale(1.05)';
      setTimeout(() => bubble.style.transform = '', 300);
      showToast('✨ 已複製到剪貼板');
    }).catch(() => {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('✨ 已複製');
    });
  }

  saveApiBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (!key) { showToast('密钥不能为空'); return; }
    apiKey = key; localStorage.setItem('deepseek_api_key', key); showToast('✅ API 密钥已保存');
  });

  // ================= 圖片上傳 =================
  function openFilePicker() { fileInput.click(); }
  attachBtn.addEventListener('click', openFilePicker);
  inlineAttachBtn.addEventListener('click', openFilePicker);

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { showToast('❌ 請選擇圖片檔案'); return; }
    if (file.size > 5 * 1024 * 1024) { showToast('❌ 圖片不能超過 5MB'); return; }

    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingImageBase64 = ev.target.result;
      renderImagePreview();
      showToast('🖼️ 圖片已準備好，按發送');
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  function renderImagePreview() {
    imagePreviewBar.innerHTML = '';
    if (pendingImageBase64) {
      imagePreviewBar.classList.add('show');
      const item = document.createElement('div');
      item.className = 'image-preview-item';
      item.innerHTML = `<img src="${pendingImageBase64}" alt="預覽"><button class="remove-img" id="removeImg">✕</button>`;
      imagePreviewBar.appendChild(item);
      document.getElementById('removeImg').addEventListener('click', () => {
        pendingImageBase64 = null;
        imagePreviewBar.classList.remove('show');
        renderImagePreview();
      });
    } else {
      imagePreviewBar.classList.remove('show');
    }
  }

  // ================= 消息 UI =================
  function addMessageToUI(role, content, isHTML = false, isLanding = false, imageBase64 = null) {
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', role);

    // 圖片（若有）
    if (imageBase64) {
      const imgWrap = document.createElement('div');
      imgWrap.className = 'message-image';
      const img = document.createElement('img');
      img.src = imageBase64;
      img.alt = '上傳的圖片';
      imgWrap.appendChild(img);
      imgWrap.addEventListener('click', (e) => { e.stopPropagation(); window.open(imageBase64, '_blank'); });
      messageDiv.appendChild(imgWrap);
    }

    // 文字氣泡（若有文字）
    if (content && content.trim()) {
      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('bubble');
      if (role === 'bot' && !isHTML) {
        try {
          const rawHtml = marked.parse(content);
          bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
          bubbleDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        } catch (e) { bubbleDiv.textContent = content; }
      } else if (isHTML) {
        bubbleDiv.innerHTML = content;
      } else {
        bubbleDiv.textContent = content;
      }
      bubbleDiv.addEventListener('click', (e) => { e.stopPropagation(); copyBubbleContent(bubbleDiv, e); });
      messageDiv.appendChild(bubbleDiv);
      if (isLanding && savedPerf !== 'low') {
        bubbleDiv.style.animation = 'none';
        bubbleDiv.offsetHeight;
        bubbleDiv.style.animation = 'bubbleLand 0.5s var(--apple-spring)';
      }
    }

    const timeDiv = document.createElement('div');
    timeDiv.classList.add('time');
    timeDiv.textContent = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
    messageDiv.appendChild(timeDiv);
    chatMessages.appendChild(messageDiv);
    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior:'smooth' }));
    return messageDiv;
  }

  function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.classList.add('message', 'bot'); typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = '<div class="typing-wrapper"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
    chatMessages.appendChild(typingDiv);
    requestAnimationFrame(() => chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior:'smooth' }));
  }
  function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

  // ================= 跟進建議 =================
  function generateFollowups(userText, botText, convId) {
    const s = [];
    if (convId === 'roleplay') s.push('继续这个剧情','换个场景','加入一个角色');
    else if (convId === 'game') s.push('推荐类似游戏','这个游戏怎么玩？','有什么隐藏玩法？');
    else if (convId === 'study') s.push('可以详细解释吗？','给我一个例题','有什么实际应用？');
    else if (botText.includes('```') || botText.includes('代码')) s.push('可以帮我解释这段代码吗？','给我一个更简单的例子','这段代码有什么注意事项？');
    else if (userText.length < 8) s.push('可以详细解释吗？','给我一个例子','这有什么实际应用？');
    else s.push('继续深入讲讲','能举个例子吗？','这和其他概念有什么关系？');
    return s.slice(0, 3);
  }
  function showFollowups(suggestions) {
    followupList.innerHTML = '';
    suggestions.forEach((text, i) => {
      const chip = document.createElement('button'); chip.className = 'followup-chip'; chip.textContent = text;
      chip.style.animationDelay = (i * 0.12) + 's';
      chip.addEventListener('click', (e) => { e.stopPropagation(); messageInput.value = text; messageInput.focus(); });
      followupList.appendChild(chip);
    });
  }
  function resetFollowups() { followupList.innerHTML = '<span class="followup-empty">AI 回覆後將顯示跟進建議...</span>'; }

  // ================= API =================
  async function callDeepSeekAPI(userMessage, imageBase64) {
    if (!apiKey) { addMessageToUI('bot', '⚠️ 请先输入并保存 DeepSeek API 密钥。'); return null; }
    const history = currentConversation.history.filter(m => !m.isHTML).slice(-8);
    const messages = history.map(m => {
      if (m.image) {
        return {
          role: m.role === 'user' ? 'user' : 'assistant',
          content: [
            { type: 'text', text: m.content || '（圖片）' },
            { type: 'image_url', image_url: { url: m.image } }
          ]
        };
      }
      return { role: m.role === 'user' ? 'user' : 'assistant', content: m.content };
    });

    let currentContent;
    if (imageBase64) {
      currentContent = [
        { type: 'text', text: userMessage || '請看這張圖片' },
        { type: 'image_url', image_url: { url: imageBase64 } }
      ];
    } else {
      currentContent = userMessage;
    }
    messages.push({ role: 'user', content: currentContent });

    try {
      const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
        body: JSON.stringify({ model:'deepseek-chat', messages, temperature:0.7, stream:false })
      });
      if (!response.ok) { const err = await response.json().catch(() => ({})); throw new Error(err.error?.message || `HTTP ${response.status}`); }
      const data = await response.json();
      const botReply = data.choices?.[0]?.message?.content;
      if (!botReply) throw new Error('API 返回内容为空'); return botReply;
    } catch (error) {
      let msg = '';
      if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) msg = '🌐 网络请求失败。可能是网络不通或浏览器阻挡。';
      else if (error.message.includes('401')) msg = '🔑 API 密钥无效或已过期。';
      else if (error.message.includes('402')) msg = '💰 帐户余额不足。';
      else msg = `❌ 请求失败：${error.message || '未知错误'}`;
      return msg;
    }
  }

  // ================= 文字融入按鈕 =================
  function mergeTextToButton(text) {
    return new Promise((resolve) => {
      if (savedPerf === 'low') { resolve(); return; }
      const inputRect = messageInput.getBoundingClientRect();
      const btnRect = sendBtn.getBoundingClientRect();
      const inputCx = inputRect.left + inputRect.width / 2;
      const inputCy = inputRect.top + inputRect.height / 2;
      const btnCx = btnRect.left + btnRect.width / 2;
      const btnCy = btnRect.top + btnRect.height / 2;
      const ghost = document.createElement('div');
      ghost.className = 'text-ghost';
      ghost.textContent = text || '🖼️';
      ghost.style.left = inputCx + 'px';
      ghost.style.top = inputCy + 'px';
      document.body.appendChild(ghost);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ghost.style.left = btnCx + 'px';
          ghost.style.top = btnCy + 'px';
          ghost.style.transform = 'translate(-50%,-50%) scale(0.15)';
          ghost.style.opacity = '0';
          ghost.style.filter = 'blur(6px)';
        });
      });
      setTimeout(() => { ghost.remove(); resolve(); }, 550);
    });
  }

  // ================= 發送 =================
  async function sendMessage() {
    if (isWaitingForResponse || !currentConversation) return;
    const text = messageInput.value.trim();
    const hasImage = !!pendingImageBase64;
    if (!text && !hasImage) { showToast('请输入消息或选择图片'); return; }

    const imageToSend = pendingImageBase64;
    messageInput.value = '';
    pendingImageBase64 = null;
    imagePreviewBar.classList.remove('show');
    renderImagePreview();

    sendBtn.classList.add('pulsing');
    setTimeout(() => sendBtn.classList.remove('pulsing'), 500);

    if (savedPerf !== 'low') {
      const btnRect = sendBtn.getBoundingClientRect();
      const cx = btnRect.left + btnRect.width / 2;
      const cy = btnRect.top + btnRect.height / 2;
      for (let i = 0; i < 2; i++) {
        setTimeout(() => {
          const ripple = document.createElement('div');
          ripple.className = 'energy-ripple';
          ripple.style.left = cx + 'px';
          ripple.style.top = cy + 'px';
          ripple.style.width = '60px';
          ripple.style.height = '60px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 900);
        }, i * 100);
      }
    }

    await mergeTextToButton(text || '🖼️');

    // 顯示用戶訊息
    addMessageToUI('user', text, false, true, imageToSend);
    currentConversation.history.push({ role:'user', content: text, image: imageToSend });

    if (!apiKey) {
      addMessageToUI('bot', '🔑 尚未设置 API 密钥，请先在顶部输入并保存密钥。');
      return;
    }

    isWaitingForResponse = true;
    sendBtn.disabled = true;
    messageInput.disabled = true;
    resetFollowups();
    showTypingIndicator();

    try {
      const reply = await callDeepSeekAPI(text, imageToSend);
      removeTypingIndicator();
      if (reply) {
        addMessageToUI('bot', reply, false, true);
        currentConversation.history.push({ role:'assistant', content: reply });
        const suggestions = generateFollowups(text, reply, currentConversation.id);
        showFollowups(suggestions);
        if (autoFollowupEnabled && suggestions.length > 0) {
          setTimeout(() => {
            if (!isWaitingForResponse && currentConversation) {
              messageInput.value = suggestions[0];
              sendMessage();
            }
          }, 1500);
        }
      } else addMessageToUI('bot', '⚠️ 未收到有效回复。');
    } catch (error) {
      removeTypingIndicator();
      addMessageToUI('bot', `⚠️ 发生错误: ${error.message || '未知错误'}`);
    } finally {
      isWaitingForResponse = false;
      sendBtn.disabled = false;
      messageInput.disabled = false;
      messageInput.focus();
    }
  }

  sendBtn.addEventListener('click', () => { if (isWaitingForResponse) return; sendMessage(); });
  messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
  apiKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveApiBtn.click(); });
  autoFollowupToggle.addEventListener('click', (e) => {
    e.stopPropagation(); autoFollowupEnabled = !autoFollowupEnabled;
    autoFollowupToggle.classList.toggle('on', autoFollowupEnabled);
    showToast(autoFollowupEnabled ? '🤖 自动追问已开启' : '自动追问已关闭', 1500);
  });

  renderConversationList();
})();
</script>
</body>
