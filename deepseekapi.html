<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeepSeek 聊天 · Q彈絲滑</title>

  <!-- Markdown 渲染 + 消毒 + 高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 20% 10%, #14213d 0%, #0b0f1a 55%, #05070d 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    /* ============ 主容器 ============ */
    .chat-container {
      width: 100%;
      max-width: 780px;
      height: 90vh;
      max-height: 820px;
      background: rgba(20, 25, 40, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(100, 180, 255, 0.18);
      border-radius: 42px;
      box-shadow:
        0 30px 60px -20px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(80, 160, 255, 0.08) inset,
        0 0 60px rgba(0, 150, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      animation: containerEnter 0.9s cubic-bezier(0.22, 1.2, 0.36, 1) both;
    }

    @keyframes containerEnter {
      0%   { opacity: 0; transform: scale(0.92) translateY(20px); }
      60%  { opacity: 1; transform: scale(1.015) translateY(-4px); }
      80%  { transform: scale(0.995) translateY(2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .chat-container:focus-within {
      border-color: rgba(0, 200, 255, 0.45);
      box-shadow:
        0 35px 65px -18px rgba(0, 150, 255, 0.3),
        0 0 0 1px rgba(0, 220, 255, 0.28) inset,
        0 0 60px rgba(0, 200, 255, 0.18);
    }

    /* ============ 頂部 ============ */
    .chat-header {
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.55);
      border-bottom: 1px solid rgba(70, 150, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .api-input-wrapper {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 100px;
      padding: 2px 2px 2px 20px;
      border: 1px solid rgba(120, 180, 255, 0.22);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .api-input-wrapper:focus-within {
      border-color: #4da6ff;
      box-shadow:
        0 0 0 4px rgba(77, 166, 255, 0.14),
        0 0 30px rgba(0, 140, 255, 0.22);
      background: rgba(10, 25, 45, 0.8);
      transform: scale(1.01);
    }

    .api-input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #eef5ff;
      font-size: 0.95rem;
      padding: 12px 0;
      letter-spacing: 0.3px;
      min-width: 0;
    }

    .api-input-wrapper input::placeholder {
      color: rgba(170, 210, 255, 0.42);
      font-weight: 300;
    }

    /* ============ 通用按鈕 ============ */
    button {
      background: none;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                  background 0.4s ease;
      user-select: none;
      letter-spacing: 0.2px;
    }

    /* ---- 保存按鈕 ---- */
    .save-btn {
      background: linear-gradient(135deg, #1b6aff, #00b4ff);
      border-radius: 100px;
      padding: 11px 20px;
      font-size: 0.85rem;
      box-shadow:
        0 8px 18px rgba(0, 120, 255, 0.32),
        0 0 0 0 rgba(0, 200, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 600;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      animation: btnBreath 3.2s ease-in-out infinite;
    }

    @keyframes btnBreath {
      0%, 100% { box-shadow: 0 8px 18px rgba(0, 120, 255, 0.32), 0 0 0 0 rgba(0, 200, 255, 0.5); }
      50%      { box-shadow: 0 8px 22px rgba(0, 150, 255, 0.5),  0 0 0 6px rgba(0, 200, 255, 0.08); }
    }

    .save-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.45), transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .save-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow:
        0 14px 26px rgba(0, 150, 255, 0.55),
        0 0 0 8px rgba(0, 180, 255, 0.1);
    }

    .save-btn:hover::after { opacity: 1; }

    .save-btn:active {
      transform: translateY(1px) scale(0.9);
      box-shadow:
        0 3px 8px rgba(0, 120, 255, 0.5),
        0 0 0 4px rgba(0, 200, 255, 0.25);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.15s ease;
    }

    /* ============ 訊息區 ============ */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 22px 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      background: radial-gradient(ellipse at 30% 10%, rgba(30, 70, 120, 0.18), transparent 70%);
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 100px;
      margin: 8px 0;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #4da6ff, #1b6aff);
      border-radius: 100px;
      transition: background 0.4s;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #7ec8ff, #4da6ff);
    }

    /* ============ 訊息氣泡（Q彈核心） ============ */
    .message {
      max-width: 85%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      will-change: transform, opacity;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
      animation: bubblePopRight 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
      animation: bubblePopLeft 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Q彈：從右側彈出（用戶） */
    @keyframes bubblePopRight {
      0%   { opacity: 0; transform: translateX(30px) scale(0.4) rotate(-4deg); }
      50%  { opacity: 1; transform: translateX(-6px) scale(1.08) rotate(1.5deg); }
      70%  { transform: translateX(3px) scale(0.96) rotate(-0.6deg); }
      85%  { transform: translateX(-1px) scale(1.015) rotate(0.2deg); }
      100% { opacity: 1; transform: translateX(0) scale(1) rotate(0); }
    }

    /* Q彈：從左側彈出（AI） */
    @keyframes bubblePopLeft {
      0%   { opacity: 0; transform: translateX(-30px) scale(0.4) rotate(4deg); }
      50%  { opacity: 1; transform: translateX(6px) scale(1.08) rotate(-1.5deg); }
      70%  { transform: translateX(-3px) scale(0.96) rotate(0.6deg); }
      85%  { transform: translateX(1px) scale(1.015) rotate(-0.2deg); }
      100% { opacity: 1; transform: translateX(0) scale(1) rotate(0); }
    }

    /* 氣泡本體：完全圓滑 */
    .bubble {
      padding: 14px 22px;
      border-radius: 28px;            /* 基礎圓角極大 */
      font-size: 0.98rem;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      letter-spacing: 0.2px;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.5s ease;
      position: relative;
    }

    /* 用超大字體半徑讓尾巴也變圓（不用 clip-path 避免尖角） */
    .message.user .bubble {
      background: linear-gradient(135deg, #0b6eff, #00a2ff);
      color: white;
      border-radius: 30px 30px 12px 30px;   /* 右下角小圓，依然圓滑 */
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 14px 24px -10px rgba(0, 120, 255, 0.55);
    }

    .message.bot .bubble {
      background: rgba(32, 44, 64, 0.85);
      color: #e6f0ff;
      border-radius: 30px 30px 30px 12px;   /* 左下角小圓，依然圓滑 */
      border: 1px solid rgba(80, 160, 255, 0.22);
      box-shadow: 0 14px 24px -10px rgba(0, 0, 0, 0.6);
    }

    /* 氣泡 hover 有輕微 Q 彈 */
    .bubble:hover {
      transform: scale(1.012) translateY(-1px);
      box-shadow: 0 16px 28px -10px rgba(0, 150, 255, 0.35);
    }

    .message .time {
      font-size: 0.7rem;
      color: rgba(180, 210, 255, 0.5);
      margin-top: 6px;
      margin-left: 10px;
      margin-right: 10px;
      letter-spacing: 0.3px;
    }

    /* ============ 底部輸入 ============ */
    .chat-footer {
      padding: 16px 22px 20px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 18, 30, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(70, 150, 255, 0.12);
    }

    .chat-footer input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(120, 180, 255, 0.22);
      border-radius: 100px;
      padding: 16px 24px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .chat-footer input:focus {
      border-color: #4da6ff;
      box-shadow:
        0 0 0 5px rgba(77, 166, 255, 0.14),
        0 0 30px rgba(0, 150, 255, 0.22);
      background: rgba(10, 25, 45, 0.8);
      transform: scale(1.015);
    }

    .chat-footer input::placeholder {
      color: rgba(170, 210, 255, 0.42);
      font-weight: 300;
    }

    /* ============ 發送按鈕（Q彈 + 光暈） ============ */
    .send-btn {
      background: linear-gradient(145deg, #0b6eff, #00a2ff);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      box-shadow:
        0 10px 22px rgba(0, 120, 255, 0.4),
        0 0 0 0 rgba(0, 180, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
      color: white;
      position: relative;
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                  background 0.4s ease;
      animation: sendPulse 2.8s ease-in-out infinite;
    }

    @keyframes sendPulse {
      0%, 100% {
        box-shadow: 0 10px 22px rgba(0, 120, 255, 0.4),
                    0 0 0 0 rgba(0, 180, 255, 0.55);
      }
      50% {
        box-shadow: 0 10px 26px rgba(0, 150, 255, 0.55),
                    0 0 0 9px rgba(0, 180, 255, 0.08);
      }
    }

    .send-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.55), transparent 70%);
      opacity: 0;
      transition: opacity 0.5s;
    }

    /* 內部箭頭圖標自繪（用文字） */
    .send-btn .arrow {
      display: inline-block;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: translateX(1px);
    }

    .send-btn:hover {
      transform: scale(1.12) translateY(-3px) rotate(-4deg);
      box-shadow:
        0 18px 32px rgba(0, 150, 255, 0.6),
        0 0 0 12px rgba(0, 170, 255, 0.1);
    }

    .send-btn:hover::before { opacity: 1; }

    .send-btn:hover .arrow {
      transform: translateX(4px) scale(1.08);
    }

    .send-btn:active {
      transform: scale(0.82) rotate(6deg);
      box-shadow:
        0 4px 12px rgba(0, 120, 255, 0.6),
        0 0 0 6px rgba(0, 200, 255, 0.25);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.15s ease;
    }

    /* ============ 打字指示器（波浪彈跳） ============ */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 22px;
      background: rgba(40, 60, 90, 0.8);
      border-radius: 30px 30px 30px 14px;
      width: fit-content;
      border: 1px solid rgba(80, 160, 255, 0.28);
      box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      animation: bubblePopLeft 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: linear-gradient(135deg, #7ec8ff, #4da6ff);
      border-radius: 50%;
      display: inline-block;
      animation: typingBounce 1.5s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 8px rgba(77, 166, 255, 0.6);
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
      30%           { transform: translateY(-9px) scale(1.3); opacity: 1; }
    }

    /* ============ Markdown 內容樣式（全部圓滑） ============ */
    .bubble p { margin: 0 0 8px 0; }
    .bubble p:last-child { margin-bottom: 0; }

    .bubble strong {
      color: #7ec8ff;
      font-weight: 700;
    }

    .bubble em {
      color: #a8d8ff;
      font-style: italic;
    }

    .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      margin: 12px 0 8px;
      color: #b8e0ff;
      font-weight: 600;
      line-height: 1.4;
    }
    .bubble h1 { font-size: 1.2rem; }
    .bubble h2 { font-size: 1.1rem; }
    .bubble h3 { font-size: 1rem; }
    .bubble h4 { font-size: 0.95rem; }

    .bubble ul, .bubble ol {
      margin: 8px 0;
      padding-left: 24px;
    }
    .bubble li { margin: 5px 0; }
    .bubble ul li::marker { color: #4da6ff; }
    .bubble ol li::marker { color: #4da6ff; font-weight: 600; }

    /* 行內程式碼：圓滑 */
    .bubble code:not(pre code) {
      background: rgba(0, 100, 200, 0.28);
      padding: 3px 8px;
      border-radius: 8px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 0.88em;
      color: #9fd5ff;
      border: 1px solid rgba(80, 160, 255, 0.15);
    }

    /* 程式碼區塊：大圓角 */
    .bubble pre {
      background: rgba(0, 0, 0, 0.5) !important;
      border: 1px solid rgba(80, 160, 255, 0.22);
      border-radius: 16px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
      font-size: 0.85rem;
      box-shadow: inset 0 0 20px rgba(0, 100, 200, 0.08);
    }
    .bubble pre code {
      background: transparent !important;
      padding: 0;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      color: #e6f0ff;
      border: none;
    }
    .bubble pre::-webkit-scrollbar { height: 6px; }
    .bubble pre::-webkit-scrollbar-thumb {
      background: rgba(77, 166, 255, 0.5);
      border-radius: 100px;
    }

    /* 引用區塊：圓滑邊 */
    .bubble blockquote {
      border-left: 4px solid #4da6ff;
      border-radius: 0 12px 12px 0;
      padding: 8px 14px;
      margin: 10px 0;
      color: #a8c8e8;
      font-style: italic;
      background: rgba(0, 100, 200, 0.1);
    }

    /* 表格：圓滑邊框 */
    .bubble table {
      border-collapse: separate;
      border-spacing: 0;
      margin: 10px 0;
      font-size: 0.9rem;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(80, 160, 255, 0.28);
    }
    .bubble th, .bubble td {
      border: none;
      border-bottom: 1px solid rgba(80, 160, 255, 0.18);
      border-right: 1px solid rgba(80, 160, 255, 0.18);
      padding: 8px 14px;
    }
    .bubble th:last-child, .bubble td:last-child { border-right: none; }
    .bubble tr:last-child td { border-bottom: none; }
    .bubble th {
      background: rgba(0, 100, 200, 0.28);
      color: #bfe2ff;
      font-weight: 600;
    }
    .bubble tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* 連結：圓滑下劃線 */
    .bubble a {
      color: #4da6ff;
      text-decoration: none;
      border-bottom: 1.5px dashed rgba(77, 166, 255, 0.5);
      transition: color 0.3s, border-color 0.3s;
      padding-bottom: 1px;
    }
    .bubble a:hover {
      color: #7ec8ff;
      border-bottom-color: #7ec8ff;
      border-bottom-style: solid;
    }

    /* 水平線 */
    .bubble hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(77, 166, 255, 0.4), transparent);
      margin: 14px 0;
      border-radius: 100px;
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%) translateY(30px) scale(0.9);
      background: rgba(20, 35, 60, 0.95);
      backdrop-filter: blur(14px);
      padding: 12px 28px;
      border-radius: 100px;
      color: #bfe2ff;
      font-size: 0.9rem;
      border: 1px solid rgba(0, 180, 255, 0.35);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* 禁用狀態 */
    .send-btn:disabled, .save-btn:disabled {
      opacity: 0.5;
      transform: scale(0.96);
      pointer-events: none;
      filter: grayscale(0.4);
      animation: none;
    }

    .chat-footer input:disabled {
      opacity: 0.55;
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(120, 180, 255, 0.1);
      cursor: not-allowed;
    }

    /* 小螢幕 */
    @media (max-width: 520px) {
      .chat-container { height: 94vh; border-radius: 32px; }
      .chat-header { padding: 14px 16px; }
      .message { max-width: 92%; }
      .bubble { padding: 12px 18px; font-size: 0.92rem; border-radius: 24px; }
      .message.user .bubble { border-radius: 26px 26px 10px 26px; }
      .message.bot .bubble { border-radius: 26px 26px 26px 10px; }
      .chat-footer { padding: 12px 16px 16px; }
      .chat-footer input { padding: 14px 20px; }
      .send-btn { width: 52px; height: 52px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- 頭部 -->
  <div class="chat-header">
    <div class="api-input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="輸入 DeepSeek API 密鑰..." autocomplete="off" spellcheck="false">
    </div>
    <button class="save-btn" id="saveApiBtn">保存密鑰</button>
  </div>

  <!-- 訊息區 -->
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="bubble">你好！我是 DeepSeek 助手 ✨ 請先輸入 API 密鑰，然後我們就可以開始聊天了！</div>
      <div class="time">剛剛</div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="chat-footer">
    <input type="text" id="messageInput" placeholder="輸入訊息..." autocomplete="off" spellcheck="false">
    <button class="send-btn" id="sendBtn"><span class="arrow">➤</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiBtn = document.getElementById('saveApiBtn');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const toastEl = document.getElementById('toast');

    let apiKey = localStorage.getItem('deepseek_api_key') || '';
    let isWaitingForResponse = false;

    if (apiKey) apiKeyInput.value = apiKey;

    // 設定 marked 選項
    marked.setOptions({
      breaks: true,      // 單個換行也換行
      gfm: true,         // GitHub 風格
      headerIds: false,
      mangle: false
    });

    // Toast
    function showToast(text, duration = 2000) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, duration);
    }

    // 保存密鑰
    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        showToast('密鑰不能為空', 1800);
        return;
      }
      apiKey = key;
      localStorage.setItem('deepseek_api_key', key);
      showToast('✅ API 密鑰已保存', 1600);
      saveApiBtn.style.transform = 'scale(0.88)';
      setTimeout(() => { saveApiBtn.style.transform = ''; }, 180);
    }

    // 添加訊息（含 Markdown 渲染）
    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', role);

      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('bubble');

      if (role === 'bot') {
        try {
          const rawHtml = marked.parse(content);
          bubbleDiv.innerHTML = DOMPurify.sanitize(rawHtml);
          // 高亮程式碼
          bubbleDiv.querySelectorAll('pre code').forEach((block) => {
            if (window.hljs) hljs.highlightElement(block);
          });
        } catch (e) {
          bubbleDiv.textContent = content;
        }
      } else {
        bubbleDiv.textContent = content;
      }

      const timeDiv = document.createElement('div');
      timeDiv.classList.add('time');
      const now = new Date();
      timeDiv.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      messageDiv.appendChild(bubbleDiv);
      messageDiv.appendChild(timeDiv);
      chatMessages.appendChild(messageDiv);

      requestAnimationFrame(() => {
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
      });

      return messageDiv;
    }

    // 打字指示器
    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.classList.add('message', 'bot');
      typingDiv.id = 'typingIndicator';

      const wrapper = document.createElement('div');
      wrapper.classList.add('typing-indicator');
      wrapper.innerHTML = '<span></span><span></span><span></span>';

      typingDiv.appendChild(wrapper);
      chatMessages.appendChild(typingDiv);

      requestAnimationFrame(() => {
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
      });
      return typingDiv;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // 呼叫 DeepSeek API
    async function callDeepSeekAPI(userMessage) {
      if (!apiKey) {
        addMessage('bot', '⚠️ 請先輸入並保存 DeepSeek API 密鑰。');
        return null;
      }

      const url = 'https://api.deepseek.com/v1/chat/completions';
      const requestBody = {
        model: 'deepseek-chat',
        messages: [{ role: 'user', content: userMessage }],
        temperature: 0.7,
        stream: false
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          const errorMsg = errorData.error?.message || `HTTP ${response.status} ${response.statusText}`;
          throw new Error(errorMsg);
        }

        const data = await response.json();
        const botReply = data.choices?.[0]?.message?.content;
        if (!botReply) throw new Error('API 返回內容為空');
        return botReply;

      } catch (error) {
        console.error('DeepSeek API 錯誤詳情:', error);

        let friendlyMsg = '';
        if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
          friendlyMsg = '🌐 網路請求失敗。可能原因：\n' +
                        '① 用 `file://` 直接打開檔案（需改用本機伺服器 `http://localhost`）\n' +
                        '② 網路無法連上 `api.deepseek.com`\n' +
                        '③ 瀏覽器擴充功能阻擋了請求';
        } else if (error.message.includes('401')) {
          friendlyMsg = '🔑 API 密鑰無效或已過期，請重新申請。';
        } else if (error.message.includes('402')) {
          friendlyMsg = '💰 帳戶餘額不足，請前往 DeepSeek 平台充值。';
        } else if (error.message.includes('429')) {
          friendlyMsg = '⏳ 請求太頻繁，請稍後再試。';
        } else {
          friendlyMsg = `❌ 請求失敗：${error.message || '未知錯誤'}`;
        }
        return friendlyMsg;
      }
    }

    // 發送
    async function sendMessage() {
      if (isWaitingForResponse) {
        showToast('請等待當前回覆完成', 1200);
        return;
      }

      const text = messageInput.value.trim();
      if (!text) {
        showToast('請輸入訊息內容', 1200);
        return;
      }

      messageInput.value = '';
      addMessage('user', text);

      if (!apiKey) {
        addMessage('bot', '🔑 尚未設定 API 密鑰，請先在頂部輸入並保存密鑰。');
        return;
      }

      isWaitingForResponse = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;

      showTypingIndicator();

      try {
        const reply = await callDeepSeekAPI(text);
        removeTypingIndicator();
        if (reply) addMessage('bot', reply);
        else addMessage('bot', '⚠️ 未收到有效回覆。');
      } catch (error) {
        removeTypingIndicator();
        addMessage('bot', `⚠️ 發生錯誤: ${error.message || '未知錯誤'}`);
      } finally {
        isWaitingForResponse = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    // 事件綁定
    saveApiBtn.addEventListener('click', saveApiKey);
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveApiKey();
      }
    });

    window.addEventListener('load', () => {
      if (apiKey) showToast('已載入保存的 API 密鑰', 1500);
      messageInput.focus();
    });

    chatMessages.scrollTop = chatMessages.scrollHeight;
  })();
</script>
</body>
</html>
