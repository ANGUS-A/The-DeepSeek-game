<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友善版即時編輯器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    display:flex; flex-direction:column; height:100vh;
    background:#1e1e1e; font-family:'Segoe UI','Microsoft JhengHei',sans-serif; color:#ddd;
  }

  /* ── 頂部工具列 ── */
  .toolbar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 16px; background:#2d2d2d; border-bottom:1px solid #444;
    font-size:13px;
  }
  .toolbar .title { font-weight:600; color:#ccc; margin-right:auto; }
  .toolbar button, .toolbar select {
    background:#3c3c3c; color:#ddd; border:1px solid #555;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
    transition:background .15s;
  }
  .toolbar button:hover, .toolbar select:hover { background:#4a4a4a; }
  .toolbar button.danger { border-color:#7a3a3a; color:#e88; }
  .toolbar button.danger:hover { background:#5a2a2a; }

  /* ── 提示列 ── */
  .hint-bar {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:8px 16px; background:#252526; border-bottom:1px solid #3a3a3a;
    font-size:12px; color:#999;
  }
  .hint-bar .badge {
    background:#3c3c3c; padding:2px 10px; border-radius:20px; color:#bbb;
  }
  .hint-bar .warn { color:#e6b800; }

  /* ── 主體雙欄 ── */
  .split { display:flex; flex:1; overflow:hidden; }
  .pane { width:50%; display:flex; flex-direction:column; overflow:hidden; }
  .pane.left  { border-right:2px solid #3c3c3c; }
  .pane-header {
    padding:8px 16px; background:#2a2a2a; font-size:13px; font-weight:600;
    color:#aaa; border-bottom:1px solid #3a3a3a;
    display:flex; justify-content:space-between; align-items:center;
  }
  .pane-header .tag {
    background:#3c3c3c; padding:2px 10px; border-radius:20px;
    font-size:11px; color:#b0b0b0; font-weight:normal;
  }

  .editor-wrap { flex:1; position:relative; overflow:hidden; }
  #codeEditor {
    width:100%; height:100%; padding:16px; background:#1e1e1e; color:#d4d4d4;
    border:none; outline:none; resize:none;
    font-family:'Consolas','Monaco','Courier New',monospace;
    font-size:15px; line-height:1.6; tab-size:2; white-space:pre;
    overflow:auto; caret-color:#569cd6;
  }
  #codeEditor::selection { background:#264f78; }
  #codeEditor::-webkit-scrollbar { width:10px; height:10px; }
  #codeEditor::-webkit-scrollbar-track { background:#252526; }
  #codeEditor::-webkit-scrollbar-thumb { background:#3e3e3e; border-radius:5px; }
  #codeEditor::-webkit-scrollbar-thumb:hover { background:#4e4e4e; }

  #previewFrame { width:100%; flex:1; border:none; background:#fff; }

  /* ── 錯誤提示 ── */
  .issues {
    max-height:100px; overflow-y:auto; padding:6px 16px;
    background:#2a1f1f; border-top:1px solid #5a3a3a;
    font-size:12px; color:#e8a0a0; display:none;
  }
  .issues.show { display:block; }
  .issues div { padding:2px 0; }

  /* ── 自動完成下拉 ── */
  .autocomplete {
    position:absolute; background:#252526; border:1px solid #454545;
    border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.5);
    max-height:240px; overflow-y:auto; width:280px; z-index:1000;
    display:none; font-family:'Consolas','Monaco',monospace; font-size:14px;
    color:#d4d4d4; padding:6px 0;
  }
  .autocomplete::-webkit-scrollbar { width:8px; }
  .autocomplete::-webkit-scrollbar-thumb { background:#3e3e3e; border-radius:4px; }
  .ac-item {
    padding:6px 16px; cursor:pointer; display:flex; align-items:center;
    gap:10px; transition:background .1s;
  }
  .ac-item:hover, .ac-item.selected { background:#094771; }
  .ac-item .ic { font-size:14px; width:20px; text-align:center; color:#569cd6; }
  .ac-item .lb { flex:1; }
  .ac-item .ty {
    font-size:11px; color:#888; background:#333;
    padding:1px 8px; border-radius:12px;
  }

  @media (max-width:700px) {
    .split { flex-direction:column; }
    .pane { width:100%; height:50%; }
    .pane.left { border-right:none; border-bottom:2px solid #3c3c3c; }
  }
</style>
</head>
<body>

<!-- 工具列 -->
<div class="toolbar">
  <span class="title">⚡ 友善版即時編輯器</span>
  <select id="exampleSelect">
    <option value="">📂 載入範例…</option>
    <option value="card">卡片</option>
    <option value="form">表單</option>
    <option value="nav">導覽列</option>
    <option value="btn">動畫按鈕</option>
    <option value="clock">時鐘</option>
  </select>
  <button id="btnReset">🔄 載入預設範例</button>
  <button id="btnClear" class="danger">🗑️ 清空</button>
</div>

<!-- 提示列 -->
<div class="hint-bar">
  <span class="badge">📝 HTML / CSS / JS 混合模式</span>
  <span>⚠️ CSS 請包在 <code>&lt;style&gt;</code> 內</span>
  <span>JS 請包在 <code>&lt;script&gt;</code> 內</span>
  <span class="warn" id="saveStatus">💾 自動儲存中…</span>
</div>

<!-- 雙欄主體 -->
<div class="split">
  <!-- 左：編輯區 -->
  <div class="pane left">
    <div class="pane-header">
      <span>📝 原始碼</span>
      <span class="tag">輸入 str / div / color 試試</span>
    </div>
    <div class="editor-wrap">
      <textarea id="codeEditor" spellcheck="false"></textarea>
      <div id="autocomplete" class="autocomplete"></div>
    </div>
    <div id="issues" class="issues"></div>
  </div>

  <!-- 右：預覽區 -->
  <div class="pane">
    <div class="pane-header">
      <span>👁️ 即時預覽</span>
      <span class="tag">Live</span>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
  </div>
</div>

<script>
(function(){
  "use strict";

  const editor      = document.getElementById('codeEditor');
  const preview     = document.getElementById('previewFrame');
  const acBox       = document.getElementById('autocomplete');
  const issuesBox   = document.getElementById('issues');
  const saveStatus  = document.getElementById('saveStatus');
  const exampleSel  = document.getElementById('exampleSelect');
  const btnReset    = document.getElementById('btnReset');
  const btnClear    = document.getElementById('btnClear');

  const STORAGE_KEY = 'friendly_editor_code';

  /* ══════════════════════════════════════
     1. 預設範例 & 範例庫
     ══════════════════════════════════════ */
  const DEFAULT_CODE = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>歡迎使用</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,.3);
      text-align: center;
    }
    h1 { color: #4a3f6b; margin-top: 0; }
    button {
      background: #764ba2; color: white; border: none;
      padding: 12px 28px; font-size: 1.1rem; border-radius: 60px;
      cursor: pointer; transition: transform .2s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 歡迎使用！</h1>
    <p>試著修改這段文字，右邊會即時更新。</p>
    <button onclick="alert('你點了我！🎉')">點我</button>
  </div>
</body>
</html>`;

  const EXAMPLES = {
    card: DEFAULT_CODE,
    form: `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding:40px;margin:0}
.form{background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.1);width:320px}
label{display:block;margin:12px 0 4px;font-size:14px;color:#555}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
button{margin-top:16px;width:100%;padding:12px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
</style></head><body>
<form class="form" onsubmit="alert('送出成功！');return false">
  <h2 style="margin:0 0 8px">聯絡我們</h2>
  <label>姓名</label><input type="text" placeholder="你的名字">
  <label>Email</label><input type="email" placeholder="you@example.com">
  <label>訊息</label><textarea rows="3" placeholder="想說的話…"></textarea>
  <button type="submit">送出</button>
</form>
</body></html>`,
    nav: `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{margin:0;font-family:sans-serif}
nav{display:flex;align-items:center;gap:24px;padding:16px 32px;background:#111;color:#fff}
nav .logo{font-weight:700;font-size:18px;margin-right:auto}
nav a{color:#ccc;text-decoration:none;font-size:14px;transition:color .2s}
nav a:hover{color:#fff}
nav .cta{background:#4f46e5;padding:8px 18px;border-radius:20px;color:#fff}
.hero{padding:80px 32px;text-align:center;background:#f8fafc}
.hero h1{font-size:42px;margin:0 0 12px}
.hero p{color:#666;font-size:18px}
</style></head><body>
<nav>
  <span class="logo">MySite</span>
  <a href="#">首頁</a><a href="#">功能</a><a href="#">定價</a>
  <a href="#" class="cta">開始使用</a>
</nav>
<div class="hero">
  <h1>打造你的下一個專案</h1>
  <p>簡單、快速、好看。</p>
</div>
</body></html>`,
    btn: `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a}
.btn{
  position:relative;padding:16px 40px;font-size:18px;font-weight:600;
  color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);
  border:none;border-radius:60px;cursor:pointer;overflow:hidden;
  transition:transform .3s,box-shadow .3s;
}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 30px rgba(99,102,241,.5)}
.btn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transition:left .5s;
}
.btn:hover::before{left:100%}
</style></head><body>
<button class="btn" onclick="alert('動畫按鈕！')">Hover Me</button>
</body></html>`,
    clock: `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a}
.clock{
  font-family:'Consolas',monospace;font-size:72px;font-weight:700;
  color:#38bdf8;text-shadow:0 0 30px rgba(56,189,248,.6);
  background:#1e293b;padding:40px 60px;border-radius:24px;
  border:1px solid #334155;
}
</style></head><body>
<div class="clock" id="clock">--:--:--</div>
<script>
  function tick(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    document.getElementById('clock').textContent =
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);
<\/script>
</body></html>`
  };

  /* ══════════════════════════════════════
     2. 預覽 & 錯誤檢查
     ══════════════════════════════════════ */
  function updatePreview() {
    const code = editor.value;
    const doc = preview.contentDocument || preview.contentWindow.document;
    doc.open(); doc.write(code); doc.close();
  }

  function checkCode(code) {
    const issues = [];
    if (!code.trim()) return issues;

    // CSS 語法但沒有 <style>
    const hasStyleTag = /<style[\s>]/i.test(code);
    const looksLikeCSS = /[a-z-]+\s*:\s*[^;]+;/i.test(code);
    if (looksLikeCSS && !hasStyleTag) {
      issues.push('⚠️ 偵測到 CSS 語法，但沒有 <style> 標籤包住');
    }

    // <script> 但沒有結尾
    if (/<script[\s>]/i.test(code) && !/<\/script>/i.test(code)) {
      issues.push('⚠️ <script> 標籤沒有正確閉合');
    }

    // 括號數量
    const open  = (code.match(/{/g) || []).length;
    const close = (code.match(/}/g) || []).length;
    if (open !== close) {
      issues.push(`⚠️ 大括號數量不對：${open} 個 { 對上 ${close} 個 }`);
    }

    // 常見：img 少引號
    if (/<img[^>]+src\s*=\s*[^"'\s>][^>]*>/i.test(code)) {
      issues.push('💡 <img> 的 src 建議用引號包起來');
    }

    return issues;
  }

  function renderIssues(issues) {
    if (!issues.length) {
      issuesBox.classList.remove('show');
      issuesBox.innerHTML = '';
      return;
    }
    issuesBox.classList.add('show');
    issuesBox.innerHTML = issues.map(t => `<div>${t}</div>`).join('');
  }

  /* ══════════════════════════════════════
     3. 自動儲存 (localStorage)
     ══════════════════════════════════════ */
  let saveTimer = null;
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveStatus.textContent = '💾 儲存中…';
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, editor.value);
        saveStatus.textContent = '✅ 已自動儲存';
        setTimeout(() => { saveStatus.textContent = '💾 自動儲存已開啟'; }, 1500);
      } catch(e) {
        saveStatus.textContent = '⚠️ 無法儲存 (瀏覽器限制)';
      }
    }, 800);
  }

  function loadSaved() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null && saved.trim() !== '') return saved;
    } catch(e) {}
    return null;
  }

  /* ══════════════════════════════════════
     4. 智能提示 (自動完成)
     ══════════════════════════════════════ */
  const SUGGESTIONS = [
    // HTML 標籤
    {label:'div',type:'HTML'},{label:'span',type:'HTML'},{label:'p',type:'HTML'},
    {label:'a',type:'HTML'},{label:'img',type:'HTML'},{label:'ul',type:'HTML'},
    {label:'ol',type:'HTML'},{label:'li',type:'HTML'},{label:'h1',type:'HTML'},
    {label:'h2',type:'HTML'},{label:'h3',type:'HTML'},{label:'header',type:'HTML'},
    {label:'footer',type:'HTML'},{label:'section',type:'HTML'},{label:'article',type:'HTML'},
    {label:'nav',type:'HTML'},{label:'main',type:'HTML'},{label:'aside',type:'HTML'},
    {label:'button',type:'HTML'},{label:'input',type:'HTML'},{label:'form',type:'HTML'},
    {label:'label',type:'HTML'},{label:'select',type:'HTML'},{label:'option',type:'HTML'},
    {label:'textarea',type:'HTML'},{label:'table',type:'HTML'},{label:'tr',type:'HTML'},
    {label:'td',type:'HTML'},{label:'th',type:'HTML'},{label:'style',type:'HTML'},
    {label:'script',type:'HTML'},{label:'link',type:'HTML'},{label:'meta',type:'HTML'},
    {label:'title',type:'HTML'},{label:'head',type:'HTML'},{label:'body',type:'HTML'},
    {label:'html',type:'HTML'},{label:'br',type:'HTML'},{label:'hr',type:'HTML'},
    {label:'strong',type:'HTML'},{label:'em',type:'HTML'},{label:'code',type:'HTML'},
    {label:'pre',type:'HTML'},{label:'iframe',type:'HTML'},{label:'canvas',type:'HTML'},
    {label:'svg',type:'HTML'},{label:'video',type:'HTML'},{label:'audio',type:'HTML'},
    // HTML 屬性
    {label:'class',type:'屬性'},{label:'id',type:'屬性'},{label:'style',type:'屬性'},
    {label:'src',type:'屬性'},{label:'href',type:'屬性'},{label:'alt',type:'屬性'},
    {label:'title',type:'屬性'},{label:'width',type:'屬性'},{label:'height',type:'屬性'},
    {label:'type',type:'屬性'},{label:'value',type:'屬性'},{label:'placeholder',type:'屬性'},
    {label:'onclick',type:'屬性'},{label:'onchange',type:'屬性'},{label:'onsubmit',type:'屬性'},
    // CSS
    {label:'color',type:'CSS'},{label:'background',type:'CSS'},{label:'background-color',type:'CSS'},
    {label:'font-size',type:'CSS'},{label:'font-family',type:'CSS'},{label:'font-weight',type:'CSS'},
    {label:'text-align',type:'CSS'},{label:'margin',type:'CSS'},{label:'padding',type:'CSS'},
    {label:'border',type:'CSS'},{label:'border-radius',type:'CSS'},{label:'display',type:'CSS'},
    {label:'position',type:'CSS'},{label:'width',type:'CSS'},{label:'height',type:'CSS'},
    {label:'flex',type:'CSS'},{label:'flex-direction',type:'CSS'},{label:'justify-content',type:'CSS'},
    {label:'align-items',type:'CSS'},{label:'gap',type:'CSS'},{label:'grid',type:'CSS'},
    {label:'box-shadow',type:'CSS'},{label:'transition',type:'CSS'},{label:'transform',type:'CSS'},
    {label:'opacity',type:'CSS'},{label:'overflow',type:'CSS'},{label:'z-index',type:'CSS'},
    {label:'cursor',type:'CSS'},
    // JS
    {label:'string',type:'JS'},{label:'number',type:'JS'},{label:'boolean',type:'JS'},
    {label:'object',type:'JS'},{label:'array',type:'JS'},{label:'function',type:'JS'},
    {label:'return',type:'JS'},{label:'if',type:'JS'},{label:'else',type:'JS'},
    {label:'for',type:'JS'},{label:'while',type:'JS'},{label:'switch',type:'JS'},
    {label:'try',type:'JS'},{label:'catch',type:'JS'},{label:'new',type:'JS'},
    {label:'this',type:'JS'},{label:'typeof',type:'JS'},{label:'class',type:'JS'},
    {label:'import',type:'JS'},{label:'export',type:'JS'},{label:'async',type:'JS'},
    {label:'await',type:'JS'},{label:'let',type:'JS'},{label:'const',type:'JS'},
    {label:'var',type:'JS'},{label:'console.log',type:'JS'},{label:'alert',type:'JS'},
    {label:'document',type:'JS'},{label:'window',type:'JS'},{label:'querySelector',type:'JS'},
    {label:'getElementById',type:'JS'},{label:'addEventListener',type:'JS'},
    {label:'setTimeout',type:'JS'},{label:'setInterval',type:'JS'},{label:'Math',type:'JS'},
    {label:'Date',type:'JS'},{label:'JSON',type:'JS'},{label:'parseInt',type:'JS'},
    {label:'map',type:'JS'},{label:'filter',type:'JS'},{label:'reduce',type:'JS'},
    {label:'forEach',type:'JS'},{label:'push',type:'JS'},{label:'pop',type:'JS'},
    {label:'split',type:'JS'},{label:'join',type:'JS'},{label:'replace',type:'JS'},
    {label:'toUpperCase',type:'JS'},{label:'toLowerCase',type:'JS'},{label:'trim',type:'JS'},
    {label:'includes',type:'JS'},{label:'indexOf',type:'JS'},{label:'length',type:'JS'},
  ];

  let acVisible = false;
  let acIndex = -1;
  let acItems = [];
  let acTimer = null;

  function getWordBeforeCursor() {
    const pos = editor.selectionStart;
    const before = editor.value.substring(0, pos);
    const m = before.match(/[\w$]+$/);
    return m ? m[0] : '';
  }

  function positionAutocomplete() {
    const pos = editor.selectionStart;
    const before = editor.value.substring(0, pos);
    const lines = before.split('\n');
    const line = lines.length;
    const col = (lines[lines.length-1] || '').length;
    const lh = 24, pt = 16, pl = 16, cw = 9;
    let top = pt + (line-1)*lh - editor.scrollTop;
    let left = pl + col*cw - editor.scrollLeft;
    const wrap = editor.parentElement;
    const w = wrap.clientWidth;
    const boxW = 280;
    if (left + boxW > w) left = w - boxW - 10;
    if (left < 10) left = 10;
    const boxH = Math.min(240, acItems.length*32+12);
    if (top + boxH > wrap.clientHeight) top = top - boxH - 10;
    if (top < 10) top = 10;
    acBox.style.left = left + 'px';
    acBox.style.top = top + 'px';
  }

  function renderAC() {
    if (!acItems.length) { hideAC(); return; }
    const icons = {HTML:'&#60;&#62;', '屬性':'#', CSS:'{}', JS:'()'};
    acBox.innerHTML = acItems.map((it,i) => {
      const sel = i === acIndex ? 'selected' : '';
      return `<div class="ac-item ${sel}" data-i="${i}">
        <span class="ic">${icons[it.type]||'•'}</span>
        <span class="lb">${it.label}</span>
        <span class="ty">${it.type}</span>
      </div>`;
    }).join('');
    acBox.querySelectorAll('.ac-item').forEach(el => {
      el.addEventListener('click', () => applyAC(parseInt(el.dataset.i,10)));
    });
    positionAutocomplete();
    acBox.style.display = 'block';
    acVisible = true;
  }

  function hideAC() {
    acBox.style.display = 'none';
    acVisible = false;
    acItems = [];
    acIndex = -1;
  }

  function applyAC(i) {
    if (i < 0 || i >= acItems.length) return;
    const item = acItems[i];
    const pos = editor.selectionStart;
    const word = getWordBeforeCursor();
    const start = pos - word.length;
    let insert = item.label;
    // 若在 < 後面且是 HTML 標籤，補上 >
    if (item.type === 'HTML' && editor.value.charAt(start-1) === '<') {
      insert = item.label + '>';
    }
    editor.value = editor.value.substring(0, start) + insert + editor.value.substring(pos);
    editor.selectionStart = editor.selectionEnd = start + insert.length;
    editor.dispatchEvent(new Event('input'));
    hideAC();
  }

  function updateAC() {
    if (document.activeElement !== editor) { hideAC(); return; }
    const word = getWordBeforeCursor();
    if (!word) { hideAC(); return; }
    const lower = word.toLowerCase();
    acItems = SUGGESTIONS
      .filter(s => s.label.toLowerCase().startsWith(lower))
      .slice(0, 15);
    if (!acItems.length) { hideAC(); return; }
    acIndex = 0;
    renderAC();
  }

  function scheduleAC() {
    if (acTimer) clearTimeout(acTimer);
    acTimer = setTimeout(updateAC, 100);
  }

  /* ══════════════════════════════════════
     5. 事件綁定
     ══════════════════════════════════════ */
  editor.addEventListener('input', () => {
    updatePreview();
    renderIssues(checkCode(editor.value));
    scheduleSave();
    scheduleAC();
  });

  editor.addEventListener('keydown', e => {
    // 自動完成鍵盤操作
    if (acVisible && acItems.length) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        acIndex = (acIndex+1) % acItems.length;
        renderAC();
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        acIndex = (acIndex-1+acItems.length) % acItems.length;
        renderAC();
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        applyAC(acIndex);
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        hideAC();
        return;
      }
    }
    // Tab 縮排
    if (e.key === 'Tab' && !acVisible) {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
      editor.dispatchEvent(new Event('input'));
    }
  });

  editor.addEventListener('scroll', () => { if (acVisible) hideAC(); });
  editor.addEventListener('blur', () => setTimeout(hideAC, 150));

  document.addEventListener('click', e => {
    if (!editor.contains(e.target) && !acBox.contains(e.target)) hideAC();
  });

  /* 按鈕 */
  btnReset.addEventListener('click', () => {
    if (confirm('確定要載入預設範例嗎？目前的內容會被覆蓋。')) {
      editor.value = DEFAULT_CODE;
      editor.dispatchEvent(new Event('input'));
    }
  });

  btnClear.addEventListener('click', () => {
    if (confirm('確定要清空編輯區嗎？')) {
      editor.value = '';
      editor.dispatchEvent(new Event('input'));
      editor.focus();
    }
  });

  exampleSel.addEventListener('change', () => {
    const key = exampleSel.value;
    if (key && EXAMPLES[key]) {
      editor.value = EXAMPLES[key];
      editor.dispatchEvent(new Event('input'));
    }
    exampleSel.value = '';
  });

  /* ══════════════════════════════════════
     6. 初始化
     ══════════════════════════════════════ */
  (function init() {
    const saved = loadSaved();
    editor.value = saved !== null ? saved : DEFAULT_CODE;
    updatePreview();
    renderIssues(checkCode(editor.value));
    saveStatus.textContent = '💾 自動儲存已開啟';
    editor.focus();
  })();

})();
</script>
</body>
</html>
