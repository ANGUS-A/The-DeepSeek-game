<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手機 3D 殭屍生存 - 擬真狙擊版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }
        /* 左側虛擬搖桿 */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            touch-action: none;
            z-index: 10;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        /* 右側功能按鈕 */
        #shoot-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.6);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #scope-toggle-btn {
            position: absolute;
            bottom: 135px;
            right: 40px;
            width: 70px;
            height: 70px;
            background: rgba(0, 100, 255, 0.6);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: white;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        /* 狙擊鏡外框與遮罩 (預設隱藏) */
        #sniper-scope {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none;
            z-index: 5;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            background: radial-gradient(circle, rgba(0,0,0,0) 35%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0.95) 70%);
        }
        /* 狙擊鏡內部十字準星 */
        #scope-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            pointer-events: none;
            display: none;
            z-index: 6;
        }
        #scope-crosshair::before, #scope-crosshair::after {
            content: '';
            position: absolute;
            background: #111;
        }
        #scope-crosshair::before { top: 74px; left: 0; width: 150px; height: 2px; }
        #scope-crosshair::after { top: 0; left: 74px; width: 2px; height: 150px; }

        /* 倍率選擇選單 (開鏡後顯示在右側) */
        #zoom-menu {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .zoom-btn {
            width: 55px;
            height: 55px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid white;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zoom-btn.active {
            background: rgba(255, 165, 0, 0.8);
            border-color: yellow;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            display: none;
            text-shadow: 2px 2px 8px #000;
            z-index: 20;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">分數: <span id="score">0</span> | 生命: <span id="health">100</span></div>
    
    <div id="joystick-base"><div id="joystick-stick"></div></div>
    
    <div id="scope-toggle-btn">開鏡</div>
    <div id="shoot-btn">射擊</div>

    <!-- 狙擊鏡 UI 元素 -->
    <div id="sniper-scope"></div>
    <div id="scope-crosshair"></div>
    <div id="zoom-menu">
        <div class="zoom-btn" id="btn-4x" onclick="setZoom(4)">4X</div>
        <div class="zoom-btn" id="btn-8x" onclick="setZoom(8)">8X</div>
    </div>

    <div id="game-over">遊戲結束<br><span style="font-size: 20px; color: white;">重新整理頁面再試一次</span></div>

    <script>
        let scene, camera, renderer;
        let player = { x: 0, z: 0, rotY: 0, health: 100 };
        let zombies = [];
        let bullets = [];
        let score = 0;
        let isGameOver = false;
        
        let isScoped = false;
        let zoomLevel = 4; // 預設 4 倍

        // 觸控變數
        let moveTouchId = null;
        let joystickCenter = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 };

        let lookTouchId = null;
        let lastTouchX = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.035);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 燈光與地板
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createWalls();
            setupControls();
            window.addEventListener('resize', onWindowResize);

            setInterval(spawnZombie, 1500);
        }

        function createWalls() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444455 });
            const wallGeo = new THREE.BoxGeometry(100, 5, 2);

            const wall1 = new THREE.Mesh(wallGeo, wallMat);
            wall1.position.set(0, 2.5, -50);
            scene.add(wall1);

            const wall2 = wall1.clone();
            wall2.position.set(0, 2.5, 50);
            scene.add(wall2);

            const wall3 = new THREE.Mesh(new THREE.BoxGeometry(2, 5, 100), wallMat);
            wall3.position.set(-50, 2.5, 0);
            scene.add(wall3);

            const wall4 = wall3.clone();
            wall4.position.set(50, 2.5, 0);
            scene.add(wall4);
        }

        function setupControls() {
            const base = document.getElementById('joystick-base');
            const stick = document.getElementById('joystick-stick');
            const rect = base.getBoundingClientRect();
            joystickCenter.x = rect.left + rect.width / 2;
            joystickCenter.y = rect.top + rect.height / 2;

            // 螢幕觸控分流 (左邊 = 搖桿/走位，右邊 = 滑動/轉視角)
            window.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.clientX < window.innerWidth / 2) {
                        if (moveTouchId === null) {
                            moveTouchId = touch.identifier;
                            updateJoystick(touch);
                        }
                    } else {
                        if (lookTouchId === null) {
                            lookTouchId = touch.identifier;
                            lastTouchX = touch.clientX;
                        }
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.touches) {
                    if (touch.identifier === moveTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === lookTouchId) {
                        let deltaX = touch.clientX - lastTouchX;
                        // 依據倍率調整靈敏度，倍率越高轉動越細緻
                        let sensitivity = isScoped ? (0.005 / (zoomLevel / 2)) : 0.008;
                        player.rotY -= deltaX * sensitivity;
                        lastTouchX = touch.clientX;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === moveTouchId) {
                        moveTouchId = null;
                        joystickVector = { x: 0, y: 0 };
                        stick.style.transform = `translate(0px, 0px)`;
                    }
                    if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            }, { passive: false });

            // 開鏡按鈕
            document.getElementById('scope-toggle-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                toggleScope();
            });

            // 射擊按鈕
            document.getElementById('shoot-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                shootBullet();
            });
        }

        function toggleScope() {
            isScoped = !isScoped;
            const scopeBtn = document.getElementById('scope-toggle-btn');
            const scopeOverlay = document.getElementById('sniper-scope');
            const scopeCrosshair = document.getElementById('scope-crosshair');
            const zoomMenu = document.getElementById('zoom-menu');

            if (isScoped) {
                scopeBtn.innerText = "收鏡";
                scopeBtn.style.background = 'rgba(200, 0, 0, 0.8)';
                scopeOverlay.style.display = 'block';
                scopeCrosshair.style.display = 'block';
                zoomMenu.style.display = 'flex';
                setZoom(zoomLevel);
            } else {
                scopeBtn.innerText = "開鏡";
                scopeBtn.style.background = 'rgba(0, 100, 255, 0.6)';
                scopeOverlay.style.display = 'none';
                scopeCrosshair.style.display = 'none';
                zoomMenu.style.display = 'none';
                camera.fov = 75;
                camera.updateProjectionMatrix();
            }
        }

        function setZoom(level) {
            zoomLevel = level;
            if (zoomLevel === 4) {
                camera.fov = 25; // 4倍視野
                document.getElementById('btn-4x').classList.add('active');
                document.getElementById('btn-8x').classList.remove('active');
            } else {
                camera.fov = 12; // 8倍特寫視野
                document.getElementById('btn-8x').classList.add('active');
                document.getElementById('btn-4x').classList.remove('active');
            }
            camera.updateProjectionMatrix();
        }

        function updateJoystick(touch) {
            const maxDist = 40;
            let dx = touch.clientX - joystickCenter.x;
            let dy = touch.clientY - joystickCenter.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            document.getElementById('joystick-stick').style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector.x = dx / maxDist;
            joystickVector.y = dy / maxDist;
        }

        function spawnZombie() {
            if (isGameOver) return;

            const zombieGeo = new THREE.BoxGeometry(1, 2, 1);
            const zombieMat = new THREE.MeshStandardMaterial({ color: 0x338833 });
            const zombie = new THREE.Mesh(zombieGeo, zombieMat);

            const angle = Math.random() * Math.PI * 2;
            const radius = 35;
            zombie.position.set(player.x + Math.cos(angle) * radius, 1, player.z + Math.sin(angle) * radius);
            zombie.health = isScoped ? 1 : 2;

            scene.add(zombie);
            zombies.push(zombie);
        }

        function shootBullet() {
            if (isGameOver) return;

            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: isScoped ? 0x00ffcc : 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.set(player.x, 1.6, player.z);
            
            const bulletSpeed = isScoped ? 2.5 : 0.8;
            bullet.velocity = new THREE.Vector3(
                -Math.sin(player.rotY) * bulletSpeed,
                0,
                -Math.cos(player.rotY) * bulletSpeed
            );

            scene.add(bullet);
            bullets.push(bullet);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // 左側搖桿控制前後左右移動
            const speed = 0.12;
            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                player.x += Math.sin(player.rotY) * joystickVector.y * speed;
                player.z += Math.cos(player.rotY) * joystickVector.y * speed;
                
                // 順便讓搖桿左右也能稍微調整微幅方向
                player.rotY -= joystickVector.x * 0.02;
            }

            player.x = Math.max(-48, Math.min(48, player.x));
            player.z = Math.max(-48, Math.min(48, player.z));

            camera.position.set(player.x, 1.6, player.z);
            camera.rotation.y = player.rotY;

            // 子彈與殭屍邏輯
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.position.add(b.velocity);

                for (let j = zombies.length - 1; j >= 0; j--) {
                    let z = zombies[j];
                    if (b.position.distanceTo(z.position) < 1.2) {
                        z.health--;
                        scene.remove(b);
                        bullets.splice(i, 1);

                        if (z.health <= 0) {
                            scene.remove(z);
                            zombies.splice(j, 1);
                            score += 10;
                            document.getElementById('score').innerText = score;
                        }
                        break;
                    }
                }
            }

            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                z.lookAt(player.x, z.position.y, player.z);
                z.translateZ(0.04);

                if (z.position.distanceTo(new THREE.Vector3(player.x, 1, player.z)) < 1.0) {
                    player.health -= 1;
                    document.getElementById('health').innerText = player.health;
                    if (player.health <= 0) {
                        isGameOver = true;
                        document.getElementById('game-over').style.display = 'block';
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
